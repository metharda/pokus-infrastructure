# Managed by pinka (ansible/check-mode.yml). Local changes will be overwritten.
#
# Required CI fast lane (BUILD_PROMPT §11, §19.9; approved deviation I2): the
# provider-agnostic roles install_record, base, users_groups, ssh and layout
# in check mode, against a systemd container of one distribution family, with
# the host profile that preflight wrote inside the container. Nothing is skipped.
# platform_facts only derives the facts these roles read. Run by
# `make check-mode` (tools/test-distros); it refuses to run without --check.
# The whole play runs in the separate, non-blocking `make check-mode-extended`.
- name: Check mode of the provider-agnostic roles
  hosts: localhost
  gather_facts: true
  vars_files:
    - "inventory/host_vars/{{ machine }}.yml"
  vars:
    pinka_dir: "{{ playbook_dir | dirname }}"
  pre_tasks:
    - name: Refuse to run except in check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
          - machine is defined
          - host_profile is mapping
          - host_profile.schema_version == 1
          - pinka_bootstrap is mapping
        fail_msg: This play only runs with --check, from make check-mode.
        quiet: true
      tags: [always]

  tasks:
    - name: Derive the platform facts
      ansible.builtin.import_role:
        name: platform_facts
      tags: [platform_facts, always]

    - name: Record what existed before pinka (check mode shows the record)
      ansible.builtin.import_role:
        name: install_record
      tags: [install_record, always]

    - name: Base system
      ansible.builtin.import_role:
        name: base
      tags: [base]

    - name: Groups and accounts
      ansible.builtin.import_role:
        name: users_groups
      tags: [users_groups]

    - name: SSH
      ansible.builtin.import_role:
        name: ssh
      tags: [ssh]

    - name: Research space layout
      ansible.builtin.import_role:
        name: layout
      tags: [layout]
