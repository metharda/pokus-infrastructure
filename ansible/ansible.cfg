# Managed by pinka (ansible/ansible.cfg). Local changes will be overwritten.
#
# Bootstrap runs ansible-playbook with ANSIBLE_CONFIG pointing here, so no
# user or system Ansible configuration is read. Relative paths are resolved
# against this directory.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# The install record's module (install_record role), which every role calls.
library = roles/install_record/library
filter_plugins = filter_plugins
callback_plugins = callback_plugins
# Progress events for the installer TUI; written only when PINKA_EVENTS_FILE
# or PINKA_EVENTS_FD is set (BUILD_PROMPT §18.5).
callbacks_enabled = pinka_events
collections_path = /opt/pinka/ansible-collections
# Facts are read only as ansible_facts['...'].
inject_facts_as_vars = False
retry_files_enabled = False
nocows = True
