# Managed by pinka (ansible/roles/platform_facts/vars/main.yml). Local changes will be overwritten.

# Commands of the components installed from vendor repositories. In check mode
# their presence before the run is recorded in pinka_present.commands: until
# the repository is really added, its packages cannot be resolved, so these
# roles end after their repository step in check mode while the command is
# missing (docker, incus, tailscale, nvidia_container_toolkit).
platform_facts_component_commands: [dockerd, incus, tailscale, nvidia-ctk]

# A dotted-quad IPv4 address (vm_collector_address).
platform_facts_ipv4_pattern: '^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$'
