# Managed by pinka (ansible/roles/platform_facts/tasks/main.yml). Local changes will be overwritten.
#
# The only place that interprets the distribution (BUILD_PROMPT §19.1). Every
# fact comes from the host profile that preflight wrote, so Ansible and
# preflight never disagree about the host.
- name: Check that the host profile is available
  ansible.builtin.assert:
    that:
      - host_profile is mapping
      - host_profile.family in ['debian', 'redhat', 'suse', 'archlinux']
    fail_msg: "The host profile is missing or its family is unsupported; run the play through bootstrap/bootstrap.sh."
    quiet: true

- name: Load the family variables
  ansible.builtin.include_vars:
    file: "{{ host_profile.family }}.yml"

- name: Load the component source matrix
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/component-sources.yml"
    name: platform_facts_sources

- name: Derive the release identity
  ansible.builtin.set_fact:
    platform_facts_identity: "{{ host_profile | pinka_release_identity(platform_facts_family.codenames) }}"

- name: Resolve the provider
  ansible.builtin.assert:
    that:
      - lab_provider in ['auto', host_profile.provider]
    fail_msg: >-
      lab_provider is '{{ lab_provider }}' but preflight detected '{{ host_profile.provider }}'.
      Set lab_provider to auto or to the detected provider.
    quiet: true

- name: Set the platform facts
  ansible.builtin.set_fact:  # noqa: var-naming[no-role-prefix] - fact names defined by BUILD_PROMPT §19.1
    pinka_family: "{{ host_profile.family }}"
    pinka_distro: "{{ platform_facts_identity.distro }}"
    pinka_release: "{{ platform_facts_identity.release }}"
    pinka_parent_release: "{{ host_profile.os.parent_release }}"
    pinka_release_key: "{{ platform_facts_identity.release_key }}"
    pinka_release_identity: "{{ platform_facts_identity }}"
    pinka_source_group: "{{ platform_facts_identity.source_group }}"
    pinka_release_model: "{{ host_profile.release_model }}"
    pinka_pkg_manager: "{{ host_profile.pkg_manager }}"
    pinka_service_names: "{{ platform_facts_family.service_names }}"
    pinka_initramfs_tool: "{{ platform_facts_family.initramfs_tool }}"
    pinka_version_hold_method: "{{ platform_facts_family.version_hold_method }}"
    pinka_provider: "{{ host_profile.provider }}"
    pinka_mac: "{{ host_profile.mac.system }}"
    pinka_firewall_backend: "{{ firewall_backend if firewall_backend != 'auto' else host_profile.firewall.backend }}"
    pinka_repositories: "{{ platform_facts_sources.repositories }}"
    pinka_component_sources: "{{ platform_facts_sources.components }}"
    pinka_community_repos_allowed: "{{ allow_community_repos | bool or (pinka_bootstrap.allow_community_repos | default(false)) | bool }}"

- name: Check the firewall backend
  ansible.builtin.assert:
    that:
      - pinka_firewall_backend in ['nftables', 'firewalld', 'ufw']
    fail_msg: "firewall_backend must be auto, nftables, firewalld or ufw."
    quiet: true

# BUILD_PROMPT §12.11: ports are overridden by name; the effective ports must
# stay distinct from each other and from the lab's internal listeners.
- name: Check the port overrides
  ansible.builtin.assert:
    that:
      - ports is mapping
      - ports.keys() | difference(pinka_default_ports.keys()) | length == 0
      - ports.values() | select('integer') | select('ge', 1) | select('le', 65535) | list | length == ports | length
      - pinka_ports.values() | unique | list | length == pinka_ports | length
      - pinka_ports.values() | intersect(pinka_internal_ports.values()) | length == 0
    fail_msg: >-
      ports must map names of {{ pinka_default_ports.keys() | join(', ') }} to TCP ports
      (1-65535); the effective ports {{ pinka_ports }} must be distinct and must not use the
      lab's internal ports {{ pinka_internal_ports.values() | sort | join(', ') }}.
    quiet: true

- name: Check the address of the collector listener for VM targets
  ansible.builtin.assert:
    that:
      - vm_collector_address is string
      - vm_collector_address is match(platform_facts_ipv4_pattern)
      - vm_collector_address is not match('^(0|127)[.]')
    fail_msg: "vm_collector_address must be an IPv4 address outside 0.0.0.0/8 and 127.0.0.0/8, not {{ vm_collector_address }}."
    quiet: true

# Check mode changes nothing, so what exists when the play starts is what
# exists throughout it: tasks that need a unit or an account created earlier
# in the same run are skipped in check mode while it is missing.
- name: List the systemd units that exist before the run (check mode)
  ansible.builtin.command:
    argv: [systemctl, list-unit-files, --no-legend, --no-pager, --plain]
  register: platform_facts_unit_files
  changed_when: false
  check_mode: false
  when: ansible_check_mode

- name: Read the accounts that exist before the run (check mode)
  ansible.builtin.getent:
    database: passwd
  when: ansible_check_mode

# A package from a vendor repository cannot be resolved in check mode before
# the repository is really added, so the roles of these components end after
# their repository step in check mode while the command is missing.
- name: Look for the component commands that exist before the run (check mode)
  ansible.builtin.shell:
    cmd: |
      for command in {{ platform_facts_component_commands | join(' ') }}; do
        if command -v "$command" >/dev/null 2>&1; then echo "$command"; fi
      done
    executable: /bin/sh
  register: platform_facts_commands
  changed_when: false
  check_mode: false
  when: ansible_check_mode

- name: Record what exists before the run (check mode)
  ansible.builtin.set_fact:  # noqa: var-naming[no-role-prefix] - shared fact like the pinka_* facts above
    pinka_present:
      units: "{{ (platform_facts_unit_files.stdout_lines | default([])) | select | map('split') | map('first') | list }}"
      users: "{{ (ansible_facts.getent_passwd | default({}) if ansible_check_mode else {}) | list }}"
      commands: "{{ platform_facts_commands.stdout_lines | default([]) }}"

- name: Show the platform facts
  ansible.builtin.debug:
    msg: >-
      family={{ pinka_family }} distro={{ pinka_distro }} release={{ pinka_release }}
      release_key={{ pinka_release_key or '(rolling, not pinned)' }} provider={{ pinka_provider }}
      firewall={{ pinka_firewall_backend }} mac={{ pinka_mac }}
