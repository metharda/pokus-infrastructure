# Managed by pinka (ansible/roles/install_record/tasks/main.yml). Local changes will be overwritten.
#
# The install record: written once, at the first install
# and before any change to the host, with what existed before pinka; the
# roles add what they create (pinka_install_record state=add) and read the
# record through pinka_preexisting. Check mode writes nothing and shows the
# record a real run would write.
- name: Write the install record at the first install
  pinka_install_record:
    path: "{{ install_record_path }}"
    state: init
    components: "{{ host_profile.components | default({}) }}"
    access: "{{ host_profile.access | default({}) }}"
    pkg_manager: "{{ pinka_pkg_manager }}"
    managed_files: "{{ install_record_managed_files }}"
    originals: "{{ install_record_originals }}"
  register: install_record_init

# A legacy record (the host was provisioned before the record existed) lists
# pinka's own items as pre-existing, so it decides nothing; components then
# follow preflight's marks (host_profile.components).
- name: Expose what existed before pinka
  ansible.builtin.set_fact:  # noqa: var-naming[no-role-prefix] - shared fact like the pinka_* facts
    pinka_preexisting: >-
      {{ {} if install_record_init.record.legacy | default(false)
         else install_record_init.record.preexisting | default({}) }}
    # The pre-existing access already closed with the owner's consent
    # (tcp/8080, install_path).
    pinka_closed_access: "{{ install_record_init.record.added.closed_access | default([]) }}"

# Before anything changes: every listener named in firewall_close_listeners is
# one preflight recorded and one the firewall can close; the filter
# names what is wrong.
- name: Check the listeners the owner consented to close
  ansible.builtin.assert:
    that: >-
      (pinka_preexisting.access | default({}))
      | pinka_listener_rules(firewall_close_listeners, pinka_closed_access) is mapping
    quiet: true
  when: firewall_close_listeners | length > 0

- name: Show what a real run would record (check mode)
  ansible.builtin.debug:
    msg: >-
      {{ install_record_path }} would record {{ install_record_init.record.preexisting.packages | length }}
      packages, {{ install_record_init.record.preexisting.users | length }} accounts and these components as
      existing before pinka: {{ install_record_init.record.preexisting.components | dict2items
      | selectattr('value.installed', 'defined') | selectattr('value.installed') | map(attribute='key')
      | list | join(', ') or 'none' }}.
  when:
    - ansible_check_mode
    - install_record_init.changed
