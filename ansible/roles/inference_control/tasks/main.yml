# Managed by pinka (ansible/roles/inference_control/tasks/main.yml). Local changes will be overwritten.
#
# Split inference (BUILD_PROMPT §19.10, contracts.md#inference): every lab and
# inference node gets a self-signed identity certificate in
# /etc/pinka/inference; `pinka pair` exchanges the certificates. A lab node
# runs the root-run inference forwarder, which alone uses its client key on
# behalf of the platform (§12.8); an inference node runs
# pinka-inference-control, mutual TLS on its tailnet address, once paired.
- name: Check the node role
  ansible.builtin.assert:
    that:
      - node_role in ['lab', 'inference']
      - node_role != 'inference' or (pinka_features.gpu_inference | default(false))
    fail_msg: >-
      The inference_control role runs on lab and inference nodes only, and an
      inference node needs the gpu_inference feature (node_role: {{ node_role }}).
    quiet: true

- name: Create the directory of the mTLS material
  ansible.builtin.file:
    path: "{{ inference_control_dir }}"
    state: directory
    owner: root
    group: "{{ inference_control_account }}"
    mode: "0750"
  register: inference_control_dir_state

- name: Create the node's private key
  community.crypto.openssl_privatekey:
    path: "{{ inference_control_key }}"
    type: ECC
    curve: secp256r1
    owner: root
    group: "{{ inference_control_key_group }}"
    mode: "{{ inference_control_key_mode }}"
  when: not (ansible_check_mode and inference_control_dir_state is changed)  # the directory may not exist yet

# The tailnet name is the subject alternative name: the paired node's
# clients and the collectors verify the peer by it.
- name: Create the node's identity certificate
  when: not ansible_check_mode
  block:
    - name: Create the certificate request
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ inference_control_key }}"
        common_name: "{{ machine_name }}"
        subject_alt_name: ["DNS:{{ machine_name }}"]
        use_common_name_for_san: false
        basic_constraints: ["CA:FALSE"]
        basic_constraints_critical: true
        extended_key_usage: [serverAuth, clientAuth]
      register: inference_control_csr

    - name: Issue the self-signed certificate
      community.crypto.x509_certificate:
        path: "{{ inference_control_cert }}"
        csr_content: "{{ inference_control_csr.csr }}"
        privatekey_path: "{{ inference_control_key }}"
        provider: selfsigned
        selfsigned_not_after: "+{{ inference_control_certificate_days }}d"
        owner: root
        group: "{{ inference_control_account }}"
        mode: "0644"
      notify: Restart the inference control endpoint

- name: Check the pairing
  ansible.builtin.include_tasks: pairing.yml

- name: Set up the control endpoint
  ansible.builtin.include_tasks: endpoint.yml
  when: node_role == 'inference'

- name: Set up the inference forwarder
  ansible.builtin.include_tasks: forwarder.yml
  when: node_role == 'lab'
