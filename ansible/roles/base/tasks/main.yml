# Managed by pinka (ansible/roles/base/tasks/main.yml). Local changes will be overwritten.
#
# Base system: packages by logical name, UTC, persistent
# journald with limits, time sync, automatic security updates, sysctl.
- name: Load the package names of this family
  ansible.builtin.include_vars:
    file: "{{ pinka_family }}.yml"

- name: Install the base packages
  ansible.builtin.include_role:
    name: pkg
  vars:
    pkg_packages: >-
      {{ base_packages
         | map('extract', base_package_names | combine(base_package_overrides[pinka_source_group] | default({})))
         | select | list }}

# Uninstall sets the time zone and the kernel settings back:
# the values before pinka first changes them, noted first.
- name: Read the time zone and the kernel settings
  ansible.builtin.shell:
    cmd: |
      zone=$(timedatectl show --property=Timezone --value 2>/dev/null) || zone=''
      if [ -z "$zone" ]; then
        zone=$(readlink /etc/localtime 2>/dev/null) || zone=''
        case $zone in */zoneinfo/*) zone=${zone#*/zoneinfo/} ;; *) zone='' ;; esac
      fi
      printf 'timezone=%s\n' "$zone"
      for key in {{ base_sysctl.keys() | join(' ') }}; do
        printf 'sysctl:%s=%s\n' "$key" "$(sysctl -n "$key" 2>/dev/null)"
      done
    executable: /bin/sh
  register: base_settings_now
  changed_when: false
  check_mode: false

- name: Record the settings pinka changes, as they were
  pinka_install_record:
    state: add
    added:
      changed: "{{ base_settings_before }}"
  vars:
    base_settings_before: >-
      {{ base_settings_now.stdout_lines | pinka_settings_before(
           {'timezone': 'UTC'} | combine(dict(base_sysctl.keys() | map('regex_replace', '^', 'sysctl:')
                                              | zip(base_sysctl.values())))) }}
  when: base_settings_before | length > 0

- name: Set the system time zone to UTC
  community.general.timezone:
    name: UTC

- name: Configure journald (persistent, size-limited)
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/60-pinka.conf
    owner: root
    group: root
    mode: "0644"
  register: base_journald

- name: Restart journald with these settings
  # Not a handler: the observability role's journal collector, started
  # later in the run, mounts the journal where these settings put it.
  ansible.builtin.systemd_service:  # noqa: no-handler
    name: systemd-journald
    state: restarted
  when: base_journald is changed

- name: Find the persistent journal
  ansible.builtin.stat:
    path: /var/log/journal
    follow: true
  register: base_journal_before

# A journal that was volatile becomes persistent at the next boot's flush.
# This does now what that boot does: journald's flush creates
# /var/log/journal and this machine's directory in it, then tmpfiles.d gives
# that directory journald's group (systemd-journal) and the setgid bit that
# gives new journal files the group, with which the journal collector reads
# them. Where an operator's later drop-in keeps the journal volatile, the
# flush creates nothing. The same where journald's restart or a person made
# the directory without tmpfiles.d (root:root 0755); a rotation then starts
# new files, since those journald made before keep root's group. Only this
# machine's directory: tmpfiles.d does not follow a link at /var/log/journal
# and fails on it, and the collector needs no more than that directory.
- name: Move the journal to persistent storage
  ansible.builtin.command:
    argv: [journalctl, --flush]
  changed_when: false  # what it changes, the next tasks find and report
  when: not base_journal_before.stat.exists

- name: Read the machine ID
  ansible.builtin.slurp:
    src: /etc/machine-id
  register: base_machine_id

- name: Name this machine's journal directory
  ansible.builtin.set_fact:
    base_journal_dir: "/var/log/journal/{{ base_machine_id.content | b64decode | trim }}"

- name: Find this machine's persistent journal
  ansible.builtin.stat:
    path: "{{ base_journal_dir }}"
    follow: true
  register: base_journal

- name: Give this machine's persistent journal journald's group and modes
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [systemd-tmpfiles, --create, --prefix, "{{ base_journal_dir }}"]
    - [journalctl, --rotate]
  changed_when: true
  when: >-
    base_journal.stat.exists
    and (base_journal.stat.gr_name | default('') != 'systemd-journal' or not base_journal.stat.isgid)

- name: Find this machine's persistent journal again
  ansible.builtin.stat:
    path: "{{ base_journal_dir }}"
    follow: true
  register: base_journal_now
  when: not ansible_check_mode

# Where this host's tmpfiles.d does not give both, every run would try again
# and the journal collector would read nothing.
- name: Check that this machine's persistent journal has journald's group
  ansible.builtin.assert:
    that: >-
      not base_journal_now.stat.exists
      or (base_journal_now.stat.gr_name | default('') == 'systemd-journal' and base_journal_now.stat.isgid | bool)
    fail_msg: >-
      {{ base_journal_dir }} (group {{ base_journal_now.stat.gr_name | default('?') }}, mode
      {{ base_journal_now.stat.mode | default('?') }}) needs the group systemd-journal and the
      setgid bit, which systemd's tmpfiles.d (systemd.conf) gives it; this host's tmpfiles.d
      does not give it both. Restore systemd's lines for /var/log/journal and run
      systemd-tmpfiles --create --prefix {{ base_journal_dir }}, or give the directory the
      group systemd-journal and the mode 2755 yourself.
    quiet: true
  when: not ansible_check_mode

- name: Keep time synchronized
  ansible.builtin.include_tasks: timesync.yml

- name: Configure automatic security updates
  ansible.builtin.include_tasks: "updates_{{ pinka_family }}.yml"

- name: Apply the kernel settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/60-pinka.conf
    sysctl_set: true
    state: present
  loop: "{{ base_sysctl | dict2items }}"

- name: Check the CPU sets of services and targets
  ansible.builtin.assert:
    that:
      - base_cpus_services | intersect(base_cpus_targets) | length == 0
      - (base_cpus_services + base_cpus_targets) | select('ge', base_cpu_count) | list | length == 0
    fail_msg: >-
      cpuset_services ({{ cpuset_services }}) and cpuset_targets ({{ cpuset_targets }})
      must not overlap and must name CPUs below {{ base_cpu_count }} (this host's CPUs)
    quiet: true
  vars:
    base_cpus_services: "{{ cpuset_services | pinka_cpuset_cpus }}"
    base_cpus_targets: "{{ cpuset_targets | pinka_cpuset_cpus }}"
    base_cpu_count: "{{ host_profile.hardware.cpu_threads | int }}"

- name: Write the slice of the lab services
  ansible.builtin.template:
    src: pinka-services.slice.j2
    dest: "/etc/systemd/system/{{ pinka_services_slice }}"
    owner: root
    group: root
    mode: "0644"
  register: base_services_slice

# Now, not in a handler: Docker and the lab units place themselves in the slice
# later in this play. A running slice takes a changed CPU set at the next lab
# start (doctor check resources.cpusets reports the difference).
- name: Load the slice of the lab services
  ansible.builtin.systemd_service:
    daemon_reload: "{{ base_services_slice is changed }}"
