# Managed by pinka (ansible/roles/base/meta/argument_specs.yml). Local changes will be overwritten.
argument_specs:
  main:
    short_description: Base system.
    options:
      allow_kernel_updates:
        type: bool
        required: true
        description: On bare metal, let automatic updates install kernels (default false).
      base_packages:
        type: list
        elements: str
        default: []
        description: Logical package names, mapped per family in vars/<family>.yml.
      base_journald_system_max_use:
        type: str
        default: 2G
        description: journald SystemMaxUse.
      base_journald_system_keep_free:
        type: str
        default: 4G
        description: journald SystemKeepFree.
      base_auto_updates:
        type: bool
        default: true
        description: Automatic security updates on fixed releases (never on rolling releases).
      base_auto_updates_effective:
        type: bool
        default: true
        description: Derived; base_auto_updates and not a rolling release.
      base_held_package_patterns:
        type: list
        elements: str
        default: []
        description: Packages automatic updates never touch (pinned by pinka).
      base_hold_kernel:
        type: bool
        default: false
        description: Derived; hold the kernel (bare metal unless allow_kernel_updates).
      base_kernel_package_patterns:
        type: list
        elements: str
        default: []
        description: Kernel package patterns for apt.
      base_kernel_package_patterns_rpm:
        type: list
        elements: str
        default: []
        description: Kernel package patterns for dnf.
      base_sysctl:
        type: dict
        default: {}
        description: Kernel settings in /etc/sysctl.d/60-pinka.conf.
