# Managed by pinka (ansible/roles/base/vars/redhat.yml). Local changes will be overwritten.
#
# TODO(verify): package names (Fedora and EL mirrors are not reachable from
# the build environment). RHEL-compatible releases ship neither btrfs-progs nor
# htop in their base repositories. curl is named by its file: minimal and
# container installs ship curl-minimal, which conflicts with the curl package
# and provides /usr/bin/curl as well (found by the CI fast lane on EL 9).
base_package_names:
  ca_certificates: ca-certificates
  curl: /usr/bin/curl
  gpg: gnupg2
  jq: jq
  git: git
  acl: acl
  btrfs_tools: btrfs-progs
  lvm2: lvm2
  thin_provisioning_tools: device-mapper-persistent-data
  nftables: nftables
  rsync: rsync
  tmux: tmux
  htop: htop
  iotop: iotop
  sysstat: sysstat
  sudo: sudo
  xz: xz
  zstd: zstd
  bzip2: bzip2
  tar: tar
  python_debian: ""  # Debian family only
base_package_overrides:
  rhel_like: {btrfs_tools: null, htop: null}
base_timesync_default_package: chrony
base_timesync_default_service: chronyd
