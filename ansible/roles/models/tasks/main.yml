# Managed by pinka (ansible/roles/models/tasks/main.yml). Local changes will be overwritten.
#
# The models of models.lock.yml (contracts.md#paths): the
# pinned huggingface_hub CLI in an isolated uv environment, then one
# models-fetch run per entry, which downloads only what is missing, verifies
# every sha256, makes the files 0444 and writes MANIFEST.json. Verified
# entries are never downloaded again. Adapters are not downloaded: only the
# GPU arbiter registers them. Tag: models.
- name: Read the model lock
  ansible.builtin.set_fact:
    models_lock: "{{ lookup('ansible.builtin.file', pinka_dir ~ '/models.lock.yml') | from_yaml }}"

- name: Fetch the pinned models
  when: models_lock.models | length > 0
  block:
    - name: Create the environment of the download tool
      ansible.builtin.command:
        argv: ["{{ models_uv }}", venv, --python, "{{ pinka_python }}", "{{ models_venv }}"]
        creates: "{{ models_venv }}/bin/python"
      environment: &models_uv_env
        UV_NO_CONFIG: "1"
        UV_CACHE_DIR: /var/cache/pinka/uv
        UV_PYTHON_DOWNLOADS: never

    - name: Copy the hash-locked requirements
      ansible.builtin.copy:
        src: requirements.lock
        dest: "{{ models_venv }}/requirements.lock"
        owner: root
        group: root
        mode: "0644"

    # uv reports "Checked N packages" when the environment already matches the lock.
    - name: Install the pinned huggingface_hub
      ansible.builtin.command:
        argv:
          - "{{ models_uv }}"
          - pip
          - sync
          - --require-hashes
          - --python
          - "{{ models_venv }}/bin/python"
          - "{{ models_venv }}/requirements.lock"
      environment: *models_uv_env
      register: models_sync
      changed_when: models_sync.stderr is search('(Installed|Uninstalled) [0-9]+ package')

    - name: Install models-fetch
      ansible.builtin.copy:
        src: pinka_models_fetch.py
        dest: /usr/local/libexec/pinka/models-fetch
        owner: root
        group: root
        mode: "0755"

    - name: Read the group of the weights
      ansible.builtin.getent:
        database: group
        key: pinka
        fail_key: "{{ not ansible_check_mode }}"

    # The token of gated entries goes in on stdin, never on a command line.
    - name: Download and verify the entries
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/local/libexec/pinka/models-fetch', '--entry', item | to_json,
              '--root', models_root, '--hf', models_venv ~ '/bin/hf',
              '--uid', '0',
              '--gid', ansible_facts.getent_group['pinka'][1],
              '--tool-version', pinka_versions.python.model_tools['huggingface-hub'],
              '--token-stdin' if item.gated else '--no-token']
             + (['--reverify'] if models_reverify | bool else []) }}
        stdin: "{{ models_hf_token if item.gated else omit }}"
      loop: "{{ models_lock.models }}"
      loop_control:
        label: "{{ item.id }}"
      register: models_fetch
      changed_when: (models_fetch.stdout | from_json).changed
      no_log: "{{ models_lock.models | selectattr('gated') | list | length > 0 }}"
      when: not ansible_check_mode
