# Managed by pinka (ansible/roles/models/meta/argument_specs.yml). Local changes will be overwritten.
argument_specs:
  main:
    short_description: Download the pinned models of models.lock.yml and verify every file.
    options:
      pinka_dir:
        type: path
        required: true
        description: Infra directory of the checkout (models.lock.yml).
      pinka_python:
        type: path
        required: true
        description: The pinned CPython the environment is created with.
      models_root:
        type: path
        description: Root of the weights (pinka_root/models); its adapters/ belongs to the GPU arbiter.
      models_venv:
        type: path
        default: /opt/pinka/models-venv
        description: Isolated environment of the pinned huggingface_hub CLI.
      models_uv:
        type: path
        default: /opt/pinka/bin/uv
        description: Pinned uv installed by bootstrap.
      models_hf_token:
        type: str
        description: Hugging Face token for gated entries (default vault_hf_token).
      models_reverify:
        type: bool
        default: false
        description: Hash verified files again (restore.yml) and re-download missing or changed ones.
