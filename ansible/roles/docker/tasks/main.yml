# Managed by pinka (ansible/roles/docker/tasks/main.yml). Local changes will be overwritten.
#
# Docker Engine with the Compose v2 plugin and buildx (BUILD_PROMPT §7.6).
# A Docker Engine that existed before pinka (preflight's components, §2.2) is
# used as it is: pinka never installs, pins, holds, configures or restarts
# it; preflight has stopped where the lab could not run with it unchanged
# (not running, a plugin missing, CDI off with a GPU). Otherwise install.yml
# installs Docker from the component source matrix, pinned and held, and
# writes /etc/docker/daemon.json, the only file of Docker pinka writes. The
# lab's other Docker settings live in its Compose projects (compose role).
- name: Decide whose Docker Engine this is
  ansible.builtin.set_fact:
    docker_preexisting: >-
      {{ (host_profile.components.docker | default({})).origin | default(none) == 'pre-existing' }}

- name: Install and configure Docker Engine
  ansible.builtin.include_tasks: install.yml
  when: not docker_preexisting

- name: Use the Docker Engine that existed before pinka as it is
  ansible.builtin.debug:
    msg: >-
      Docker Engine {{ host_profile.components.docker.version | default('') }} existed before pinka:
      its packages, daemon.json and service stay as they are.
  when: docker_preexisting

- name: Check that break-glass Docker access is only given to admins
  ansible.builtin.assert:
    that:
      - item in (researchers | selectattr('admin', 'true') | map(attribute='name') | list)
    fail_msg: "break_glass_docker lists {{ item }}, who is not an admin researcher."
    quiet: true
  loop: "{{ break_glass_docker }}"

- name: Record the break-glass memberships pinka adds
  pinka_install_record:
    state: add
    added:
      memberships: [{user: "{{ item }}", group: docker}]
  loop: "{{ break_glass_docker }}"

- name: Add break-glass admins to the docker group (root-equivalent; recorded in the fingerprint)
  ansible.builtin.user:
    name: "{{ item }}"
    groups: [docker]
    append: true
  loop: "{{ break_glass_docker }}"
