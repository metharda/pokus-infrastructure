# Managed by pinka (ansible/roles/docker/tasks/install.yml). Local changes will be overwritten.
#
# A Docker Engine pinka installs itself (BUILD_PROMPT §7.6): from the source
# the component source matrix selects, pinned and held, with a daemon.json
# that holds only what such an install needs. The install record notes the
# component before anything is installed (§7.21).
- name: Look up the Docker source
  ansible.builtin.set_fact:
    docker_source: "{{ pinka_component_sources | pinka_component_source('docker', pinka_source_group) }}"
    docker_versions: "{{ pinka_versions.packages | pinka_lock_packages('docker', pinka_release_key) }}"

- name: Refuse an unverified Docker source
  ansible.builtin.assert:
    that:
      - docker_source.verify is not defined
    fail_msg: >-
      ansible/component-sources.yml marks the Docker source for {{ pinka_source_group }}
      as unverified ({{ docker_source.verify | default('') }}); verify it first
      (docs/how-to/update-versions.md).
    quiet: true

- name: Record that pinka installs Docker Engine
  pinka_install_record:
    state: add
    added:
      components: {docker: true}

- name: Add the Docker repository
  ansible.builtin.include_role:
    name: pkg
    tasks_from: repo
  vars:
    pkg_repo_name: "{{ docker_source.repo }}"
  when: docker_source.source == 'vendor_repo'

# The repository is not really added in check mode, so its packages cannot be
# resolved; everything below needs Docker installed.
- name: Skip the rest in check mode before Docker is installed
  ansible.builtin.meta: end_role
  when:
    - ansible_check_mode
    - "'dockerd' not in pinka_present.commands"

- name: Install Docker Engine, Compose and buildx
  ansible.builtin.include_role:
    name: pkg
  vars:
    pkg_packages: "{{ docker_source.packages }}"
    pkg_versions: "{{ docker_versions }}"

- name: Hold the Docker packages
  ansible.builtin.include_role:
    name: pkg
    tasks_from: hold
  vars:
    pkg_hold_name: docker
    pkg_hold_packages: "{{ docker_source.packages }}"
    pkg_versions: "{{ docker_versions }}"

- name: Read the Docker Engine version
  ansible.builtin.command:
    argv: [dockerd, --version]
  register: docker_dockerd_version
  changed_when: false
  check_mode: false

# Docker 28.2 and later enable CDI unless features.cdi is false (verified in
# moby's source, docker-v29.8.2); an older engine, possible only where the
# distribution's own package is used, needs features.cdi, and one without CDI
# support the NVIDIA runtime.
- name: Decide what the daemon configuration needs for the GPU
  ansible.builtin.set_fact:
    docker_gpu_setting: >-
      {{ 'none' if not (pinka_features.gpu_inference | default(false) or pinka_features.gpu_training | default(false))
         else ('none' if docker_engine_version is version(docker_cdi_default_since, '>=')
               else ('cdi' if docker_engine_version is version(docker_cdi_min_version, '>=') else 'runtime')) }}
  vars:
    docker_engine_version: >-
      {{ (docker_dockerd_version.stdout | regex_search('version ([0-9]+\.[0-9]+)', '\1') or [docker_cdi_default_since]) | first }}

- name: Create /etc/docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure the Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: dockerd --validate --config-file=%s
  notify: Restart Docker

- name: Enable Docker
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started

- name: Apply a changed daemon configuration now
  ansible.builtin.meta: flush_handlers
