# Managed by pinka (ansible/roles/ssh/tasks/main.yml). Local changes will be overwritten.
#
# sshd hardening through a drop-in that sorts before the
# distributions' own drop-ins (first value wins in sshd). Exposure is limited
# by the firewall role: tailscale0 plus ssh_extra_allowed_interfaces only.
- name: Install the OpenSSH server
  ansible.builtin.include_role:
    name: pkg
  vars:
    pkg_packages: ["{{ ssh_server_package[pinka_family] }}"]

- name: Make the drop-in directory the first directive of sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    regexp: '^\s*Include\s+/etc/ssh/sshd_config\.d/\*\.conf\s*$'
    insertbefore: BOF
    firstmatch: true
    owner: root
    group: root
    mode: "0644"
  notify: sshd configuration changed
  # In check mode the package above is not installed (pinka_present: platform_facts).
  when: not ansible_check_mode or (pinka_service_names.ssh ~ '.service') in pinka_present.units

- name: Install the pinka sshd drop-in
  ansible.builtin.template:
    src: 10-pinka.conf.j2
    dest: /etc/ssh/sshd_config.d/10-pinka.conf
    owner: root
    group: root
    mode: "0644"
  notify: sshd configuration changed

- name: Enable sshd
  ansible.builtin.systemd_service:
    name: "{{ pinka_service_names.ssh }}"
    enabled: true
    state: started
  when: not ansible_check_mode or (pinka_service_names.ssh ~ '.service') in pinka_present.units
