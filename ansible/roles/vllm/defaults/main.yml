# Managed by pinka (ansible/roles/vllm/defaults/main.yml). Local changes will be overwritten.

# Serving profile of this host (vllm/profiles/<name>.yml).
vllm_profile: ada-12g
# Deployment to serve after installation, or null to install vLLM without
# serving (doctor then warns "inference: no deployment"). Keys: model_id (from
# models.lock.yml), start_after_install (default true), and optionally id
# (default "default-<profile>"), version (default 1; change it whenever the
# spec changes, deployment files are immutable), overrides and
# sampling_defaults. tool_call_parser defaults to the model's entry in
# models.catalog.yml.
vllm_default_deployment: null
# Seconds `docker compose up --wait` waits for vLLM to load the model.
vllm_wait_timeout: 1200
# Run the serving verification (health, models, chat, tool call) after start.
vllm_verify: true
