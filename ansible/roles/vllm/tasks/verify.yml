# Managed by pinka (ansible/roles/vllm/tasks/verify.yml). Local changes will be overwritten.
#
# Serving verification: /health, /v1/models, one
# deterministic chat completion and one get_time tool call; the report is
# /var/lib/pinka/verify/vllm-<deployment>.json.
- name: Read the current deployment
  ansible.builtin.slurp:
    src: /etc/pinka/vllm/current.yml
  register: vllm_current_spec

- name: Run the serving verification
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/pinka/vllm-verify
      - --port
      - "{{ pinka_ports.vllm | string }}"
      - --model
      - "{{ vllm_spec.model_id }}"
      - --deployment
      - "{{ vllm_spec.id }}@{{ vllm_spec.version }}"
      - --out
      - "/var/lib/pinka/verify/vllm-{{ vllm_spec.id }}@{{ vllm_spec.version }}.json"
      - --wait
      - "{{ vllm_wait_timeout | string }}"
  vars:
    vllm_spec: "{{ vllm_current_spec.content | b64decode | from_yaml }}"
  changed_when: false
