# Managed by pinka (ansible/roles/compose/tasks/main.yml). Local changes will be overwritten.
#
# One Compose project of the lab services (BUILD_PROMPT §7.6): the project
# file from compose/<project>/compose.yml, an .env file with the pinned image
# digests, ports and paths, and pinka-<project>.service (oneshot,
# RemainAfterExit) that runs `docker compose up -d --wait` and `down`. The
# roles render their configuration under <project>/config/<name>/ first; the
# .env file carries one hash per directory (<NAME>_CONFIG_HASH), which the
# services use as a label, so a changed file recreates exactly its service.
- name: Check the project name
  ansible.builtin.assert:
    that:
      - compose_project in ['core', 'observability', 'inference']
    fail_msg: "compose_project must be core, observability or inference."
    quiet: true

- name: Create the project directory of {{ compose_project }}
  ansible.builtin.file:
    path: "{{ compose_root }}/{{ compose_project }}"
    state: directory
    owner: root
    group: pinka-admin
    mode: "0750"

- name: Install the Compose file of {{ compose_project }}
  ansible.builtin.copy:
    src: "{{ pinka_dir }}/compose/{{ compose_project }}/compose.yml"
    dest: "{{ compose_root }}/{{ compose_project }}/compose.yml"
    owner: root
    group: pinka-admin
    mode: "0640"
  register: compose_file

- name: Read the active platform
  ansible.builtin.include_role:
    name: active_platform

- name: Read the groups (pinka and the database socket group open the socket directories)
  ansible.builtin.getent:
    database: group

# How containers reach the GPU and where Docker keeps its data, from the
# running engine (docker role, facts.yml): GPU services exist in one Compose
# profile per method.
- name: Read what Docker offers
  ansible.builtin.include_role:
    name: docker
    tasks_from: facts

- name: Derive the settings the project needs
  ansible.builtin.set_fact:
    compose_gpu_method: "{{ pinka_docker_gpu_method }}"
    compose_pinka_gid: "{{ (ansible_facts.getent_group['pinka'] | default(none) or ['', ''])[1] }}"
    compose_db_socket_gid: >-
      {{ (ansible_facts.getent_group[compose_db_socket_group] | default(none) or ['', ''])[1] }}
    # The query proxy's socket group (§7.9).
    compose_query_gid: "{{ (ansible_facts.getent_group['pinka-query'] | default(none) or ['', ''])[1] }}"

- name: Check that the GPU method is known
  ansible.builtin.assert:
    that:
      - not compose_gpu or compose_gpu_method != 'none'
    fail_msg: >-
      {{ compose_project }} needs the GPU, but Docker offers neither CDI nor the NVIDIA
      runtime (`docker info`; docker and nvidia_container_toolkit roles).
    quiet: true
  when: not ansible_check_mode

- name: Find the configuration files of {{ compose_project }}
  ansible.builtin.find:
    paths: "{{ compose_root }}/{{ compose_project }}/config"
    recurse: true
    file_type: file
    get_checksum: true
    checksum_algorithm: sha256
  register: compose_config_files

- name: Write the environment of {{ compose_project }}
  ansible.builtin.template:
    src: env.j2
    dest: "{{ compose_root }}/{{ compose_project }}/.env"
    owner: root
    group: pinka-admin
    mode: "0640"
  vars:
    compose_config_hashes: >-
      {{ compose_config_files.files | pinka_config_hashes(compose_root ~ '/' ~ compose_project ~ '/config') }}

- name: Check the project with docker compose config
  ansible.builtin.command:
    argv: [docker, compose, --project-directory, "{{ compose_root }}/{{ compose_project }}", config, --quiet]
  changed_when: false
  when: not ansible_check_mode

- name: Install the systemd unit of {{ compose_project }}
  ansible.builtin.template:
    src: pinka-compose.service.j2
    dest: "/etc/systemd/system/pinka-{{ compose_project }}.service"
    owner: root
    group: root
    mode: "0644"

- name: Enable the systemd unit of {{ compose_project }}
  ansible.builtin.systemd_service:
    name: "pinka-{{ compose_project }}.service"
    enabled: "{{ compose_start }}"
    daemon_reload: true
  when: not ansible_check_mode or ('pinka-' ~ compose_project ~ '.service') in pinka_present.units

# `up` creates missing containers and recreates those whose definition changed,
# including the config-hash label of a changed configuration directory.
# Compose 5.6 prints one plain progress line per event: "<resource> <name>
# <status>"; Created, Recreated and Started are changes.
- name: Start the services of {{ compose_project }}
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'compose', '--progress', 'plain', '--project-directory', compose_root ~ '/' ~ compose_project,
          'up', '--detach', '--wait', '--wait-timeout', compose_wait_timeout | string, '--remove-orphans']
         + compose_services }}
  register: compose_up
  changed_when: compose_up.stderr is search('(Created|Recreated|Started)\s*$', multiline=True)
  when:
    - not ansible_check_mode
    - compose_start

- name: Mark the systemd unit as active for {{ compose_project }}
  ansible.builtin.systemd_service:
    name: "pinka-{{ compose_project }}.service"
    state: started
  when:
    - not ansible_check_mode
    - compose_start
