# Managed by pinka (ansible/roles/compose/defaults/main.yml). Local changes will be overwritten.

# Compose project: core, observability or inference (compose/<project>/compose.yml).
compose_project: ""
# Description of the systemd unit pinka-<project>.service.
compose_description: ""
# Services to start now (empty: all services of the project).
compose_services: []
# Compose profiles to enable besides the GPU profile (observability: stores).
compose_profiles: []
# Whether the project's GPU services run (Compose profile gpu-cdi or
# gpu-runtime, after the method Docker offers, docker role facts.yml).
compose_gpu: false
# The GPU profile's name before the method: gpu (gpu-cdi, gpu-runtime), or
# another set of GPU services of the project (observability: dcgm, the DCGM
# exporter instead of the nvidia-smi exporter).
compose_gpu_profile: gpu
# Log limits and cgroup parent of every lab container, set per service rather
# than in the Docker daemon.
compose_log_max_size: "{{ pinka_container_log_max_size }}"
compose_log_max_file: "{{ pinka_container_log_max_file }}"
compose_cgroup_parent: "{{ pinka_services_slice }}"
# Subnet of the core project's network (OPA), the first of pinka's pool.
compose_core_subnet: "{{ docker_address_pools | default([{'base': '172.30.0.0/16', 'size': 24}]) | pinka_subnet(0) }}"
# Start the services and enable the unit; false installs the unit disabled
# (vLLM without a deployment).
compose_start: true
# Seconds `docker compose up --wait` waits for healthy containers.
compose_wait_timeout: 300
# Directory of the rendered projects (services/).
compose_root: "{{ pinka_root }}/services"
# Images by service variable name, from versions.lock.yml (pinned by digest).
compose_images: "{{ pinka_versions.containers.images }}"
# Further variables for the .env file; every role that includes the same
# project must pass the same values (the file is shared).
compose_extra_env: {}
# The containers' accounts of each project (pinka_container_accounts), by
# the prefix of their .env variables (<PREFIX>_UID, <PREFIX>_GID): the
# users_groups role creates them, so no container shares a UID with another
# or with the host. The observability role passes its own (compose_extra_env).
compose_container_accounts:
  core:
    POSTGRES: "{{ pinka_container_accounts.postgres }}"
    POSTGRES_EXPORTER: "{{ pinka_container_accounts.postgres_exporter }}"
    OPA: "{{ pinka_container_accounts.opa }}"
  inference:
    VLLM: "{{ pinka_container_accounts.vllm }}"
# Group of the database socket directory: the active platform's <platform>-db,
# or root without a platform (the exporter joins it).
compose_db_socket_group: >-
  {{ ((active_platform | default({}, true)).database | default({}, true)).socket_group
     | default('root', true) }}
