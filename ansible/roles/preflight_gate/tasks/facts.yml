# Managed by pinka (ansible/roles/preflight_gate/tasks/facts.yml). Local changes will be overwritten.
#
# The feature flags after the plan's switches (BUILD_PROMPT §2.3), as
# preflight computed them in preflight_gate_profile: gpu_inference only where
# vLLM serves, gpu_training only where training jobs run on the GPU. Every
# role reads these. The gate passes its fresh profile; a play that runs
# without the gate (restore.yml) passes the profile bootstrap wrote.
- name: Expose the host profile, the feature flags and the training settings
  ansible.builtin.set_fact:  # noqa: var-naming[no-role-prefix] - lab-wide facts read by every role
    pinka_host_profile: "{{ preflight_gate_profile }}"
    pinka_features: >-
      {{ preflight_gate_profile.features | combine({
           'gpu_inference': preflight_gate_switches.inference.serves,
           'gpu_training': preflight_gate_switches.training.runs == 'gpu'}) }}
    # Where training jobs run: gpu, cpu (the CPU-only variant) or off.
    pinka_training: "{{ preflight_gate_switches.training.runs }}"
    # training_caps with memory_max: auto (or left out) replaced by the cap
    # preflight computed from this host.
    pinka_training_caps: >-
      {{ training_caps | combine({'memory_max': preflight_gate_switches.training.memory_max})
         if (training_caps.memory_max | default('auto') | string) == 'auto' else training_caps }}
  vars:
    preflight_gate_switches: "{{ preflight_gate_profile.requirements.switches }}"
