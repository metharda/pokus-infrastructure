# Managed by pinka (ansible/roles/preflight_gate/meta/argument_specs.yml). Local changes will be overwritten.
argument_specs:
  main:
    short_description: Re-run preflight and stop if the host changed.
    description:
      - Sets pinka_host_profile (the fresh profile), pinka_features (its feature flags after the
        plan's switches), pinka_training (gpu, cpu or off) and pinka_training_caps (training_caps
        with memory_max auto replaced by the cap preflight computed).
    options:
      host_profile:
        type: dict
        required: true
        description: Host profile validated by bootstrap.sh for this run.
      install_nvidia_driver:
        type: str
        required: true
        choices: [auto, manual, skip]
        description: The machine's driver setting; preflight judges a missing NVIDIA driver with it, as bootstrap did.
      pinka_root:
        type: path
        required: true
        description: Research space; preflight measures its free disk space.
      preflight_gate_command:
        type: path
        default: "{{ pinka_dir }}/preflight/pinka-preflight"
        description: Preflight wrapper of this checkout.
      training_caps:
        type: dict
        required: true
        description: The caps on training jobs; memory_max auto takes the cap preflight computed.
      preflight_gate_profile_path:
        type: path
        default: /etc/pinka/host-profile.json
        description: Profile to compare with; bootstrap passes the profile it validated (pinka_bootstrap.profile_path).
  facts:
    short_description: Expose a host profile's feature flags after the switches and the training settings.
    description:
      - Sets pinka_host_profile, pinka_features, pinka_training and pinka_training_caps from
        preflight_gate_profile; main passes its fresh profile, restore.yml the profile bootstrap
        passes, since it runs without the gate.
    options:
      preflight_gate_profile:
        type: dict
        required: true
        description: The host profile whose requirements.switches decide the flags.
      training_caps:
        type: dict
        required: true
        description: The caps on training jobs; memory_max auto takes the cap preflight computed.
