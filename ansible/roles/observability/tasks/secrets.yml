# Managed by pinka (ansible/roles/observability/tasks/secrets.yml). Local changes will be overwritten.
#
# Secrets mounted into the observability containers:
# directory 0700 root, each file 0400 owned by the account of the container
# that reads it. Grafana and Prometheus run on full and lab nodes only.
- name: Create the directory of the container secrets
  ansible.builtin.file:
    path: "{{ observability_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the secrets of the stores
  when: observability_stores
  block:
    - name: Write Grafana's admin and database passwords
      ansible.builtin.copy:
        content: "{{ item.value }}"
        dest: "{{ observability_secrets_dir }}/{{ item.name }}"
        owner: "{{ observability_ids.grafana.uid or omit }}"
        group: root
        mode: "0400"
      loop:
        - {name: grafana-admin, value: "{{ observability_grafana_admin_password }}"}
        - {name: platform-grafana, value: "{{ observability_grafana_db_password }}"}
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Create Prometheus's copy of the Incus metrics certificate
      ansible.builtin.file:
        path: "{{ observability_secrets_dir }}/prometheus-incus"
        state: directory
        owner: "{{ observability_ids.prometheus.uid or omit }}"
        group: root
        mode: "0500"

    - name: Copy the Incus metrics certificate for Prometheus
      ansible.builtin.copy:
        src: "{{ item.src }}"
        remote_src: true
        dest: "{{ observability_secrets_dir }}/prometheus-incus/{{ item.dest }}"
        owner: "{{ observability_ids.prometheus.uid or omit }}"
        group: root
        mode: "0400"
      loop:
        - {src: "{{ observability_incus_cert_dir }}/client.crt", dest: client.crt}
        - {src: "{{ observability_incus_cert_dir }}/client.key", dest: client.key}
        - {src: "{{ observability_incus_server_cert }}", dest: server.crt}
      loop_control:
        label: "{{ item.dest }}"
      when: not ansible_check_mode
