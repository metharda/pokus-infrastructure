# Managed by pinka (ansible/roles/observability/tasks/vm_listener.yml). Local changes will be overwritten.
#
# Dedicated collector listener for VM targets (contracts.md#telemetry, C4): an
# address on a dummy interface, created before Docker starts. The run ACL and
# the firewall admit only OTLP from run networks to it.
- name: Install the VM listener address unit
  ansible.builtin.template:
    src: pinka-vm-otlp-address.service.j2
    dest: /etc/systemd/system/pinka-vm-otlp-address.service
    owner: root
    group: root
    mode: "0644"
  when: observability_vm_listener

- name: Enable and start the VM listener address
  ansible.builtin.systemd_service:
    name: pinka-vm-otlp-address.service
    enabled: true
    state: started
    daemon_reload: true
  when:
    - observability_vm_listener
    - not ansible_check_mode or 'pinka-vm-otlp-address.service' in pinka_present.units

- name: Look for a VM listener address unit from an earlier configuration
  ansible.builtin.stat:
    path: /etc/systemd/system/pinka-vm-otlp-address.service
  register: observability_vm_unit
  when: not observability_vm_listener

- name: Remove the VM listener address without vm_targets
  when:
    - not observability_vm_listener
    - observability_vm_unit.stat.exists
  block:
    - name: Stop and disable the VM listener address
      ansible.builtin.systemd_service:
        name: pinka-vm-otlp-address.service
        enabled: false
        state: stopped

    - name: Remove the VM listener address unit
      ansible.builtin.file:
        path: /etc/systemd/system/pinka-vm-otlp-address.service
        state: absent

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
