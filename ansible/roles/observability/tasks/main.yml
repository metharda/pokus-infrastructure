# Managed by pinka (ansible/roles/observability/tasks/main.yml). Local changes will be overwritten.
#
# Observability stack (contracts.md#telemetry): the
# collector gateway and the journald collector, Prometheus, Loki, Tempo,
# Grafana (with the active platform's dashboards in a folder of its name and
# a read-only datasource on its Grafana role), node_exporter, cAdvisor and,
# where the lab uses the GPU (gpu_inference or gpu_training), the GPU exporter.
# Every container uses the host network and binds 127.0.0.1; the VM listener
# address (C4) exists only with vm_targets. An inference node runs no stores
# (Prometheus, Loki, Tempo, Grafana): its gateway forwards everything to the
# paired lab node over mutual TLS (pairing.yml).
- name: Read the active platform
  ansible.builtin.include_role:
    name: active_platform

- name: Check the secrets and the GPU exporter choice
  ansible.builtin.assert:
    that:
      - not observability_stores or vault_grafana_admin_password is defined
      - not observability_stores or vault_grafana_admin_password | length >= 8
      - not observability_stores or not observability_platform_db or observability_platform_db.grafana in (vault_postgres_passwords | default({}))
      - not observability_stores or '$' not in observability_grafana_db_password
      - >-
        not observability_stores or observability_grafana_researchers
        | difference(observability_grafana_user_passwords.keys() | list) | length == 0
      - observability_gpu_exporter in ['nvidia_smi', 'dcgm']
      - observability_gpu_exporter != 'dcgm' or pinka_versions.containers.images.dcgm_exporter.digest is match('sha256:')
    fail_msg: >-
      group_vars/all/vault.yml needs vault_grafana_admin_password (8 or more
      characters), with a platform database the password of its Grafana role in
      vault_postgres_passwords (without "$", which Grafana's provisioning
      expands), and vault_grafana_user_passwords for
      every researcher with a Grafana account (full and lab nodes); observability_gpu_exporter is
      nvidia_smi or dcgm, and dcgm only once its image is verified in versions.lock.yml.
    quiet: true

- name: Read the accounts of the host
  ansible.builtin.getent:
    database: passwd

- name: Find the UIDs and GIDs of the containers' accounts
  ansible.builtin.set_fact:
    observability_ids: >-
      {{ observability_ids | default({}) | combine({item.key: {
           'uid': (ansible_facts.getent_passwd[item.value] | default(['', '', ''], true))[1],
           'gid': (ansible_facts.getent_passwd[item.value] | default(['', '', ''], true))[2]}}) }}
  loop: "{{ observability_container_accounts | dict2items }}"
  loop_control:
    label: "{{ item.value }}"

# The users_groups role creates them; only a check-mode run on a fresh host
# may not find them yet.
- name: Check that the containers' accounts exist
  ansible.builtin.assert:
    that: observability_ids.values() | map(attribute='uid') | select('equalto', '') | list | length == 0
    fail_msg: >-
      The containers' accounts ({{ observability_container_accounts.values() | unique | join(', ') }})
      must exist; run bootstrap again (the users_groups role creates them).
    quiet: true
  when: not ansible_check_mode

# The journal collector reads the journal with the host's systemd-journal
# group (compose/observability/compose.yml, otel_journald).
- name: Read the groups of the host
  ansible.builtin.getent:
    database: group

- name: Find the journal's group
  ansible.builtin.set_fact:
    observability_journal_gid: >-
      {{ (ansible_facts.getent_group[observability_journal_group] | default(none) or ['', ''])[1] }}

- name: Check that the journal's group exists
  ansible.builtin.assert:
    that: observability_journal_gid | length > 0
    fail_msg: >-
      The host has no group {{ observability_journal_group }}, which reads the journal
      (systemd's journald creates it); the journal collector needs it.
    quiet: true
  when: not ansible_check_mode

- name: Find the journal's and the loader's directories the host has
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
    get_checksum: false
  loop: "{{ observability_journal_optional_dirs }}"
  register: observability_journal_dirs

- name: Read where Docker keeps its data
  ansible.builtin.include_role:
    name: docker
    tasks_from: facts

# cAdvisor's masks lie over the real paths: a mask over a link in its view
# of the host would land at the link's target in the container instead.
- name: Find the real paths of what cAdvisor's view masks
  ansible.builtin.command:
    argv:
      - realpath
      - --canonicalize-missing
      - --
      - "{{ pinka_root }}"
      - /etc/pinka
      - /var/lib
      - /run/pinka
      - /var/lib/pinka
      - /var/lib/pinka-kept
  register: observability_mask_paths
  changed_when: false
  check_mode: false

# Docker refuses two mounts at one place, and a mask of the whole root would
# hide everything.
- name: Check that cAdvisor's masks lie apart
  ansible.builtin.assert:
    that:
      - observability_mask_paths.stdout_lines | length == 6
      - observability_mask_paths.stdout_lines | unique | length == 6
      - "'/' not in observability_mask_paths.stdout_lines"
      - pinka_docker_data_root not in observability_mask_paths.stdout_lines
    fail_msg: >-
      cAdvisor masks the real paths of the lab's root, /etc/pinka, /var/lib,
      /run/pinka, /var/lib/pinka and /var/lib/pinka-kept, which must be
      distinct, none of them / or Docker's data root
      ({{ pinka_docker_data_root }}): {{ observability_mask_paths.stdout_lines | join(', ') }}.
    quiet: true

- name: Mount the empty directory in place of each the host lacks
  ansible.builtin.set_fact:
    observability_host_dirs: >-
      {{ observability_host_dirs | default({}) | combine({item.item:
           item.item if item.stat.isdir | default(false) else observability_empty_dir}) }}
  loop: "{{ observability_journal_dirs.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Prepare the forwarding between paired nodes
  ansible.builtin.include_tasks: pairing.yml

- name: Set up the VM telemetry listener
  ansible.builtin.include_tasks: vm_listener.yml

- name: Create the data directories
  ansible.builtin.file:
    path: "{{ pinka_root }}/state/{{ item.name }}"
    state: directory
    owner: "{{ item.owner if item.owner is defined else (observability_ids[item.container].uid or omit) }}"
    group: "{{ item.group if item.group is defined else (observability_ids[item.container].gid or omit) }}"
    mode: "0700"
  loop: "{{ observability_state_dirs | selectattr('name', 'in', observability_state_names) }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    observability_state_names: >-
      {{ ['prometheus', 'loki', 'tempo', 'grafana', 'otelcol-journald'] if observability_stores
         else ['otelcol-journald'] }}

- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ observability_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the secrets
  ansible.builtin.include_tasks: secrets.yml

- name: Set up the query proxy's socket and the agent OTLP socket
  ansible.builtin.include_tasks: query.yml
  when: observability_stores

- name: Create the configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - {path: "{{ observability_config_dir | dirname }}", group: pinka-admin, mode: "0750"}
    - {path: "{{ observability_empty_dir }}", mode: "0555"}
    - {path: "{{ observability_config_dir }}"}
    - {path: "{{ observability_config_dir }}/otel"}
    - {path: "{{ observability_config_dir }}/prometheus"}
    - {path: "{{ observability_config_dir }}/loki"}
    - {path: "{{ observability_config_dir }}/tempo"}
    - {path: "{{ observability_config_dir }}/grafana"}
    - {path: "{{ observability_config_dir }}/grafana/provisioning"}
    - {path: "{{ observability_config_dir }}/grafana/provisioning/datasources"}
    - {path: "{{ observability_config_dir }}/grafana/provisioning/dashboards"}
    - {path: "{{ observability_config_dir }}/grafana/dashboards"}
    - {path: "{{ observability_config_dir }}/grafana/platform-dashboards"}
    - {path: "{{ observability_config_dir }}/query-proxy"}
  loop_control:
    label: "{{ item.path }}"

- name: Render the configuration
  ansible.builtin.template:
    src: "{{ pinka_dir }}/config/{{ item }}.j2"
    dest: "{{ observability_config_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: >-
    {{ ['otel/gateway.yaml', 'otel/journald.yaml']
       + (['prometheus/prometheus.yml', 'loki/loki.yaml', 'tempo/tempo.yaml',
           'grafana/provisioning/datasources/pinka.yaml', 'grafana/provisioning/dashboards/pinka.yaml',
           'query-proxy/nginx.conf']
          if observability_stores else []) }}

- name: Install the dashboards
  ansible.builtin.copy:
    src: "{{ pinka_dir }}/config/grafana/dashboards/"
    dest: "{{ observability_config_dir }}/grafana/dashboards/"
    owner: root
    group: root
    mode: "0644"
  when: observability_stores

- name: Install the active platform's dashboards
  ansible.builtin.include_tasks: platform_dashboards.yml
  when: observability_stores

# cAdvisor's view of the host masks /run/pinka, and a mask needs its mount
# point, also at boot, before Docker starts the containers.
- name: Recreate pinka's runtime directory at boot
  ansible.builtin.template:
    src: pinka-observability.tmpfiles.conf.j2
    dest: /etc/tmpfiles.d/pinka-observability.conf
    owner: root
    group: root
    mode: "0644"
  register: observability_runtime_tmpfiles

- name: Create pinka's runtime directory now
  ansible.builtin.command:
    argv: [systemd-tmpfiles, --create, /etc/tmpfiles.d/pinka-observability.conf]
  changed_when: observability_runtime_tmpfiles is changed
  when: not ansible_check_mode

# One container, pinka-gpu-exporter, serves the GPU exporter. Compose keeps
# the container of a service a profile turned off (neither reconciled nor an
# orphan), so after another choice of exporter or GPU method the old one would
# keep the name and the chosen one could not start: it is removed first. Only
# the observability project's own container; anything else of that name is
# left to Compose, which then refuses to start.
- name: Read which GPU exporter service the exporter's container runs
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --type
      - container
      - --format
      - >-
        {{ '{{' }}index .Config.Labels "com.docker.compose.project"{{ '}}' }}
        {{ '{{' }}index .Config.Labels "com.docker.compose.service"{{ '}}' }}
      - pinka-gpu-exporter
  register: observability_gpu_container
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remove the container of another GPU exporter or GPU method
  ansible.builtin.command:
    argv: [docker, rm, --force, pinka-gpu-exporter]
  changed_when: true
  when:
    - not ansible_check_mode
    - observability_gpu_container.rc == 0
    - (observability_gpu_container.stdout.split() + [''])[0] == 'pinka-observability'
    - (observability_gpu_container.stdout.split() + ['', ''])[1] != observability_gpu_service

- name: Start the observability services
  ansible.builtin.include_role:
    name: compose
  vars:
    compose_project: observability
    compose_description: telemetry, metrics, logs, traces and dashboards
    compose_gpu: "{{ observability_gpu }}"
    # The exporter observability_gpu_exporter names, and only that one.
    compose_gpu_profile: "{{ 'dcgm' if observability_gpu_exporter == 'dcgm' else 'gpu' }}"
    compose_profiles: "{{ ['stores'] if observability_stores else [] }}"
    compose_extra_env:
      PROMETHEUS_RETENTION: "{{ observability_prometheus_retention }}"
      PROMETHEUS_RETENTION_SIZE: "{{ observability_prometheus_retention_size }}"
      GRAFANA_AUTO_ASSIGN_ORG_ROLE: "{{ observability_grafana_user_role }}"
      OTEL_PAIRING_HASH: "{{ observability_pairing_hash | default('') }}"
      OTELCOL_UID: "{{ observability_ids.otel_gateway.uid }}"
      OTELCOL_GID: "{{ observability_ids.otel_gateway.gid }}"
      JOURNALD_UID: "{{ observability_ids.otel_journald.uid }}"
      SYSTEMD_JOURNAL_GID: "{{ observability_journal_gid }}"
      PINKA_ROOT_REAL: "{{ observability_mask_paths.stdout_lines[0] }}"
      ETC_PINKA_REAL: "{{ observability_mask_paths.stdout_lines[1] }}"
      VAR_LIB_REAL: "{{ observability_mask_paths.stdout_lines[2] }}"
      RUN_PINKA_REAL: "{{ observability_mask_paths.stdout_lines[3] }}"
      VAR_LIB_PINKA_REAL: "{{ observability_mask_paths.stdout_lines[4] }}"
      VAR_LIB_PINKA_KEPT_REAL: "{{ observability_mask_paths.stdout_lines[5] }}"
      JOURNAL_PERSISTENT_DIR: "{{ observability_host_dirs['/var/log/journal'] }}"
      JOURNAL_VOLATILE_DIR: "{{ observability_host_dirs['/run/log/journal'] }}"
      LIB64_DIR: "{{ observability_host_dirs['/lib64'] }}"
      USR_LIB64_DIR: "{{ observability_host_dirs['/usr/lib64'] }}"
      PROMETHEUS_UID: "{{ observability_ids.prometheus.uid }}"
      PROMETHEUS_GID: "{{ observability_ids.prometheus.gid }}"
      LOKI_UID: "{{ observability_ids.loki.uid }}"
      LOKI_GID: "{{ observability_ids.loki.gid }}"
      TEMPO_UID: "{{ observability_ids.tempo.uid }}"
      TEMPO_GID: "{{ observability_ids.tempo.gid }}"
      GRAFANA_UID: "{{ observability_ids.grafana.uid }}"
      QUERY_PROXY_UID: "{{ observability_ids.query_proxy.uid }}"
      NODE_EXPORTER_UID: "{{ observability_ids.node_exporter.uid }}"
      NODE_EXPORTER_GID: "{{ observability_ids.node_exporter.gid }}"
      GPU_EXPORTER_UID: "{{ observability_ids.gpu_exporter.uid }}"
      GPU_EXPORTER_GID: "{{ observability_ids.gpu_exporter.gid }}"

- name: Wait until the services answer
  ansible.builtin.uri:
    url: "{{ item }}"
    status_code: 200
  register: observability_ready
  retries: 30
  delay: 5
  until: observability_ready.status == 200
  loop: >-
    {{ ['http://127.0.0.1:' ~ pinka_internal_ports.collector_health ~ '/',
        'http://127.0.0.1:' ~ pinka_internal_ports.journald_health ~ '/']
       + (['http://127.0.0.1:' ~ pinka_ports.prometheus ~ '/-/ready',
           'http://127.0.0.1:' ~ pinka_ports.loki ~ '/ready',
           'http://127.0.0.1:' ~ pinka_ports.tempo ~ '/ready',
           observability_grafana_url ~ '/api/health'] if observability_stores else []) }}
  when: not ansible_check_mode

# A query endpoint answers through the socket; a push endpoint is refused.
- name: Wait until the query proxy answers on its socket
  ansible.builtin.uri:
    unix_socket: /run/pinka/query.sock
    url: "http://localhost{{ item.path }}"
    method: "{{ item.method }}"
    status_code: "{{ item.status }}"
  register: observability_proxy_ready
  retries: 30
  delay: 5
  until: observability_proxy_ready.status == item.status
  loop:
    - {path: /prometheus/api/v1/labels, method: GET, status: 200}
    - {path: /loki/loki/api/v1/push, method: POST, status: 403}
  loop_control:
    label: "{{ item.method }} {{ item.path }}"
  when:
    - observability_stores
    - not ansible_check_mode

- name: Provision the Grafana accounts
  ansible.builtin.include_tasks: grafana_users.yml
  when:
    - not ansible_check_mode
    - observability_stores
