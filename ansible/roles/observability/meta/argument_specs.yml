# Managed by pinka (ansible/roles/observability/meta/argument_specs.yml). Local changes will be overwritten.
argument_specs:
  main:
    short_description: Telemetry gateway, metrics, logs, traces and dashboards, all on 127.0.0.1.
    options:
      pinka_dir:
        type: path
        required: true
        description: Infra directory of the checkout (config/otel, prometheus, loki, tempo, grafana).
      vault_grafana_admin_password:
        type: str
        required: true
        description: Grafana's admin password (vault, 8 or more characters).
      vault_postgres_passwords:
        type: dict
        default: {}
        description: Database passwords (vault); Grafana uses the active platform's Grafana role, whose password must not contain "$".
      observability_collector_memory_mib:
        type: int
        default: 512
        description: memory_limiter limit of the gateway collector in MiB (the journald collector gets half).
      observability_prometheus_retention:
        type: str
        default: 90d
        description: Prometheus retention.
      observability_prometheus_retention_size:
        type: raw
        default: 0
        description: Prometheus retention by size (such as 50GB, powers of 2); 0 is by time only.
      observability_loki_retention:
        type: str
        default: 2160h
        description: Loki retention of logs.
      observability_tempo_retention:
        type: str
        default: 720h
        description: Tempo retention of traces.
      observability_gpu_exporter:
        type: str
        default: nvidia_smi
        choices: [nvidia_smi, dcgm]
        description: GPU exporter with gpu_inference; dcgm is refused while its image is unverified.
      observability_grafana_db_password:
        type: str
        description: Password of the active platform's Grafana role (default from vault_postgres_passwords; "" without a platform database).
      observability_platform_db:
        type: dict
        description: The active platform's database plan, from its rendering ({} without one).
      observability_platform_dashboards:
        type: dict
        description: The active platform's dashboards (folder and directory in its release), from its rendering ({} without them).
      observability_grafana_admin_password:
        type: str
        description: Grafana's admin password (default vault_grafana_admin_password).
      observability_grafana_user_passwords:
        type: dict
        description: Researchers' Grafana passwords by name (default vault_grafana_user_passwords).
      observability_grafana_user_role:
        type: str
        default: Viewer
        choices: [Viewer, Editor, Admin]
        description: Organization role of new researcher accounts.
      observability_config_dir:
        type: path
        description: Rendered configuration (pinka_root/services/observability/config).
