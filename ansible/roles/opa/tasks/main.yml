# Managed by pinka (ansible/roles/opa/tasks/main.yml). Local changes will be overwritten.
#
# OPA in the core Compose project (BUILD_PROMPT §7.10) on 127.0.0.1:8181 with
# --authorization=basic: authz.rego allows only the two decision paths (the
# active platform's, from its manifest, and /v1/data/pinka/placeholder/active)
# and health checks. The deny-all placeholder is always loaded (doctor's
# probe); the active platform's policy bundle comes from its release, read-only,
# or an empty directory stands in. Decision logs go to the console and through
# journald to the collector.
- name: Read the active platform
  ansible.builtin.include_role:
    name: active_platform

- name: Create the configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ opa_config_dir | dirname | dirname }}", group: pinka-admin, mode: "0750"}
    - {path: "{{ opa_config_dir | dirname }}", group: root, mode: "0755"}
    - {path: "{{ opa_config_dir }}", group: root, mode: "0755"}
    - {path: "{{ opa_config_dir }}/placeholder", group: root, mode: "0755"}
    - {path: "{{ opa_config_dir }}/placeholder/pinka", group: root, mode: "0755"}
    - {path: "{{ opa_config_dir }}/no-platform-policy", group: root, mode: "0755"}
  loop_control:
    label: "{{ item.path }}"

- name: Install the authorization policy
  ansible.builtin.template:
    src: "{{ pinka_dir }}/config/opa/authz.rego.j2"
    dest: "{{ opa_config_dir }}/authz.rego"
    owner: root
    group: root
    mode: "0644"

- name: Install the configuration and the placeholder
  ansible.builtin.copy:
    src: "{{ pinka_dir }}/config/opa/{{ item }}"
    dest: "{{ opa_config_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - opa.yaml
    - placeholder/pinka/placeholder.rego

- name: Look for the active platform's policy bundle
  ansible.builtin.stat:
    path: "{{ opa_platform_policy_dir }}"
  register: opa_platform_policy
  when: opa_platform_policy_dir | length > 0

- name: Choose the policy directory
  ansible.builtin.set_fact:
    opa_policy_source: >-
      {{ opa_platform_policy_dir if (opa_platform_policy.stat | default({})).isdir | default(false)
         else opa_config_dir ~ '/no-platform-policy' }}

# Docker resolves the link when the container starts. Its resolved target is
# part of the configuration hash, so a new platform deployment recreates OPA
# the next time this role runs.
- name: Point the policy link at the policy directory
  ansible.builtin.file:
    src: "{{ opa_policy_source }}"
    dest: "{{ opa_policy_link }}"
    state: link
    force: true
    owner: root
    group: root

- name: Record the resolved policy directory
  ansible.builtin.copy:
    content: "{{ opa_policy_source | realpath }}\n"
    dest: "{{ opa_config_dir }}/policy-source"
    owner: root
    group: root
    mode: "0644"

- name: Start OPA
  ansible.builtin.include_role:
    name: compose
  vars:
    compose_project: core
    compose_description: PostgreSQL and OPA
    compose_services: [opa]
