# Managed by pinka (ansible/roles/mac/tasks/main.yml). Local changes will be overwritten.
#
# Mandatory access control (BUILD_PROMPT §19.7). SELinux is never set to
# permissive or disabled: the research space gets persistent file context
# rules instead. AppArmor stays as shipped (Docker and Incus bring their own
# profiles). The MAC system and mode are part of the fingerprint.
- name: Label the research space for SELinux
  ansible.builtin.include_tasks: selinux.yml
  when: pinka_mac == 'selinux'

- name: Note the MAC system
  ansible.builtin.debug:
    msg: "Mandatory access control: {{ pinka_mac }} ({{ host_profile.mac.mode | default('n/a') }}); nothing is disabled."
