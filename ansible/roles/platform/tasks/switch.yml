# Managed by pinka (ansible/roles/platform/tasks/switch.yml). Local changes will be overwritten.
#
# §7.14 step 8 after the rendering is applied. A running release that only
# its rendering changes for (accounts, configuration, secrets, the principals
# and endpoints files, units) is drained and stopped now; a new release or new
# content stopped it before render.yml changed anything. Then the new
# release's migrate hook (a new release only), the restricted-schema revoke
# and check, the atomic switch of current and the units enabled in
# pinka-platform.target. start.yml starts the platform and waits for its
# health hook at the end of the play. A failed migrate hook or a forbidden
# grant in schema restricted ends the deployment with the platform stopped.

- name: Drain and stop the running release when its rendering changed
  ansible.builtin.include_tasks: stop.yml
  when:
    - platform_running.rc == 0
    - not (platform_stopped | default(false))
    - >-
      platform_accounts_written is changed or platform_config_written is changed
      or platform_secrets_written is changed or platform_principals is changed
      or platform_units_written is changed

- name: Run the new release's migrate hook (§12.9)
  ansible.builtin.command:
    argv: ["{{ platform_tool }}", deploy, migrate, --run, "{{ platform_plan.run_dir }}"]
  register: platform_migrate
  changed_when: (platform_migrate.stdout | from_json).changed
  when: platform_switch.release_changed

- name: Check schema restricted after the migration (§7.8)
  ansible.builtin.include_role:
    name: postgres
    tasks_from: restricted_check
  when:
    - platform_switch.release_changed
    - active_platform.database is truthy

- name: Switch current to the release and record it (§7.14 steps 8-9)
  ansible.builtin.command:
    argv: ["{{ platform_tool }}", deploy, activate, --run, "{{ platform_plan.run_dir }}"]
  register: platform_activate
  changed_when: (platform_activate.stdout | from_json).changed

- name: Enable the platform's units in pinka-platform.target
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    enabled: true
  loop: "{{ active_platform.units }}"
  loop_control:
    label: "{{ item.name }}"

# The new release's controller and inference broker reach the inference API
# from now on (§7.11, ADR-0016); the guard resolves their UIDs when it loads.
- name: Load the inference guard with the platform's clients
  ansible.builtin.systemd_service:
    name: pinka-inference-guard.service
    state: restarted
  when:
    - platform_activate is changed
    - "'pinka-inference-guard.service' in pinka_present.units or not ansible_check_mode"
