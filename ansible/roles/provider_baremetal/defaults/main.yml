# Managed by pinka (ansible/roles/provider_baremetal/defaults/main.yml). Local changes will be overwritten.

# Targets masked by power_policy: never_sleep.
provider_baremetal_sleep_targets:
  - sleep.target
  - suspend.target
  - hibernate.target
  - hybrid-sleep.target
# Command that rebuilds the initramfs, per tool from platform_facts.
provider_baremetal_initramfs_commands:
  update-initramfs: [update-initramfs, -u, -k, all]
  dracut: [dracut, --force, --regenerate-all]
  mkinitcpio: [mkinitcpio, -P]
# Where DKMS keeps the certificate it signs modules with, first match wins
# (Secure Boot).
# TODO(verify) on reference hardware: the path on every family.
provider_baremetal_mok_keys:
  - /var/lib/shim-signed/mok/MOK.der
  - /var/lib/dkms/mok.pub
