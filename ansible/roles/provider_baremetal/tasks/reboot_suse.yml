# Managed by pinka (ansible/roles/provider_baremetal/tasks/reboot_suse.yml). Local changes will be overwritten.
#
# TODO(verify): exit code of `zypper needs-rebooting` when a reboot is needed (102).
- name: Ask zypper whether a reboot is needed
  ansible.builtin.command:
    argv: [zypper, needs-rebooting]
  register: provider_baremetal_needs_rebooting
  failed_when: provider_baremetal_needs_rebooting.rc not in [0, 102]
  changed_when: false
  check_mode: false

- name: Record the reboot state
  ansible.builtin.set_fact:
    provider_baremetal_reboot_required: "{{ provider_baremetal_needs_rebooting.rc == 102 }}"
    provider_baremetal_reboot_reason: zypper needs-rebooting
