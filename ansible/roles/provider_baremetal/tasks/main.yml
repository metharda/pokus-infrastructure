# Managed by pinka (ansible/roles/provider_baremetal/tasks/main.yml). Local changes will be overwritten.
#
# Bare-metal provider (BUILD_PROMPT §3.2): NVIDIA driver with the Secure Boot
# MOK flow, reboot handling and the power policy. The Incus storage device is
# handled by the incus role with the safety rules of §13.1.
- name: Install or check the NVIDIA driver
  ansible.builtin.include_tasks: nvidia.yml
  when:
    - host_profile.gpu.vendor == 'nvidia'
    - install_nvidia_driver != 'skip'

- name: Apply the power policy
  ansible.builtin.include_tasks: power.yml

- name: Check whether a reboot is pending
  ansible.builtin.include_tasks: reboot.yml
