# Managed by pinka (ansible/roles/pkg/tasks/repo_rpm.yml). Local changes will be overwritten.
- name: Install the verified key of {{ pkg_repo_name }}
  ansible.builtin.copy:
    src: "{{ pkg_key_tmp.path }}/key"
    remote_src: true
    dest: "/etc/pki/rpm-gpg/pinka-{{ pkg_repo_name }}.asc"
    owner: root
    group: root
    mode: "0644"

# Uninstall removes from rpm's keyring only the keys pinka imported:
# note the key first unless rpm had it already. rpm
# names a key gpg-pubkey-<version>, the last 8 hex digits of the fingerprint
# (TODO(verify): rpm 6 names v6 keys by their whole fingerprint; both count).
- name: Read the keys rpm has
  ansible.builtin.command:
    argv: [rpm, -q, gpg-pubkey, --qf, "%{VERSION}\n"]
  register: pkg_rpm_keys
  check_mode: false
  changed_when: false
  failed_when: false

- name: Record as pinka's the key of {{ pkg_repo_name }}
  pinka_install_record:
    state: add
    added:
      repo_keys: ["{{ pkg_repo_lock_key.fingerprint }}"]
  when: >-
    [pkg_repo_lock_key.fingerprint[-8:] | lower, pkg_repo_lock_key.fingerprint | lower]
    | intersect(pkg_rpm_keys.stdout_lines) | length == 0

# From the verified download, which exists in check mode too (the copy above does not).
- name: Import into rpm the key of {{ pkg_repo_name }}
  ansible.builtin.rpm_key:
    key: "{{ pkg_key_tmp.path }}/key"
    fingerprint: "{{ pkg_repo_lock_key.fingerprint }}"
    state: present

- name: Add dnf repository {{ pkg_repo_name }}
  ansible.builtin.yum_repository:
    name: "pinka-{{ pkg_repo_name }}"
    description: "{{ pkg_repo_name }} (managed by pinka)"
    baseurl: "{{ pkg_repo.baseurl | pinka_repo_url(pinka_release_identity, pkg_repo_values) }}"
    gpgcheck: true
    repo_gpgcheck: "{{ pkg_repo.repo_gpgcheck | default(false) }}"
    gpgkey: "file:///etc/pki/rpm-gpg/pinka-{{ pkg_repo_name }}.asc"
    enabled: true
  when: pinka_pkg_manager == 'dnf'

- name: Add zypper repository {{ pkg_repo_name }}
  community.general.zypper_repository:
    name: "pinka-{{ pkg_repo_name }}"
    repo: "{{ pkg_repo.baseurl | pinka_repo_url(pinka_release_identity, pkg_repo_values) }}"
    auto_import_keys: false
    disable_gpg_check: false
    state: present
  when: pinka_pkg_manager == 'zypper'
