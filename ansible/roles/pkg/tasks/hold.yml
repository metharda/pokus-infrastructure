# Managed by pinka (ansible/roles/pkg/tasks/hold.yml). Local changes will be overwritten.
#
# Hold packages at their installed versions (BUILD_PROMPT §19.5) with the
# family's method: apt preferences pins, dnf versionlock, zypper locks, or
# pacman IgnorePkg. Automatic updates then leave them alone.
- name: Record the holds pinka adds ({{ pkg_hold_name }})
  pinka_install_record:
    state: add
    added:
      holds: "{{ pkg_hold_packages }}"
  when: pkg_hold_packages | length > 0

- name: Hold the packages of {{ pkg_hold_name }}
  ansible.builtin.include_tasks: "hold_{{ pinka_version_hold_method }}.yml"
  when: pkg_hold_packages | length > 0
