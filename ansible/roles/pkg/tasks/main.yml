# Managed by pinka (ansible/roles/pkg/tasks/main.yml). Local changes will be overwritten.
#
# Install packages, pinned to the versions from versions.lock.yml when given.
# The family-specific module lives in
# install_<package manager>.yml; ansible-core respawns apt and dnf under the
# system interpreter that has their bindings.
#
# The install record notes each package first: the module keeps only
# those absent at the first install, so uninstall removes exactly pinka's.
- name: Record the packages pinka adds ({{ pkg_packages | join(', ') }})
  pinka_install_record:
    state: add
    added:
      packages: "{{ pkg_packages }}"
  when: pkg_packages | length > 0

- name: Install packages ({{ pkg_packages | join(', ') }})
  ansible.builtin.include_tasks: "install_{{ pinka_pkg_manager }}.yml"
  when: pkg_packages | length > 0
