# Managed by pinka (ansible/roles/pkg/tasks/repo_apt.yml). Local changes will be overwritten.
- name: Read the downloaded key
  ansible.builtin.slurp:
    src: "{{ pkg_key_tmp.path }}/key"
  register: pkg_key_content
  check_mode: false

- name: Install the verified key of {{ pkg_repo_name }}
  ansible.builtin.copy:
    src: "{{ pkg_key_tmp.path }}/key"
    remote_src: true
    # apt reads ASCII-armored keys only from files ending in .asc.
    dest: >-
      /etc/apt/keyrings/pinka-{{ pkg_repo_name }}.{{ 'asc' if (pkg_key_content.content | b64decode).startswith('-----BEGIN')
      else 'gpg' }}
    owner: root
    group: root
    mode: "0644"

- name: Add apt repository {{ pkg_repo_name }}
  ansible.builtin.deb822_repository:
    name: "pinka-{{ pkg_repo_name }}"
    types: [deb]
    uris: ["{{ pkg_repo.uri | pinka_repo_url(pinka_release_identity, pkg_repo_values) }}"]
    suites: ["{{ pkg_repo.suite | pinka_repo_url(pinka_release_identity, pkg_repo_values) }}"]
    components: "{{ pkg_repo.components | default(omit, true) }}"
    signed_by: >-
      /etc/apt/keyrings/pinka-{{ pkg_repo_name }}.{{ 'asc' if (pkg_key_content.content | b64decode).startswith('-----BEGIN')
      else 'gpg' }}
  register: pkg_apt_repo

- name: Refresh the apt package index
  # Not a handler: the packages of the new repository are installed right
  # after this in the same run.
  ansible.builtin.apt:  # noqa: no-handler
    update_cache: true
  when: pkg_apt_repo is changed
