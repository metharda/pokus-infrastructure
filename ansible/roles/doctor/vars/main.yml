# Managed by pinka (ansible/roles/doctor/vars/main.yml). Local changes will be overwritten.

# Installed CLI (BUILD_PROMPT §7.17, §9): the packages, the wrapper and the lab description.
doctor_lib: /usr/local/lib/pinka
doctor_bin: /usr/local/bin/pinka
doctor_config: /etc/pinka/lab.json
doctor_fingerprint_dir: /var/lib/pinka/fingerprint
# Built documentation that `pinka docs serve` serves (a release's documentation tarball).
doctor_docs_dir: /usr/local/share/pinka/docs
# Python packages copied below doctor_lib (src relative to the repository root).
doctor_packages:
  - {src: tools/pinka-lab/pinka_lab, dest: pinka-lab/pinka_lab}
  - {src: preflight/pinka_preflight, dest: preflight/pinka_preflight}

# What this node runs (BUILD_PROMPT §19.10).
doctor_runs_lab: "{{ node_role in ['full', 'lab'] }}"
doctor_serves_inference: "{{ (pinka_features.gpu_inference | default(false)) and node_role in ['full', 'inference'] }}"

# An inference node configured with its paired lab node runs the control endpoint.
doctor_inference_control: "{{ node_role == 'inference' and inference_lab_node | length > 0 }}"

# Infra's units of pinka-lab.target that must be active. The inference project
# is not listed: it runs only while a deployment is active (doctor's gpu.vllm
# check). Doctor adds the platform's services and sockets from its rendering
# (/etc/pinka/platform/rendered.json), not its oneshot reconcile unit.
doctor_units: >-
  {{ ['pinka-health-gate.service', 'pinka-session-start.service']
     + (['pinka-core.service'] if doctor_runs_lab else [])
     + ['pinka-observability.service']
     + (['pinka-sleep-inhibit.service']
        if pinka_provider in ['baremetal', 'vm'] and power_policy == 'lab_session_inhibit' else [])
     + ([inference_control_unit] if doctor_inference_control else []) }}

# Hardening of infra's own units doctor compares with `systemctl show`
# (systemd.hardening); the platform's comes from its rendering, per profile.
doctor_hardening: >-
  {{ [{'unit': inference_control_unit, 'account': inference_control_account}]
     | pinka_unit_hardening(inference_control_denied_paths)
     if node_role == 'inference' else [] }}

# Ports that listen on the tailnet address for split inference (the firewall
# opens them on tailscale0): the control endpoint, or the collector receiving
# the paired inference node's telemetry.
doctor_tailnet_ports: >-
  {{ firewall_tailnet_tcp_ports | difference([22, firewall_grafana_serve_port, firewall_docs_serve_port]) }}

# Lab containers and the pinned image (versions.lock.yml containers.images) each runs.
doctor_core_containers:
  pinka-postgres: postgres
  pinka-postgres-exporter: postgres_exporter
  pinka-opa: opa
doctor_observability_containers:
  pinka-otel-gateway: otel_collector
  pinka-otel-journald: otel_collector
  pinka-node-exporter: node_exporter
  pinka-cadvisor: cadvisor
# Not on inference nodes, which forward to their lab node (BUILD_PROMPT §19.10).
doctor_store_containers:
  pinka-prometheus: prometheus
  pinka-loki: loki
  pinka-tempo: tempo
  pinka-grafana: grafana
doctor_gpu_containers:
  pinka-gpu-exporter: gpu_exporter
doctor_container_keys: >-
  {{ (doctor_core_containers if doctor_runs_lab else {})
     | combine(doctor_observability_containers,
               doctor_store_containers if doctor_runs_lab else {},
               doctor_gpu_containers if pinka_features.gpu_inference | default(false) else {}) }}
# Container name -> pinned reference <image>@<digest>.
doctor_containers: >-
  {{ dict(doctor_container_keys.keys() | list
          | zip(doctor_container_keys.values() | map('extract', pinka_versions.containers.images)
                | map(attribute='image')
                | zip(doctor_container_keys.values() | map('extract', pinka_versions.containers.images)
                      | map(attribute='digest'))
                | map('join', '@'))) }}

# The CUDA image of the GPU check (pulled by nvidia_container_toolkit).
doctor_gpu_image: >-
  {{ pinka_versions.containers.images.cuda_base_test.image }}@{{ pinka_versions.containers.images.cuda_base_test.digest }}

# Incus objects doctor expects (the incus role creates them; personal projects
# depend on UIDs and are not checked).
doctor_incus:
  pool: "{{ incus_pool_name }}"
  backend: "{{ host_profile.storage_backend }}"
  min_free_gib: "{{ doctor_min_pool_free_gib }}"
  run_acl: "{{ incus_run_acl }}"
  events_unit: pinka-incus-events.service
  projects: [bench, build]
  profiles: >-
    {{ [{'name': 'target-container', 'project': 'bench'}, {'name': 'probe-client', 'project': 'bench'},
        {'name': 'build', 'project': 'build'}]
       + ([{'name': 'target-vm', 'project': 'bench'}] if pinka_features.vm_targets | default(false) else []) }}
  cert_dir: "{{ incus_cert_dir }}"
  certificates: "{{ incus_service_certificates + [incus_metrics_certificate] }}"

# Golden images: the images role is included only on lab nodes, so its
# defaults are read from its files (doctor_images_defaults) unless host_vars
# override them.
doctor_images_blueprints: "{{ images_blueprints | default(doctor_images_defaults.images_blueprints) }}"

# The telemetry round trip of doctor (full and lab nodes).
doctor_observability:
  otlp_http: "http://127.0.0.1:{{ pinka_ports.otlp_http }}"
  loki: "http://127.0.0.1:{{ pinka_ports.loki }}"
  tempo: "http://127.0.0.1:{{ pinka_ports.tempo }}"
  prometheus: "http://127.0.0.1:{{ pinka_ports.prometheus }}"
  wait_seconds: "{{ doctor_telemetry_wait | int }}"
  smoke_wait_seconds: "{{ doctor_smoke_wait | int }}"
  poll_seconds: 5
