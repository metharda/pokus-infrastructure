# Managed by pinka (ansible/roles/firewall/tasks/main.yml). Local changes will be overwritten.
#
# One effective policy with three backends (BUILD_PROMPT §7.5, §19.6): SSH (and
# the Grafana serve port, if enabled) only on tailscale0 plus
# ssh_extra_allowed_interfaces; DHCP/DNS from Incus bridges to the host;
# nothing forwarded out of run networks; on every backend, the telemetry
# guard's, the inference guard's and on split nodes the split guard's own
# tables (§7.9, §7.11, §19.10). pinka only ever changes its own
# table, zone or rules and never flushes those of Docker, Incus, firewalld or ufw.
# Shared host: the pre-existing listeners stay reachable as found; what the
# owner consented to close, the access guard drops on every backend (§7.5).
- name: Apply the policy with the backend {{ pinka_firewall_backend }}
  ansible.builtin.include_tasks: "{{ pinka_firewall_backend }}.yml"

- name: Close what the owner consented to close (every backend)
  ansible.builtin.include_tasks: access_guard.yml

- name: Close the telemetry backends to platform accounts (every backend)
  ansible.builtin.include_tasks: telemetry_guard.yml

- name: Close the inference API to every account but its clients (every backend)
  ansible.builtin.include_tasks: inference_guard.yml

- name: Open the split-inference ports to the paired peer only (every backend)
  ansible.builtin.include_tasks: split_guard.yml
  when: node_role in ['lab', 'inference']

- name: Install the Docker-Incus compatibility script
  ansible.builtin.template:
    src: docker-incus-compat.sh.j2
    dest: /usr/local/libexec/pinka/docker-incus-compat
    owner: root
    group: root
    mode: "0755"
  notify: Restart the Docker-Incus compatibility unit

- name: Install the Docker-Incus compatibility unit
  ansible.builtin.template:
    src: pinka-docker-incus-compat.service.j2
    dest: /etc/systemd/system/pinka-docker-incus-compat.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart the Docker-Incus compatibility unit

- name: Enable the Docker-Incus compatibility unit
  ansible.builtin.systemd_service:
    name: pinka-docker-incus-compat.service
    enabled: true
    daemon_reload: true
  # In check mode the unit above is not written (pinka_present: platform_facts).
  when: not ansible_check_mode or 'pinka-docker-incus-compat.service' in pinka_present.units
