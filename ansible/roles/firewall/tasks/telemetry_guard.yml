# Managed by pinka (ansible/roles/firewall/tasks/telemetry_guard.yml). Local changes will be overwritten.
#
# The telemetry guard (BUILD_PROMPT §7.9, ADR-0016) on every backend: its own
# nftables table, loaded by its own unit before the network comes up. Only the
# accounts of pinka_telemetry_clients reach the stores on the loopback, and
# only those of pinka_query_port_clients the query proxy's loopback port; the
# guard holds their UIDs, never a group. The users_groups role created them
# before this role runs.
- name: Read the accounts of the host
  ansible.builtin.getent:
    database: passwd

- name: Find the UIDs of the telemetry clients
  ansible.builtin.set_fact:
    firewall_telemetry_client_uids: >-
      {{ pinka_telemetry_clients | map(attribute='account')
         | map('extract', ansible_facts.getent_passwd) | select('defined')
         | map(attribute=1) | map('int') | unique | sort }}
    firewall_query_port_client_uids: >-
      {{ pinka_query_port_clients | map(attribute='account')
         | map('extract', ansible_facts.getent_passwd) | select('defined')
         | map(attribute=1) | map('int') | unique | sort }}
    firewall_telemetry_clients_missing: >-
      {{ (pinka_telemetry_clients + pinka_query_port_clients) | map(attribute='account')
         | reject('in', ansible_facts.getent_passwd) | unique | list }}

- name: Check that every telemetry client exists
  ansible.builtin.assert:
    that: firewall_telemetry_clients_missing | length == 0
    fail_msg: >-
      The telemetry clients {{ firewall_telemetry_clients_missing | join(', ') }} do not exist;
      run bootstrap again (the users_groups role creates them).
    quiet: true
  when: not ansible_check_mode

- name: Create the directory of pinka's nftables files
  ansible.builtin.file:
    path: /etc/pinka/nftables
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the telemetry guard
  ansible.builtin.template:
    src: pinka-telemetry-guard.nft.j2
    dest: /etc/pinka/nftables/telemetry-guard.nft
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  register: firewall_guard_rules

- name: Install the telemetry guard's unit
  ansible.builtin.template:
    src: pinka-telemetry-guard.service.j2
    dest: /etc/systemd/system/pinka-telemetry-guard.service
    owner: root
    group: root
    mode: "0644"
  register: firewall_guard_unit

- name: Enable and load the telemetry guard
  ansible.builtin.systemd_service:
    name: pinka-telemetry-guard.service
    enabled: true
    state: "{{ 'restarted' if firewall_guard_rules is changed or firewall_guard_unit is changed else 'started' }}"
    daemon_reload: "{{ firewall_guard_unit is changed }}"
  when: not ansible_check_mode or 'pinka-telemetry-guard.service' in pinka_present.units
