# Managed by pinka (ansible/roles/firewall/tasks/firewalld.yml). Local changes will be overwritten.
#
# A dedicated zone pinka-tailnet for tailscale0 with the ssh service; Docker's
# own zone stays intact. Incus bridges (Incus 6.0.6
# doc/howto/network_bridge_firewalld.md): bridges with an uplink go into the
# trusted zone as Incus documents; run networks get their own zone pinka-run
# that only accepts DHCP and DNS. Run networks are created at run time, so they
# are matched with the interface wildcard "r-+" (firewalld 0.7.0 and later).
- name: Create the pinka zones
  ansible.posix.firewalld:
    zone: "{{ item }}"
    state: present
    permanent: true
  loop: [pinka-tailnet, pinka-run]
  notify: Reload firewalld

- name: Reload firewalld so the new zone exists
  ansible.builtin.meta: flush_handlers

- name: Put tailscale0 in the pinka-tailnet zone
  ansible.posix.firewalld:
    zone: pinka-tailnet
    interface: "{{ firewall_tailnet_interface }}"
    state: enabled
    permanent: true
    immediate: true

- name: Allow SSH and the serve port in the pinka-tailnet zone
  ansible.posix.firewalld:
    zone: pinka-tailnet
    port: "{{ item }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_tailnet_tcp_ports }}"

- name: Find the zones of the extra SSH interfaces
  ansible.builtin.command:
    argv: [firewall-cmd, "--get-zone-of-interface={{ item }}"]
  loop: "{{ ssh_extra_allowed_interfaces }}"
  register: firewall_extra_zones
  changed_when: false
  check_mode: false

- name: Allow SSH on the extra interfaces
  ansible.posix.firewalld:
    zone: "{{ item.stdout | trim }}"
    service: ssh
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_extra_zones.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Put the run networks in the pinka-run zone
  ansible.posix.firewalld:
    zone: pinka-run
    interface: "{{ firewall_run_bridge_pattern | replace('*', '+') }}"
    state: enabled
    permanent: true
    immediate: true

- name: Allow DHCP and DNS from the run networks to Incus's dnsmasq
  ansible.posix.firewalld:
    zone: pinka-run
    service: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop: [dhcp, dhcpv6, dns]

- name: Allow OTLP from the run networks to the VM listener
  ansible.posix.firewalld:
    zone: pinka-run
    rich_rule: >-
      rule family="ipv4" destination address="{{ pinka_vm_otlp.address }}"
      port port="{{ item }}" protocol="tcp" accept
    state: "{{ 'enabled' if firewall_vm_otlp_ports | length > 0 else 'disabled' }}"
    permanent: true
    immediate: true
  loop: "{{ [pinka_ports.otlp_grpc, pinka_ports.otlp_http] }}"

- name: Trust the bridges with an uplink (image builds, personal projects)
  ansible.posix.firewalld:
    zone: trusted
    interface: "{{ item | replace('*', '+') }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_uplink_bridge_patterns }}"
