# Managed by pinka (ansible/roles/incus/tasks/install.yml). Local changes will be overwritten.
#
# Incus from the source of the component source matrix (Zabbly's LTS
# repository on Debian and Ubuntu, the distribution or EPEL/COPR/OBS
# elsewhere), pinned and held. The channel (lts or non_lts) is recorded for
# the fingerprint.
- name: Look up the Incus source
  ansible.builtin.set_fact:
    incus_source: "{{ pinka_component_sources | pinka_component_source('incus', pinka_source_group) }}"
    incus_versions: "{{ pinka_versions.packages | pinka_lock_packages('incus', pinka_release_key) }}"

- name: Refuse an unverified Incus source
  ansible.builtin.assert:
    that:
      - incus_source.verify is not defined
    fail_msg: >-
      ansible/component-sources.yml marks the Incus source for {{ pinka_source_group }}
      as unverified ({{ incus_source.verify | default('') }}); verify it first
      (docs/how-to/update-versions.md).
    quiet: true

- name: Stop when Incus comes from a community repository without consent
  ansible.builtin.include_role:
    name: bootstrap_signal
  vars:
    bootstrap_signal_code: 77
    bootstrap_signal_message: >-
      Incus for this distribution comes from a community repository. Re-run bootstrap with
      --allow-community-repos (recorded in the fingerprint).
  when:
    - incus_source.source == 'community'
    - not pinka_community_repos_allowed

# The install record notes the component before anything is installed.
# An Incus adopted with --adopt-incus existed before pinka and stays
# the host's: uninstall removes only pinka's objects in it.
- name: Record that pinka installs Incus
  pinka_install_record:
    state: add
    added:
      components: {incus: true}
  when: not ((host_profile.components | default({})).incus | default({})).installed | default(false)

- name: Add the Incus repository
  ansible.builtin.include_role:
    name: pkg
    tasks_from: repo
  vars:
    pkg_repo_name: "{{ incus_source.repo }}"
  when: incus_source.source == 'vendor_repo'

# The repository is not really added in check mode, so its packages cannot be
# resolved; everything below, and the rest of the role, needs Incus installed.
- name: Skip the rest in check mode before Incus is installed
  ansible.builtin.meta: end_role
  when:
    - ansible_check_mode
    - "'incus' not in pinka_present.commands"

- name: Install Incus
  ansible.builtin.include_role:
    name: pkg
  vars:
    pkg_packages: "{{ incus_source.packages }}"
    pkg_versions: "{{ incus_versions }}"

- name: Hold the Incus packages
  ansible.builtin.include_role:
    name: pkg
    tasks_from: hold
  vars:
    pkg_hold_name: incus
    pkg_hold_packages: "{{ incus_source.packages }}"
    pkg_versions: "{{ incus_versions }}"

- name: Record the Incus source and channel
  ansible.builtin.copy:
    dest: /etc/pinka/incus-source.json
    content: "{{ {'source': incus_source.source, 'channel': incus_source.channel, 'packages': incus_source.packages} | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Start Incus
  ansible.builtin.systemd_service:
    name: "{{ incus_units.daemon }}"
    enabled: true
    state: started
