# Managed by pinka (ansible/roles/incus/vars/debian.yml). Local changes will be overwritten.
#
# Group, unit and file names as packaged for the Debian family (verified in
# Ubuntu's incus 6.0.0-1: sysusers.d/incus.conf and the systemd units).
# TODO(verify): the same names in Zabbly's packages (pkgs.zabbly.com is not
# reachable from the build environment).
incus_groups: {user: incus, admin: incus-admin}
incus_units: {daemon: incus.service, user_socket: incus-user.socket}
incus_cli: /usr/bin/incus
incus_server_certificate: /var/lib/incus/server.crt
