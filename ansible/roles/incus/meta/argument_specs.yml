# Managed by pinka (ansible/roles/incus/meta/argument_specs.yml). Local changes will be overwritten.
argument_specs:
  main:
    short_description: Incus LTS with the pool, networks, run ACL, projects, profiles and service certificates.
    options:
      researchers:
        type: list
        elements: dict
        required: true
        description: Researchers; each gets a personal project and joins the Incus user group.
      host_profile:
        type: dict
        required: true
        description: Host profile (storage_backend, hardware, requirements.pool) passed by bootstrap.
      pinka_bootstrap:
        type: dict
        required: true
        description: Bootstrap options (adopt_incus, interactive).
      pinka_dir:
        type: path
        required: true
        description: Infra directory of the checkout (incus/ templates).
      incus_pool_name:
        type: str
        default: pinka-targets
        description: Storage pool of all instances.
      incus_pool_source:
        type: str
        default: loop
        choices: [loop, device]
        description: A loop file in the root filesystem, or a dedicated device.
      incus_pool_size:
        type: str
        default: auto
        description: >-
          Size of a loop pool, such as 300GiB, or auto: the sum preflight computed of everything that
          may be written to the pool (host profile requirements.pool); an explicit size must hold it.
          An existing pool keeps its size; one smaller than the sum needs an operator action.
      incus_pool_volume_size:
        type: str
        default: auto
        description: >-
          The pool's volume.size, the size of every image volume, such as 4GiB, or auto: just above
          the largest unpacked image (host profile requirements.pool). Set on new and existing pools;
          Incus refuses an image larger than it.
      incus_pool_metadata_size:
        type: str
        default: 1GiB
        description: The thin pool's metadata volume, set when the pool is created.
      incus_pool_device:
        type: str
        default: ""
        description: Dedicated device for the pool (use /dev/disk/by-id/...).
      incus_pool_device_confirm:
        type: str
        default: ""
        description: Must repeat incus_pool_device exactly, or nothing is formatted.
      incus_pool_device_force_wipe:
        type: bool
        default: false
        description: Format the device even though it carries a filesystem, LVM or RAID signature.
      incus_https_address:
        type: str
        default: 127.0.0.1:8443
        description: Address of the Incus HTTPS API (restricted TLS clients and metrics).
      incus_build_network:
        type: str
        default: pinka-build0
        description: NAT bridge of the build project.
      pinka_vm_otlp:
        type: dict
        required: true
        description: Interface and address of the collector listener for VM targets (C4).
      incus_run_acl:
        type: str
        default: pinka-run-default
        description: Network ACL the platform attaches to every run network.
      incus_run_acl_egress:
        type: list
        elements: dict
        description: Egress rules of the run ACL (derived; OTLP to the VM listener with vm_targets).
      incus_max_virtual_machines:
        type: int
        default: 4
        description: Most VMs at once in the bench and build projects (with the vm_targets feature).
      incus_concurrent_targets:
        type: int
        default: 2
        description: Targets that run at once; they size the bench project's memory and the memory preflight requires.
      incus_bench_limits:
        type: dict
        default: {}
        description: >-
          Overrides of bench's project limits, merged key by key with incus_bench_limits_defaults;
          a limits.disk set to null or empty is refused.
      incus_profiles_merged:
        type: dict
        description: >-
          Derived; never set it (in host_vars, group_vars or extra vars): incus_target_container,
          incus_target_vm, incus_probe_client and incus_build_instance merged key by key over
          their defaults, under the keys target_container, target_vm, probe_client and
          build_instance; the defaults of bench's and build's limits are computed from it.
      incus_bench_limits_defaults:
        type: dict
        description: >-
          Project limits of bench (memory and disk from the concurrent targets, CPUs from
          cpuset_targets or the host's CPUs).
      incus_build_limits:
        type: dict
        default: {}
        description: >-
          Overrides of build's project limits, merged key by key with incus_build_limits_defaults;
          a limits.disk set to null or empty is refused.
      incus_build_limits_defaults:
        type: dict
        description: Project limits of build (disk for two build instances with their state volumes).
      incus_target_container:
        type: dict
        default: {}
        description: Overrides of the target-container profile's sizes, merged key by key with incus_target_container_defaults.
      incus_target_container_defaults:
        type: dict
        default: {cpu: "1", memory: 1GiB, root_size: 8GiB}
        description: Default limits and root disk of the target-container profile.
      incus_target_vm:
        type: dict
        default: {}
        description: Overrides of the target-vm profile's sizes, merged key by key with incus_target_vm_defaults.
      incus_target_vm_defaults:
        type: dict
        default: {cpu: "2", memory: 2GiB, root_size: 16GiB, size_state: 500MiB}
        description: Default limits, root disk and state volume of the target-vm profile.
      incus_probe_client:
        type: dict
        default: {}
        description: Overrides of the probe-client profile's sizes, merged key by key with incus_probe_client_defaults.
      incus_probe_client_defaults:
        type: dict
        default: {cpu: "1", memory: 512MiB, root_size: 4GiB}
        description: Limits and root disk of the probe-client profile.
      incus_build_instance:
        type: dict
        default: {}
        description: Overrides of the build profile's sizes, merged key by key with incus_build_instance_defaults.
      incus_build_instance_defaults:
        type: dict
        default: {cpu: "2", memory: 2GiB, root_size: 16GiB, size_state: 500MiB}
        description: Limits, root disk and state volume (for a VM build) of the build profile.
      incus_user_limits:
        type: dict
        default: {}
        description: >-
          Overrides of each personal project's limits, merged key by key with
          incus_user_limits_defaults; a limits.disk set to null or empty is refused.
      incus_user_limits_defaults:
        type: dict
        default: {limits.instances: "5", limits.cpu: "4", limits.memory: 8GiB, limits.disk: 20GiB}
        description: >-
          Project limits of each personal project; limits.disk counts in full, once per researcher,
          in the Incus pool's size.
      incus_user_instance:
        type: dict
        default: {}
        description: Overrides of personal instances' defaults, merged key by key with incus_user_instance_defaults.
      incus_user_instance_defaults:
        type: dict
        default: {cpu: "1", memory: 1GiB, root_size: 4GiB}
        description: Default limits and root disk of instances in personal projects.
      incus_cert_dir:
        type: path
        default: /etc/pinka/incus
        description: Directory of the client certificates (one subdirectory per service).
      incus_service_certificates:
        type: list
        elements: dict
        description: >-
          Platform services that get a restricted client certificate ({account, short, name,
          projects}), from the active platform's rendering; name is its common and trust name.
      incus_metrics_certificate:
        type: dict
        default: {account: root, short: metrics, name: pinka-metrics, type: metrics}
        description: The metrics-only certificate for Prometheus.
      incus_certificate_days:
        type: int
        default: 3650
        description: Validity of generated client certificates in days.
      incus_run_network_owner:
        type: str
        description: Owner of the run-network helper's socket, the active platform's controller account (root without a platform).
      incus_events_identifier:
        type: str
        default: pinka-incus-events
        description: Journal identifier of the Incus event feed.
