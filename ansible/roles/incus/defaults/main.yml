# Managed by pinka (ansible/roles/incus/defaults/main.yml). Local changes will be overwritten.

# Storage pool of all instances, btrfs or LVM thin as
# preflight decided (host profile storage_backend).
incus_pool_name: pinka-targets
# loop (a file inside the root filesystem) or device (a dedicated disk).
incus_pool_source: loop
# Size of a loop pool: auto (computed by preflight from the golden images,
# the concurrent targets' root disks and a margin, limited by the free space
# where the loop file goes) or a size such as 300GiB. An
# existing pool keeps its size.
incus_pool_size: auto
# Dedicated device (use /dev/disk/by-id/...). Nothing is formatted unless
# incus_pool_device_confirm repeats it exactly.
incus_pool_device: ""
incus_pool_device_confirm: ""
# Format a device even though it carries a filesystem, RAID or LVM signature.
incus_pool_device_force_wipe: false

# Incus HTTPS API, for restricted TLS clients and metrics only (contracts.md#incus).
incus_https_address: 127.0.0.1:8443
# NAT bridge of the build project.
incus_build_network: pinka-build0
# ACL the platform attaches to every run network: everything that leaves the
# bridge is rejected except DHCP and DNS to the host and, with vm_targets, OTLP
# to the collector's VM listener (contracts.md#telemetry, C4).
incus_run_acl: pinka-run-default
# Egress rules of the run ACL (derived from pinka_vm_otlp and the vm_targets feature).
incus_run_acl_egress: >-
  {{ [{'action': 'allow', 'state': 'enabled', 'protocol': 'tcp',
       'destination': pinka_vm_otlp.address ~ '/32',
       'destination_port': pinka_ports.otlp_grpc ~ ',' ~ pinka_ports.otlp_http,
       'description': 'OTLP to the collector listener for VM targets'}]
     if pinka_features.vm_targets | default(false) else [] }}
# Most VMs at once in a project, when the vm_targets feature is on.
incus_max_virtual_machines: 4

# Targets that run at once: they size the bench
# project's memory and the memory preflight requires.
incus_concurrent_targets: 2
# Limits of the bench project (the sum over all its instances). Its memory is
# the concurrent targets, each with a probe client, at the target-vm profile's
# memory with vm_targets and the target-container profile's without (the
# operator's choice, not a share of the host). Its CPUs are those of
# cpuset_targets when set (the platform pins targets inside it).
incus_bench_limits:
  limits.memory: >-
    {{ (incus_concurrent_targets | int)
       * (((incus_target_vm if pinka_features.vm_targets | default(false) else incus_target_container).memory
           | pinka_size_mib)
          + (incus_probe_client.memory | pinka_size_mib)) }}MiB
  limits.cpu: >-
    {{ (cpuset_targets | pinka_cpuset_cpus | length) if cpuset_targets
       else [(host_profile.hardware.cpu_threads_effective | int) - 2, 1] | max }}
  limits.instances: "40"
# Defaults of the instance profiles; the platform sets per-blueprint values.
incus_target_container: {cpu: "1", memory: 1GiB, root_size: 8GiB}
incus_target_vm: {cpu: "2", memory: 2GiB, root_size: 16GiB}
incus_probe_client: {cpu: "1", memory: 512MiB, root_size: 4GiB}
incus_build_instance: {cpu: "2", memory: 2GiB, root_size: 16GiB}

# Personal projects (one per researcher, used through incus-user).
incus_user_limits:
  limits.instances: "5"
  limits.cpu: "4"
  limits.memory: 8GiB
  limits.disk: 60GiB
incus_user_instance: {cpu: "1", memory: 1GiB, root_size: 10GiB}

# Client certificates of the platform services: those of the active
# platform's rendering, {account, short (the directory), name, projects}.
incus_cert_dir: /etc/pinka/incus
incus_service_certificates: "{{ (active_platform | default({}, true)).incus_certificates | default([]) }}"
# Metrics-only certificate for Prometheus (Incus certificate type "metrics").
incus_metrics_certificate: {account: root, short: metrics, name: pinka-metrics, type: metrics}
# Validity of generated client certificates (rotate.yml renews them).
incus_certificate_days: 3650
# Journal identifier of the lifecycle and logging events (collector input).
incus_events_identifier: pinka-incus-events

# The run-network helper: its socket belongs to the active platform's
# controller account, or to root without a platform.
incus_run_network_owner: >-
  {{ ((active_platform | default({}, true)).run_network | default({}, true)).socket_owner
     | default('root', true) }}
