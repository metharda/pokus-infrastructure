# Managed by pinka (ansible/roles/backup/meta/argument_specs.yml). Local changes will be overwritten.
argument_specs:
  main:
    short_description: restic backups of pinka_root and /etc/pinka, PostgreSQL dumps, retention and backup metrics.
    options:
      pinka_root:
        type: path
        required: true
        description: Research space root; its directories of backup_include are backed up.
      pinka_versions:
        type: dict
        required: true
        description: The pinned versions (the restic binary).
      machine_name:
        type: str
        required: true
        description: Host name recorded in the snapshots; prune and restore select this host's snapshots.
      node_role:
        type: str
        required: true
        description: PostgreSQL is dumped on full and lab nodes.
      backup_repository:
        type: str
        description: restic repository (default vault_restic_repository); empty means backups are not configured.
      backup_password:
        type: str
        no_log: true
        description: Repository password (default vault_restic_password); written once, changed by rotate.yml.
      backup_sftp_known_hosts:
        type: list
        elements: str
        default: []
        description: known_hosts lines of the SFTP backup server, required for an sftp repository.
      backup_include:
        type: list
        elements: str
        default: [images, datasets, shared, users, backups/pg]
        description: >-
          Infra's own directories below pinka_root that are backed up; the restricted area, the
          training datasets, the adapters and the platform's backup.paths always are.
      backup_include_models:
        type: bool
        default: false
        description: Also back up the model weights (re-downloaded and verified on restore otherwise).
      backup_include_state:
        type: list
        elements: str
        default: []
        description: Directories of pinka_root/state to back up as well (prometheus, loki, tempo).
      backup_include_secrets:
        type: bool
        default: false
        description: Also back up the secret material under /etc/pinka (needs backup_secrets_acknowledged).
      backup_secrets_acknowledged:
        type: bool
        default: false
        description: Confirms that only the repository's encryption protects backed-up secrets.
      backup_pgdump_keep:
        type: int
        default: 7
        description: Local PostgreSQL dumps kept.
      backup_pgdump_schedule:
        type: str
        default: "*-*-* 02:30:00"
        description: OnCalendar of the PostgreSQL dump.
      backup_schedule:
        type: str
        default: "*-*-* 03:00:00"
        description: OnCalendar of the restic backup.
      backup_prune_schedule:
        type: str
        default: "Sun *-*-* 04:00:00"
        description: OnCalendar of the retention and prune job.
      backup_retention:
        type: dict
        default: {daily: 7, weekly: 4, monthly: 12}
        description: Snapshots kept by the prune job (keep-daily, keep-weekly, keep-monthly).
