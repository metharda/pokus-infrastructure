# Managed by pinka (ansible/roles/users_groups/vars/main.yml). Local changes will be overwritten.
#
# Names a researcher may not have: infra's accounts and groups and the active
# platform's accounts and groups (rendered.json, read by active_platform).
users_groups_taken: >-
  {{ (infra_accounts | map(attribute='name') | list)
     + (pinka_groups | map(attribute='name') | list)
     + ((active_platform | default({}, true)).accounts | default([], true) | map(attribute='name') | list)
     + ((active_platform | default({}, true)).groups | default([], true))
     + ((active_platform | default({}, true)).infra_groups | default([], true)) }}
users_groups_clashes: >-
  {{ researchers | map(attribute='name') | select('in', users_groups_taken) | list }}
# What existed before pinka (install record; empty for a legacy record):
# infra's accounts and groups of those names are refused, pre-existing
# researcher accounts are kept as they are.
users_groups_before_users: "{{ (pinka_preexisting | default({})).users | default([]) }}"
users_groups_before_groups: "{{ (pinka_preexisting | default({})).groups | default({}) }}"
users_groups_reserved_existing: >-
  {{ ((infra_accounts | map(attribute='name') | list) | select('in', users_groups_before_users) | list)
     + ((pinka_groups | map(attribute='name') | list) | select('in', users_groups_before_groups) | list) }}
users_groups_existing_researchers: >-
  {{ researchers | map(attribute='name') | select('in', users_groups_before_users) | list }}
