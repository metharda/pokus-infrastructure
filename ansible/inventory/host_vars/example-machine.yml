# Managed by pinka (ansible/inventory/host_vars/example-machine.yml). Local changes will be overwritten.
#
# Example machine configuration (BUILD_PROMPT §8.1). Copy it to
# host_vars/<machine>.yml, adapt it, and run
#   sudo ./bootstrap/bootstrap.sh --machine <machine>
# The installer TUI writes this file for you. Real host_vars files are excluded
# from the public project by .gitignore; keep them in your lab's private
# configuration. Every key also has a lab-wide default in group_vars/all/main.yml.

# Host name on the tailnet and in fingerprints.
machine_name: pinka-lab

# production | staging. Staging hosts (QA) have their own vault, /srv/pinka,
# Tailscale identity (tag:pinka-qa) and signing key, and never write to a
# production host.
lab_mode: production
# Staging only: true when this staging host uses production's hardware; it then
# starts only inside a maintenance window (pinka window open on both sides).
staging_shared_hardware: false

# auto | baremetal | wsl2 | vm. auto takes the provider from the host profile;
# an explicit value must match it, or the play stops.
lab_provider: auto

# never_sleep | lab_session_inhibit | os_default (baremetal and vm only).
power_policy: lab_session_inhibit

# Doctor warns when the effective values differ (important on WSL, where
# .wslconfig on the Windows side sets them).
expected:
  memory_gib: 22
  cpu_threads: 20

# CPU sets: lab services and Incus targets never share cores. Empty: no
# pinning. For example "0-5" and "6-19" on a host with 20 CPUs; the installer
# suggests a split.
cpuset_services: ""
cpuset_targets: ""

# Incus storage pool. loop: a file of incus_pool_size. device: a dedicated
# disk or partition, formatted ONLY if incus_pool_device_confirm equals
# incus_pool_device exactly and the device carries no signature.
incus_pool_source: loop
incus_pool_size: 300GiB
incus_pool_device: ""              # /dev/disk/by-id/... for device
incus_pool_device_confirm: ""

pinka_root: /srv/pinka
docker_data_root: /var/lib/docker

# full | lab | inference (docs/node-roles.md).
node_role: full

# auto | nftables | firewalld | ufw. auto: firewalld if active, else ufw if
# active, else nftables.
firewall_backend: auto

# auto | manual | skip (baremetal and vm; ignored on wsl2).
install_nvidia_driver: auto

# COPR, OBS home projects and RPM Fusion need explicit consent (also
# --allow-community-repos); recorded in the fingerprint.
allow_community_repos: false

# vLLM serving profile (vllm/profiles/<name>.yml) and the deployment to serve.
vllm_profile: ada-12g
vllm_default_deployment:           # null = install vLLM but serve nothing
  model_id: "<id from models.lock.yml>"
  start_after_install: true

postgres_shared_buffers: 2GB

# The GPU arbiter: after boot, serve the default deployment or stay idle; and
# bring the deployment served before a training run back when the run ends.
gpu_arbiter:
  after_boot: serve
  restore_after_training: true
# Caps on training jobs; the GPU arbiter refuses every run of a job over them.
training_caps:
  timeout_seconds: 86400
  memory_max: 24G
  cpus: 8
  dataset_max: 8G
  run_storage_max: 16G
  tmp_max: 1G

# The platform release to deploy (contract v2): {repo, ref, path, tag_prefix};
# {} for a lab without a platform. repo: an SSH URL (read with the deploy key
# this host generates), an anonymous https:// URL or a root-owned file:///
# repository; ref: a tag (recommended), branch or full commit; path: the
# release's subdirectory ("" for the root); tag_prefix: its release tags.
# For example: {repo: "git@github.com:example-org/example-platform.git",
# ref: "example-v0.1.0", path: "release/", tag_prefix: "example-v"}.
platform: {}
# One source per content package the platform's manifest declares, such as
# {cases: {repo: "<as above>", ref: "cases-v1", path: "cases/", tag_prefix: "cases-v"}}.
content: {}
# Deploy only tags with a valid SSH signature of an allowed signer
# (pinka_allowed_signers in group_vars/all/main.yml).
require_signed_tags: false
# Non-secret settings per service, checked against the service's config schema.
platform_settings: {}

# Publish Grafana on the tailnet with `tailscale serve` (never Funnel).
grafana_tailscale_serve: false

# On a Tailscale node that was logged in before pinka (adopted): the owner's
# consent that pinka adds its serve entries to it; without it nothing is served.
tailscale_serve_consent: false

# Extra interfaces on which sshd is reachable besides tailscale0, e.g. [enp5s0].
ssh_extra_allowed_interfaces: []

# Port overrides by the names of contracts.md#ports, e.g. {grafana: 18750}, for
# a port another program on this machine already uses (preflight names it).
ports: {}

# Address of the collector listener for VM targets; choose another one when
# preflight reports a conflict.
vm_collector_address: 198.18.0.1
