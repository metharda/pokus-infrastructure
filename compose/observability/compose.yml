# Managed by pinka (compose/observability/compose.yml). Local changes will be overwritten.
#
# Observability services (contracts.md#telemetry). Every
# service uses the host network and binds 127.0.0.1 only (Prometheus scrapes
# Incus's loopback API and the exporters; the platform's services and the
# researchers' SSH forwards reach the contract ports); the gateway collector
# also binds the VM listener address when the vm_targets feature is on.
# Variables come from .env (compose role): images pinned by digest, ports,
# paths, configuration hashes and the profiles: "stores" (Prometheus, Loki,
# Tempo and Grafana; full and lab nodes, not inference nodes)
# and the GPU profile: gpu-* for the nvidia-smi exporter, dcgm-* for the DCGM
# exporter, the one observability_gpu_exporter names.
name: pinka-observability

# Settings every lab container gets here rather than from the Docker daemon,
# so they are the same on a Docker that existed before pinka:
# the local log driver with size limits and the lab services' slice.
x-logging: &logging
  driver: local
  options:
    max-size: ${LOG_MAX_SIZE:?}
    max-file: ${LOG_MAX_FILE:?}

x-hardened: &hardened
  restart: unless-stopped
  logging: *logging
  cgroup_parent: ${CGROUP_PARENT:?}
  network_mode: host
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

# A read-only bind of a host path that must exist: Docker never creates it.
x-host-ro: &host_ro
  type: bind
  read_only: true
  bind:
    create_host_path: false

# An empty tmpfs over a host path a container must not see. It is mounted
# writable, so that Docker can create a mount point inside it (a data root
# under /var/lib); its mode 0555 leaves a process without capabilities no
# write access, unless the process is root, its owner, and changes the mode
# first: then what it writes stays in its own 4 KiB.
x-mask: &mask
  type: tmpfs
  tmpfs:
    size: 4096
    mode: 365  # 0555

x-gpu-exporter: &gpu_exporter
  <<: *hardened
  image: ${GPU_EXPORTER_IMAGE:?pinned image missing}
  container_name: pinka-gpu-exporter
  # Its own account instead of the image's nobody.
  user: "${GPU_EXPORTER_UID:?}:${GPU_EXPORTER_GID:?}"
  command: ["--web.listen-address=127.0.0.1:${GPU_EXPORTER_PORT:?}"]

# The DCGM exporter in the GPU exporter's place: the same container name,
# account and port, so the scrape, the inference control endpoint and doctor
# read whichever runs. Its default counters, with no capabilities and as the
# account instead of the image's root: without CAP_SYS_ADMIN it collects no
# profiling metrics and leaves them out.
x-dcgm-exporter: &dcgm_exporter
  <<: *hardened
  image: ${DCGM_EXPORTER_IMAGE:?pinned image missing}
  container_name: pinka-gpu-exporter
  user: "${GPU_EXPORTER_UID:?}:${GPU_EXPORTER_GID:?}"
  command: ["--address=127.0.0.1:${GPU_EXPORTER_PORT:?}"]
  tmpfs: [/tmp]

services:
  otel_gateway:
    <<: *hardened
    image: ${OTEL_COLLECTOR_IMAGE:?pinned image missing}
    container_name: pinka-otel-gateway
    labels:
      org.pinka.config-hash: ${OTEL_CONFIG_HASH:-}
      org.pinka.pairing-hash: ${OTEL_PAIRING_HASH:-}
    # Infra accounts (observability role), the telemetry guard's allowlist (ADR-0016).
    user: "${OTELCOL_UID:?}:${OTELCOL_GID:?}"
    command: ["--config=/etc/otelcol/gateway.yaml"]
    volumes:
      - ./config/otel:/etc/otelcol:ro
      # Split inference: mutual TLS to or from the paired node (empty otherwise).
      - /etc/pinka/secrets/containers/otel-pairing:/etc/pinka-pairing:ro

  # Reads the host's journal, the persistent and the volatile one, with the
  # host's journalctl, as an account of its own (pinka-otel-journald) with
  # the host's systemd-journal group as its only group, and forwards it to the
  # gateway; it accepts nothing from targets. Besides its configuration and
  # its state directory, it sees of the host only, read-only and each at its
  # own path: the two journal directories, the machine ID (journalctl reads
  # the local machine's journal), the host's /usr/bin, /usr/lib, /lib and
  # lib64 directories (journalctl and the libraries it loads; directories, so
  # that a package update shows its new files) and /etc/ld.so.cache; where
  # the host lacks one of the directories, an empty directory of pinka's
  # stands in (observability role).
  otel_journald:
    <<: *hardened
    image: ${OTEL_COLLECTOR_IMAGE:?pinned image missing}
    container_name: pinka-otel-journald
    labels:
      org.pinka.config-hash: ${OTEL_CONFIG_HASH:-}
    user: "${JOURNALD_UID:?}:${SYSTEMD_JOURNAL_GID:?}"
    command: ["--config=/etc/otelcol/journald.yaml"]
    volumes:
      - ./config/otel:/etc/otelcol:ro
      - ${PINKA_ROOT:?}/state/otelcol-journald:/var/lib/otelcol/journald
      - {<<: *host_ro, source: "${JOURNAL_PERSISTENT_DIR:?}", target: /var/log/journal}
      - {<<: *host_ro, source: "${JOURNAL_VOLATILE_DIR:?}", target: /run/log/journal}
      - {<<: *host_ro, source: /etc/machine-id, target: /etc/machine-id}
      - {<<: *host_ro, source: /usr/bin, target: /usr/bin}
      - {<<: *host_ro, source: /usr/lib, target: /usr/lib}
      - {<<: *host_ro, source: "${USR_LIB64_DIR:?}", target: /usr/lib64}
      - {<<: *host_ro, source: /lib, target: /lib}
      - {<<: *host_ro, source: "${LIB64_DIR:?}", target: /lib64}
      - {<<: *host_ro, source: /etc/ld.so.cache, target: /etc/ld.so.cache}

  prometheus:
    <<: *hardened
    profiles: [stores]
    image: ${PROMETHEUS_IMAGE:?pinned image missing}
    container_name: pinka-prometheus
    user: "${PROMETHEUS_UID:?}:${PROMETHEUS_GID:?}"
    labels:
      org.pinka.config-hash: ${PROMETHEUS_CONFIG_HASH:-}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:?}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:?}
      - --web.listen-address=127.0.0.1:${PROMETHEUS_PORT:?}
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - /etc/pinka/secrets/containers/prometheus-incus:/etc/prometheus/incus:ro
      - ${PINKA_ROOT:?}/state/prometheus:/prometheus

  loki:
    <<: *hardened
    profiles: [stores]
    image: ${LOKI_IMAGE:?pinned image missing}
    container_name: pinka-loki
    user: "${LOKI_UID:?}:${LOKI_GID:?}"
    labels:
      org.pinka.config-hash: ${LOKI_CONFIG_HASH:-}
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./config/loki:/etc/loki:ro
      - ${PINKA_ROOT:?}/state/loki:/loki

  tempo:
    <<: *hardened
    profiles: [stores]
    image: ${TEMPO_IMAGE:?pinned image missing}
    container_name: pinka-tempo
    user: "${TEMPO_UID:?}:${TEMPO_GID:?}"
    labels:
      org.pinka.config-hash: ${TEMPO_CONFIG_HASH:-}
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./config/tempo:/etc/tempo:ro
      - ${PINKA_ROOT:?}/state/tempo:/var/tempo

  # The only way to query telemetry: forwards only the
  # query endpoints of Prometheus, Loki and Tempo and answers 403 to
  # everything else. Platform services reach it through
  # /run/pinka/query.sock (a link to query/query.sock, 0660, group
  # pinka-query; the umask makes the mode), Grafana through its loopback
  # port. A socket left over from a crash is removed before nginx starts.
  query_proxy:
    <<: *hardened
    profiles: [stores]
    image: ${QUERY_PROXY_IMAGE:?pinned image missing}
    container_name: pinka-query-proxy
    labels:
      org.pinka.config-hash: ${QUERY_PROXY_CONFIG_HASH:-}
    user: "${QUERY_PROXY_UID:?}:${PINKA_QUERY_GID:?}"
    entrypoint:
      - /bin/sh
      - -c
      - umask 0117 && rm -f /run/query/query.sock && exec nginx -c /etc/query-proxy/nginx.conf -g 'daemon off;'
    tmpfs: [/tmp]
    volumes:
      - ./config/query-proxy:/etc/query-proxy:ro
      - /run/pinka/query:/run/query

  grafana:
    <<: *hardened
    profiles: [stores]
    image: ${GRAFANA_IMAGE:?pinned image missing}
    container_name: pinka-grafana
    # Group 0: the image grants its own paths to group 0 for any user.
    user: "${GRAFANA_UID:?}:0"
    labels:
      org.pinka.config-hash: ${GRAFANA_CONFIG_HASH:-}
    # Membership of the host group pinka opens the reader socket directory.
    group_add: ["${PINKA_GID:?}"]
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:?}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: ${GRAFANA_AUTO_ASSIGN_ORG_ROLE:?}
      GF_LOG_MODE: console
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    tmpfs: [/tmp]
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./config/grafana/platform-dashboards:/etc/grafana/platform-dashboards:ro
      - ${PINKA_ROOT:?}/state/grafana:/var/lib/grafana
      - /run/pinka/postgres-reader:/run/pinka/postgres-reader
      - /etc/pinka/secrets/containers/grafana-admin:/run/secrets/grafana-admin:ro
      - /etc/pinka/secrets/containers/platform-grafana:/run/secrets/platform-grafana:ro

  node_exporter:
    <<: *hardened
    image: ${NODE_EXPORTER_IMAGE:?pinned image missing}
    container_name: pinka-node-exporter
    # An account of its own (not its image's nobody): it sees the host's
    # processes, so it shares a UID with none of them.
    user: "${NODE_EXPORTER_UID:?}:${NODE_EXPORTER_GID:?}"
    pid: host
    command:
      - --web.listen-address=127.0.0.1:${NODE_EXPORTER_PORT:?}
      - --path.rootfs=/host
      - --collector.textfile.directory=/host/var/lib/pinka/node-exporter
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    <<: *hardened
    image: ${CADVISOR_IMAGE:?pinned image missing}
    container_name: pinka-cadvisor
    command:
      - -listen_ip=127.0.0.1
      - -port=${CADVISOR_PORT:?}
      - -docker_only=true
      - -housekeeping_interval=30s
      - -store_container_labels=false
    tmpfs: [/tmp]
    # It runs as root (its image sets no user), and reaches Docker's and
    # containerd's sockets under /var/run, through which it reads container
    # metadata. In its view of the host's root and of /var/run, pinka's paths
    # are masked at their real paths (a link at one of the six resolved by
    # the observability role), and so is the host's /var/lib, except Docker's
    # data root, which stays visible: cAdvisor reads every container's layer
    # ID there (or reports no metrics for the container) and measures its
    # writable layer and log directory. The masks hide these paths only: a
    # link below them, another mount of the same files or a copy elsewhere
    # stays visible.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - ${DOCKER_DATA_ROOT:?}:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - {<<: *mask, target: "/rootfs${PINKA_ROOT_REAL:?}"}
      - {<<: *mask, target: "/rootfs${ETC_PINKA_REAL:?}"}
      - {<<: *mask, target: "/rootfs${VAR_LIB_REAL:?}"}
      - {<<: *mask, target: "/rootfs${VAR_LIB_PINKA_REAL:?}"}
      - {<<: *mask, target: "/rootfs${VAR_LIB_PINKA_KEPT_REAL:?}"}
      - {<<: *mask, target: "/rootfs${RUN_PINKA_REAL:?}"}
      - {<<: *mask, target: /var/run/pinka}
      - {<<: *host_ro, source: "${DOCKER_DATA_ROOT:?}", target: "/rootfs${DOCKER_DATA_ROOT:?}"}

  # GPU metrics through nvidia-smi (works on WSL2), with the GPU method Docker
  # offers: CDI device or the NVIDIA runtime. COMPOSE_PROFILES in .env enables
  # one of the two services when gpu_inference is on.
  gpu_exporter:
    <<: *gpu_exporter
    profiles: [gpu-cdi]
    devices: ["nvidia.com/gpu=all"]

  gpu_exporter_runtime:
    <<: *gpu_exporter
    profiles: [gpu-runtime]
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility

  # GPU metrics through DCGM (observability_gpu_exporter: dcgm), with the same
  # GPU methods; COMPOSE_PROFILES enables one of the two instead of the above.
  dcgm_exporter:
    <<: *dcgm_exporter
    profiles: [dcgm-cdi]
    devices: ["nvidia.com/gpu=all"]

  dcgm_exporter_runtime:
    <<: *dcgm_exporter
    profiles: [dcgm-runtime]
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
