# Checks for the monorepo's root-level files (specs/, PROGRESS.md, CLAUDE.md,
# .github/, and later TEST_REPORT.md and HANDOFF.md). Component directories
# run their own checks in their own workflows.
name: repo-root

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-24.04
    env:
      PINKA_PRIVACY_DENYLIST: ${{ secrets.PINKA_PRIVACY_DENYLIST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Privacy scan of root-level files
        run: |
          mapfile -d '' paths < <(git ls-files -z -- . ':!:infra' ':!:platform' ':!:catalog' ':!:docs-site')
          PYTHONPATH=infra/tools/repo-checks python3 -m pinka_repo_checks privacy "${paths[@]}"
