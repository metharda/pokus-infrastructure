# Monorepo wrapper for infra/.github/workflows/ci.yml.
#
# GitHub runs workflows only from the repository root, so this file runs the
# same make targets with working-directory infra, filtered to infra changes.
# Keep the job list in step with infra/.github/workflows/ci.yml.
name: infra

on:
  push:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  schedule:
    - cron: "17 5 * * 1"  # weekly external link check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: infra

env:
  PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
  PINKA_PRIVACY_DENYLIST: ${{ secrets.PINKA_PRIVACY_DENYLIST }}

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the privacy scan checks every commit message
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: infra/.node-version
      - run: make setup
      - run: make lint

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: infra/.node-version
      - run: make setup
      - name: ssh-keygen is present (the signed-tag test must run in CI)
        run: command -v ssh-keygen
      - name: PostgreSQL server binaries and systemd-analyze are present (the SQL and unit checks must run in CI)
        run: |
          ls /usr/lib/postgresql/*/bin/initdb
          command -v systemd-analyze
      - run: make test

  docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: infra/.node-version
      - run: make setup
      - run: make docs

  lock-check:
    # Re-verifies every pin over the network and fails while any unverified
    # marker remains in versions.lock.yml (BUILD_PROMPT §10.1).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: infra/.node-version
      - run: make setup
      - run: make lock-check

  check-mode:
    # Required CI fast lane (BUILD_PROMPT §11, §19.9): the provider-agnostic
    # roles (base, users_groups, ssh, layout) with --check in a disposable
    # systemd container per family, nothing skipped; never a host. Blocking.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu_2404
          - image: debian_13
          - image: fedora_44
          - image: almalinux_9
          - image: opensuse_leap_156
          - image: archlinux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: infra/.node-version
      - run: make setup
      - run: make check-mode CI_IMAGE=${{ matrix.image }}

  check-mode-extended:
    # Extended, NON-BLOCKING (approved deviation I2): the whole site.yml with
    # --check. Components whose sources are not verified are skipped; the job
    # summary lists each of them as not tested, never as passing. A skip ends
    # by itself once the component's sources are verified.
    name: check-mode-extended (non-blocking, ${{ matrix.image }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu_2404
          - image: debian_13
          - image: fedora_44
          - image: almalinux_9
          - image: opensuse_leap_156
          - image: archlinux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: infra/.node-version
      - run: make setup
      - run: make check-mode-extended CI_IMAGE=${{ matrix.image }}

  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    continue-on-error: true  # reported, never blocking (DOCS_SPEC §A.6)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: make links
