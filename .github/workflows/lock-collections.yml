# Managed by pinka (.github/workflows/lock-collections.yml).
#
# The pins of the Ansible collections against Galaxy (owner decision, with
# the "commit" for the symbolic-link fix of make lock-collections): on every
# change of versions.lock.yml or tools/lockcheck/, and weekly, Galaxy's
# artifact of every locked collection is downloaded and checked as
# make lock-collections checks it, and any difference from the lock's
# artifacts (URL, sha256, size) fails the job. A failure, of the weekly run
# too, blocks the next step like any CI failure.
name: infra-lock-collections

on:
  push:
    branches: ["**"]
    paths: ["versions.lock.yml", "tools/lockcheck/**", ".github/workflows/lock-collections.yml"]
  pull_request:  # a fork's only (the job's condition): one run per commit
    paths: ["versions.lock.yml", "tools/lockcheck/**", ".github/workflows/lock-collections.yml"]
  schedule:
    - cron: "41 4 * * 1"  # weekly: the pins against Galaxy
  workflow_dispatch:

permissions:
  contents: read

# One run per commit (owner, after D2): on main and moving/on each commit's
# run has a group of its own and always finishes; elsewhere (a pull request
# from a fork, another branch, a manual run) a newer run cancels the older.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main' ||
    github.ref == 'refs/heads/moving/on') && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  lock-collections:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - run: make lock-collections-check
