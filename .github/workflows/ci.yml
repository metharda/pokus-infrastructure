# Managed by pinka (.github/workflows/ci.yml).
#
# Canonical CI definition of this component. Every job only calls make
# targets, so CI and local runs are identical. CI never provisions anything:
# no bootstrap, no Ansible without --check, no distro VM harness, no real-host
# tests.
name: infra-ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # weekly external link check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
  PINKA_PRIVACY_DENYLIST: ${{ secrets.PINKA_PRIVACY_DENYLIST }}

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the privacy scan checks every commit message
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
      - run: make setup
      - run: make lint VERBOSE=1

  privacy:
    # The privacy scan on its own (the former repo-root workflow's job): every
    # tracked file and every commit message, with no setup step it depends on.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the privacy scan checks every commit message
      - run: make privacy

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
      - run: make setup
      - name: ssh-keygen is present (the signed-tag test must run in CI)
        run: command -v ssh-keygen
      # PostgreSQL 18, the major the lab pins, from PGDG with the signing key that
      # Ubuntu's postgresql-common ships; its fingerprint was verified from that
      # package (docs/IMPLEMENTATION_NOTES.md, "Verified in 3d.4").
      - name: PostgreSQL 18 from PGDG (the restricted-schema SQL tests run on it) and nftables
        run: |
          set -euo pipefail
          keyring=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          fpr="$(gpg --show-keys --with-colons "$keyring" | awk -F: '$1 == "fpr" {print $10; exit}')"
          test "$fpr" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: %s\n' \
            "$VERSION_CODENAME" "$keyring" | sudo tee /etc/apt/sources.list.d/pgdg.sources
          sudo install -d /etc/postgresql-common/createcluster.d
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.d/pinka-ci.conf
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-18 nftables
      - name: PostgreSQL server binaries, systemd-analyze and nft are present (the SQL, unit and telemetry guard checks must run in CI)
        run: |
          ls /usr/lib/postgresql/*/bin/initdb
          command -v systemd-analyze
          command -v nft
          sudo -n true
      - run: make test VERBOSE=1
        env:
          PINKA_POSTGRES_REQUIRED: "18"

  docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
      - run: make setup
      - run: make docs VERBOSE=1

  lock-check:
    # Re-verifies every pin over the network and fails while any unverified
    # marker remains in versions.lock.yml (BUILD_PROMPT §10.1).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
      - run: make setup
      - run: make lock-check

  check-mode:
    # Required CI fast lane (BUILD_PROMPT §11, §19.9): the provider-agnostic
    # roles (install_record, base, users_groups, ssh, layout) with --check in a disposable
    # systemd container per family, nothing skipped; never a host. Blocking.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu_2404
          - image: debian_13
          - image: fedora_44
          - image: almalinux_9
          - image: opensuse_leap_156
          - image: archlinux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
      - run: make setup
      - run: make check-mode CI_IMAGE=${{ matrix.image }}

  check-mode-extended:
    # Extended, NON-BLOCKING (approved deviation I2): the whole site.yml with
    # --check. Components whose sources are not verified are skipped; the job
    # summary lists each of them as not tested, never as passing. A skip ends
    # by itself once the component's sources are verified.
    name: check-mode-extended (non-blocking, ${{ matrix.image }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu_2404
          - image: debian_13
          - image: fedora_44
          - image: almalinux_9
          - image: opensuse_leap_156
          - image: archlinux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
      - run: make setup
      - run: make check-mode-extended CI_IMAGE=${{ matrix.image }}

  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    continue-on-error: true  # reported, never blocking (DOCS_SPEC §A.6)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: make links
