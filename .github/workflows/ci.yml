# Managed by pinka (.github/workflows/ci.yml).
#
# Canonical CI definition of this component. Every job only calls make
# targets, so CI and local runs are identical. CI never provisions anything:
# no bootstrap, no Ansible without --check, no distro VM harness, no real-host
# tests.
#
# GitHub Actions minutes: the test
# job runs the pytest suites in the random order of the Makefile's seed; a
# push that changes only docs skips the Ansible lanes (job
# changes); test-isolated (isolated.yml), check-mode-extended
# (check-mode-extended.yml) and release-package run weekly, on
# workflow_dispatch and on pushes that touch their inputs. The required job
# stands for every blocking job, so branch protection requires that one.
#
# One real run per commit: every commit pushed to a branch
# of this repository runs here once, on its push, whether or not a pull
# request is open; a pull request runs the jobs only when it comes from a
# fork, whose commits have no push run here. In the pull request run of a
# branch of this repository every job is skipped, and the skipped gate job
# is not named "required", so the required check of the pull request's head
# commit always comes from the real run of that commit. Tag pushes are
# release.yml's.
name: infra-ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # weekly external link check
  workflow_dispatch:

permissions:
  contents: read

# One run per commit: on main and moving/on each commit's
# run has a group of its own and always finishes; elsewhere (a pull request
# from a fork, another branch, a manual run) a newer run cancels the older.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main' ||
    github.ref == 'refs/heads/moving/on') && github.sha || github.ref }}
  cancel-in-progress: true

env:
  PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

jobs:
  changes:
    # Whether the Ansible lanes are needed: not for a change of docs
    # only (pinka_repo_checks.changes). A new branch, a force push, a schedule
    # or a manual run needs them.
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    outputs:
      ansible: ${{ steps.range.outputs.ansible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the range's commits
      - id: range
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          PYTHONPATH=tools/repo-checks python3 -m pinka_repo_checks.changes \
            --base="$BASE" --head="$HEAD" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  lint:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    env:
      # The maintainer's denylist, a secret: only for the two jobs that scan
      # with it.
      PINKA_PRIVACY_DENYLIST: ${{ secrets.PINKA_PRIVACY_DENYLIST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the privacy scan checks every commit message
          # A pull request's own head, not the test merge commit GitHub makes
          # for it: the scan checks every commit's author and committer.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
      - run: make setup
      - run: make lint VERBOSE=1

  privacy:
    # The privacy scan on its own (the former repo-root workflow's job): every
    # tracked file and every commit's message and identity, with no setup step
    # it depends on.
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    env:
      PINKA_PRIVACY_DENYLIST: ${{ secrets.PINKA_PRIVACY_DENYLIST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the privacy scan checks every commit message
          # A pull request's own head, not the test merge commit GitHub makes
          # for it: the scan checks every commit's author and committer.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: make privacy

  test:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
      - run: make setup
      - name: ssh-keygen is present (the signed-tag test must run in CI)
        run: command -v ssh-keygen
      # PostgreSQL 18, the major the lab pins, from PGDG with the signing key that
      # Ubuntu's postgresql-common ships; its fingerprint was verified from that
      # package.
      - name: PostgreSQL 18 from PGDG (the restricted-schema SQL tests run on it) and nftables
        run: |
          set -euo pipefail
          keyring=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          fpr="$(gpg --show-keys --with-colons "$keyring" | awk -F: '$1 == "fpr" {print $10; exit}')"
          test "$fpr" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: %s\n' \
            "$VERSION_CODENAME" "$keyring" | sudo tee /etc/apt/sources.list.d/pgdg.sources
          sudo install -d /etc/postgresql-common/createcluster.d
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.d/pinka-ci.conf
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-18 nftables
      - name: PostgreSQL server binaries, systemd-analyze and nft are present (the SQL, unit and telemetry guard checks must run in CI)
        run: |
          ls /usr/lib/postgresql/*/bin/initdb
          command -v systemd-analyze
          command -v nft
          sudo -n true
      # The pytest suites in the random order of the Makefile's seed (printed;
      # make test-random-order SEED=<seed> repeats it), so a test that passes
      # only after another one fails here, not by chance.
      - run: make test VERBOSE=1 TEST_ORDER=random
        env:
          PINKA_POSTGRES_REQUIRED: "18"
      # Every test's name and result (JUnit XML of pytest and of the Python 3.9
      # runs), kept for each run and each attempt, failed ones included.
      - name: JUnit XML of every test
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: junit-${{ github.job }}-attempt-${{ github.run_attempt }}
          path: build/junit/
          if-no-files-found: error

  docs:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
      - run: make setup
      - run: make docs VERBOSE=1

  lock-check:
    # Re-verifies every pin over the network and fails while any unverified
    # marker remains in versions.lock.yml.
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
      - run: make setup
      - run: make lock-check

  check-mode:
    # Required CI fast lane: the provider-agnostic
    # roles (install_record, base, users_groups, ssh, layout) with --check in a disposable
    # systemd container per family, nothing skipped; never a host. Blocking;
    # skipped for a change of docs only.
    needs: changes
    if: >-
      github.event_name != 'schedule' && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository) &&
      needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu_2404
          - image: debian_13
          - image: fedora_44
          - image: almalinux_9
          - image: opensuse_leap_156
          - image: archlinux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
      - run: make setup
      - run: make check-mode CI_IMAGE=${{ matrix.image }}

  required:
    # The blocking jobs in one check for branch protection: every one passed,
    # or check-mode was skipped for a change of docs only. (A
    # matrix job skipped as a whole reports one check under its own name, not
    # one per lane, so the lanes cannot be required one by one.) It runs
    # always in a real run, also a cancelled one, and fails unless every job
    # passed; skipped (the weekly run, and the pull request run of a branch of
    # this repository) it carries another name, so a skipped job, which counts
    # as passing, can never stand in for "required".
    name: >-
      ${{ (github.event_name == 'schedule' || github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) &&
      'required (skipped: the real run of this commit checks it)' || 'required' }}
    if: >-
      github.event_name != 'schedule' && always() && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository)
    needs: [changes, privacy, lint, test, docs, check-mode]
    runs-on: ubuntu-24.04
    steps:
      - name: Every blocking job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          ANSIBLE: ${{ needs.changes.outputs.ansible }}
        run: |
          python3 - <<'CHECK'
          import json, os, sys
          results = {name: job["result"] for name, job in json.loads(os.environ["RESULTS"]).items()}
          print(json.dumps(results, indent=2))
          allowed = {"check-mode": {"success", "skipped"} if os.environ["ANSIBLE"] == "false" else {"success"}}
          failed = [n for n, r in results.items() if r not in allowed.get(n, {"success"})]
          sys.exit(f"not passed: {', '.join(failed)}" if failed else 0)
          CHECK

  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    continue-on-error: true  # reported, never blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: make links
