# Managed by pinka (.github/workflows/release-package.yml).
#
# The release package from the real Galaxy artifacts:
# on every push that changes the release tooling,
# the lock or tools/lockcheck/, and weekly, the package of the pushed commit
# is built twice with make release-package (its pinned collections downloaded
# from Galaxy and checked against the lock), checked with
# make release-package-check, and the two builds are compared byte for
# byte; its NOTICE is printed. Nothing is uploaded. A failure, of the weekly
# run too, blocks the next step like any CI failure.
name: infra-release-package

on:
  push:
    branches: ["**"]
    paths:
      - "versions.lock.yml"
      - "tools/lockcheck/**"
      - "Makefile"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-package.yml"
  pull_request:  # a fork's only (the job's condition): one run per commit
    paths:
      - "versions.lock.yml"
      - "tools/lockcheck/**"
      - "Makefile"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-package.yml"
  schedule:
    - cron: "53 4 * * 1"  # weekly: the package from Galaxy's artifacts
  workflow_dispatch:

permissions:
  contents: read

# One run per commit: on main and moving/on each commit's
# run has a group of its own and always finishes; elsewhere (a pull request
# from a fork, another branch, a manual run) a newer run cancels the older.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main' ||
    github.ref == 'refs/heads/moving/on') && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  release-package:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - run: make release-package REF=HEAD RELEASE_OUT=build/release-a
      - run: make release-package REF=HEAD RELEASE_OUT=build/release-b
      - run: make release-package-check PACKAGE="$(ls build/release-a/*.tar.gz)"
      - name: Compare the two builds byte for byte
        run: |
          test "$(ls build/release-a)" = "$(ls build/release-b)"
          for file in build/release-a/*; do
            cmp "$file" "build/release-b/${file##*/}"
          done
          cat build/release-a/*.sha256
      - name: Print the package's NOTICE
        run: tar -xzOf build/release-a/*.tar.gz --wildcards '*/release/NOTICE'
