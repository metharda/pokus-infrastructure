repository_keys:
  # OpenPGP keys of the vendor package repositories (BUILD_PROMPT §7.2, §19.4).
  # Roles download a key from one of `urls`, check its primary key
  # fingerprint, and only then install it. Base URLs and package names live in
  # ansible/component-sources.yml.
  verified_on: 2026-10-05
  source: >-
    Keys downloaded from the listed URLs and fingerprinted with gpg and with
    the lock checker's own OpenPGP parser; the Zabbly and Tailscale keys with
    make lock-pins at 2026-10-17T22:47:21Z (their comments name the
    cross-checks)
  keys:
    docker-deb:
      # The Ubuntu and Debian key files are byte-identical.
      urls:
        - https://download.docker.com/linux/ubuntu/gpg
        - https://download.docker.com/linux/debian/gpg
      fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
    docker-rpm:
      # The Fedora and CentOS key files are byte-identical.
      urls:
        - https://download.docker.com/linux/fedora/gpg
        - https://download.docker.com/linux/centos/gpg
      fingerprint: 060A61C51B558A7F742B77AAC52FEB6B621E9F35
    nvidia-container-toolkit:
      # nvidia.github.io is not reachable from the build environment; the file
      # was read from the gh-pages branch of NVIDIA/libnvidia-container, which
      # GitHub Pages serves at this URL.
      urls:
        - https://nvidia.github.io/libnvidia-container/gpgkey
      fingerprint: C95B321B61E88C1809C4F759DDCAE044F796ECB0
    tailscale:
      # make lock-pins on 2026-10-17: every URL (the armored keys of the apt
      # releases and the rpm key; key URL patterns per Tailscale's installer,
      # scripts/installer.sh) carries this one key, "Tailscale Inc. (Package
      # repository signing key)"; keyserver.ubuntu.com holds the same key.
      # Tailscale publishes the fingerprint nowhere apart from the key files.
      urls:
        - https://pkgs.tailscale.com/stable/ubuntu/noble.asc
        - https://pkgs.tailscale.com/stable/ubuntu/jammy.asc
        - https://pkgs.tailscale.com/stable/debian/trixie.asc
        - https://pkgs.tailscale.com/stable/fedora/repo.gpg
      fingerprint: 2596A99EAAB33821893C0A79458CA832957F5868
    zabbly:
      # Incus LTS packages for Debian and Ubuntu. make lock-pins on
      # 2026-10-17: Zabbly's README (github.com/zabbly/incus, branch daily)
      # publishes this fingerprint; keyserver.ubuntu.com holds the same key.
      urls: ["https://pkgs.zabbly.com/key.asc"]
      fingerprint: 4EFC590696CB15B87C73A3AD82CC8797C838DCFD

