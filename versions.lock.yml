ansible_collections:
  # Galaxy's artifact of each version and its sha256 are the only pins.
  # Bootstrap installs exactly these artifacts (from Galaxy, or from
  # release/collections/ when it runs from a release package; each checked
  # against its sha256) with --offline --no-deps, transitive dependencies
  # included, then checks them with ansible-galaxy collection verify
  # --offline; make setup installs the same artifacts (from Galaxy, or from a
  # release package when Galaxy is unreachable). The set is the one bundled in the
  # community package ansible 14.4.0, which is built on ansible-core 2.21.4.
  # The artifacts' URLs, sha256 and sizes come from make lock-collections,
  # which a maintainer runs where Galaxy is reachable
  # (docs/how-to/pin-ansible-collections.md); the lock-collections CI job
  # compares them with Galaxy on every change of this file or of
  # tools/lockcheck/, and weekly.
  verified_on: 2026-10-15
  source: >-
    ansible-community/ansible-build-data 14/ansible-14.4.0.deps; each
    collection's git tag and its meta/runtime.yml requires_ansible (all allow
    ansible-core 2.21). community.library_inventory_filtering_v1, required
    (>=1.0.0) by community.docker 5.3.0 and community.general 13.4.0: 1.1.5,
    the version in ansible 14.4.0 (its MANIFEST.json in
    ansible-14.4.0-py3-none-any.whl from PyPI, sha256
    7aedc85a55a9d14933c155101d6ae2d8358e40142b0dba7eb42125a49222b0f4, read
    2026-10-15). Artifacts: make lock-collections run by the owner at
    2026-10-15T20:33:03Z against galaxy.ansible.com (each sha256
    computed from the download and equal to Galaxy's; MANIFEST.json,
    FILES.json and every file checked; every dependency locked at a
    satisfying version)
  collections:
    ansible.posix: "2.2.2"
    community.crypto: "3.4.0"
    community.docker: "5.3.0"
    community.general: "13.4.0"
