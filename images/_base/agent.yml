# Managed by pinka (images/_base/agent.yml). Local changes will be overwritten.
#
# Configuration of the in-image OpenTelemetry agent (BUILD_PROMPT §7.13),
# installed by _base/provision.yml. The images role runs it after the
# provisioning of every blueprint, so that a blueprint's own telemetry
# settings (image.yaml `telemetry`) apply. Variables: image, otlp_endpoint.
- name: Configure the OpenTelemetry agent
  hosts: all
  gather_facts: false
  tasks:
    - name: Configure the agent
      ansible.builtin.template:
        src: files/otel-agent.yaml.j2
        dest: /etc/otelcol-contrib/config.yaml
        mode: "0644"

    - name: Give the agent the resource attributes and read access to logs
      ansible.builtin.copy:
        src: files/otelcol-contrib-agent.conf
        dest: /etc/systemd/system/otelcol-contrib.service.d/50-agent.conf
        mode: "0644"

    - name: Enable and restart the agent
      ansible.builtin.systemd_service:
        name: otelcol-contrib.service
        enabled: true
        state: restarted
        daemon_reload: true
