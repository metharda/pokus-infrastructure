# Managed by pokus-infra (.markdownlint-cli2.yaml).
config:
  default: true
  MD013: false            # prose is not hard-wrapped
  MD024:
    siblings_only: true
  MD025:
    front_matter_title: ""  # front matter title and the page H1 coexist
  MD033:
    allowed_elements: []  # HTML comments (qa markers) are not elements
  MD041: false            # the title lives in front matter
  MD046: false            # admonition bodies are indented, not code
  MD048: false            # tilde fences are used to nest backtick fences
globs:
  - "**/*.md"
ignores:
  - "node_modules/**"
  - ".venv/**"
  - ".ansible-collections/**"
  - "site/**"
  - "build/**"
  - "docs/BUILD_PROMPT.md"
  - "docs/DOCS_SPEC.md"
