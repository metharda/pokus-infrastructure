# Managed by pokus-infra (.yamllint.yml).
# Compatible with ansible-lint's yamllint requirements.
extends: default
ignore-from-file: .gitignore
rules:
  line-length:
    max: 160
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  document-start: disable
