# Managed by pokus-infra (compose/observability/compose.yml). Local changes will be overwritten.
#
# Observability services (BUILD_PROMPT §7.9, contracts.md#telemetry). Every
# service uses the host network and binds 127.0.0.1 only (Prometheus scrapes
# Incus's loopback API and the exporters; the platform's services and the
# researchers' SSH forwards reach the contract ports); the gateway collector
# also binds the VM listener address when the vm_targets feature is on.
# Variables come from .env (compose role): images pinned by digest, ports,
# paths, configuration hashes and the GPU profile.
name: pokus-observability

x-hardened: &hardened
  restart: unless-stopped
  network_mode: host
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-gpu-exporter: &gpu_exporter
  <<: *hardened
  image: ${GPU_EXPORTER_IMAGE:?pinned image missing}
  container_name: pokus-gpu-exporter
  command: ["--web.listen-address=127.0.0.1:${GPU_EXPORTER_PORT:?}"]

services:
  otel_gateway:
    <<: *hardened
    image: ${OTEL_COLLECTOR_IMAGE:?pinned image missing}
    container_name: pokus-otel-gateway
    labels:
      org.pokus.config-hash: ${OTEL_CONFIG_HASH:-}
    command: ["--config=/etc/otelcol/gateway.yaml"]
    volumes:
      - ./config/otel:/etc/otelcol:ro

  # Reads the host journal through the host's journalctl (chroot into the
  # read-only host root, which needs root and CAP_SYS_CHROOT) and forwards it
  # to the gateway; it accepts nothing from targets.
  otel_journald:
    <<: *hardened
    image: ${OTEL_COLLECTOR_IMAGE:?pinned image missing}
    container_name: pokus-otel-journald
    labels:
      org.pokus.config-hash: ${OTEL_CONFIG_HASH:-}
    user: "0:0"
    cap_add: [SYS_CHROOT]
    command: ["--config=/etc/otelcol/journald.yaml"]
    volumes:
      - ./config/otel:/etc/otelcol:ro
      - /:/hostfs:ro,rslave
      - ${POKUS_ROOT:?}/state/otelcol-journald:/var/lib/otelcol/journald

  prometheus:
    <<: *hardened
    image: ${PROMETHEUS_IMAGE:?pinned image missing}
    container_name: pokus-prometheus
    labels:
      org.pokus.config-hash: ${PROMETHEUS_CONFIG_HASH:-}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:?}
      - --web.listen-address=127.0.0.1:${PROMETHEUS_PORT:?}
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - /etc/pokus/secrets/containers/prometheus-incus:/etc/prometheus/incus:ro
      - ${POKUS_ROOT:?}/state/prometheus:/prometheus

  loki:
    <<: *hardened
    image: ${LOKI_IMAGE:?pinned image missing}
    container_name: pokus-loki
    labels:
      org.pokus.config-hash: ${LOKI_CONFIG_HASH:-}
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./config/loki:/etc/loki:ro
      - ${POKUS_ROOT:?}/state/loki:/loki

  tempo:
    <<: *hardened
    image: ${TEMPO_IMAGE:?pinned image missing}
    container_name: pokus-tempo
    labels:
      org.pokus.config-hash: ${TEMPO_CONFIG_HASH:-}
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./config/tempo:/etc/tempo:ro
      - ${POKUS_ROOT:?}/state/tempo:/var/tempo

  grafana:
    <<: *hardened
    image: ${GRAFANA_IMAGE:?pinned image missing}
    container_name: pokus-grafana
    labels:
      org.pokus.config-hash: ${GRAFANA_CONFIG_HASH:-}
    # Membership of the host group pokus opens the reader socket directory.
    group_add: ["${POKUS_GID:?}"]
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:?}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: ${GRAFANA_AUTO_ASSIGN_ORG_ROLE:?}
      GF_LOG_MODE: console
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    tmpfs: [/tmp]
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - ${POKUS_ROOT:?}/state/grafana:/var/lib/grafana
      - /run/pokus/postgres-reader:/run/pokus/postgres-reader
      - /etc/pokus/secrets/containers/grafana-admin:/run/secrets/grafana-admin:ro
      - /etc/pokus/secrets/containers/pokus-grafana:/run/secrets/pokus-grafana:ro

  node_exporter:
    <<: *hardened
    image: ${NODE_EXPORTER_IMAGE:?pinned image missing}
    container_name: pokus-node-exporter
    pid: host
    command:
      - --web.listen-address=127.0.0.1:${NODE_EXPORTER_PORT:?}
      - --path.rootfs=/host
      - --collector.textfile.directory=/host/var/lib/pokus/node-exporter
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    <<: *hardened
    image: ${CADVISOR_IMAGE:?pinned image missing}
    container_name: pokus-cadvisor
    command:
      - -listen_ip=127.0.0.1
      - -port=${CADVISOR_PORT:?}
      - -docker_only=true
      - -housekeeping_interval=30s
      - -store_container_labels=false
    tmpfs: [/tmp]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - ${DOCKER_DATA_ROOT:?}:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  # GPU metrics through nvidia-smi (works on WSL2), with the GPU method the
  # docker role configured: CDI device or the NVIDIA runtime. COMPOSE_PROFILES
  # in .env enables one of the two services when gpu_inference is on.
  gpu_exporter:
    <<: *gpu_exporter
    profiles: [gpu-cdi]
    devices: ["nvidia.com/gpu=all"]

  gpu_exporter_runtime:
    <<: *gpu_exporter
    profiles: [gpu-runtime]
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
