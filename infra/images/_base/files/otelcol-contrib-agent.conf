# Managed by pinka (images/_base/files/otelcol-contrib-agent.conf). Local changes will be overwritten.
#
# The agent reads the instance's resource attributes before it starts (as
# root, the "+" prefix) and may read the journal and the log files.
[Service]
ExecStartPre=+/usr/local/libexec/otel-agent/resource-env
EnvironmentFile=-/run/otel-agent/resource.env
SupplementaryGroups=systemd-journal adm
