# Managed by pokus-infra (tests/distros/targets.yml). Local changes will be overwritten.
#
# Distribution tests of `make test-distros` (BUILD_PROMPT §19.9): one
# disposable Incus VM per entry. Every `supported` and `tested` release of
# preflight/support-matrix.yml has an entry (a test checks it), plus the
# firewall-backend and SELinux variants. `firewall` is the backend the harness
# establishes before bootstrap (firewalld or ufw installed and active;
# nftables: neither active) and expects in the host profile afterwards;
# `selinux: enforcing` requires SELinux in enforcing mode. Images come from the
# `images` remote and are resolved when the test runs; the result records the
# fingerprint that was used. A derivative distribution is added once an image
# for one is verified.
schema_version: 1
verify: "TODO(verify): VM image aliases on images.linuxcontainers.org (not reachable from the build environment)"
defaults:
  remote: images
  cpus: 4
  memory: 8GiB
  disk: 60GiB
targets:
  - {id: ubuntu-24.04, image: ubuntu/24.04/cloud, os: {id: ubuntu, version_id: "24.04"}, firewall: nftables}
  - {id: ubuntu-24.04-ufw, image: ubuntu/24.04/cloud, os: {id: ubuntu, version_id: "24.04"}, firewall: ufw}
  - {id: debian-13, image: debian/13/cloud, os: {id: debian, version_id: "13"}, firewall: nftables}
  - {id: ubuntu-22.04, image: ubuntu/22.04/cloud, os: {id: ubuntu, version_id: "22.04"}, firewall: nftables}
  - {id: fedora-43, image: fedora/43/cloud, os: {id: fedora, version_id: "43"}, firewall: firewalld, selinux: enforcing}
  - {id: fedora-44, image: fedora/44/cloud, os: {id: fedora, version_id: "44"}, firewall: firewalld}
  - {id: almalinux-9, image: almalinux/9/cloud, os: {id: almalinux, version_id: "9"}, firewall: firewalld, selinux: enforcing}
  - {id: almalinux-10, image: almalinux/10/cloud, os: {id: almalinux, version_id: "10"}, firewall: firewalld}
  - {id: rockylinux-9, image: rockylinux/9/cloud, os: {id: rocky, version_id: "9"}, firewall: nftables}
  - {id: rockylinux-10, image: rockylinux/10/cloud, os: {id: rocky, version_id: "10"}, firewall: nftables}
  - {id: centos-stream-9, image: centos/9-Stream/cloud, os: {id: centos, version_id: "9"}, firewall: nftables}
  - {id: centos-stream-10, image: centos/10-Stream/cloud, os: {id: centos, version_id: "10"}, firewall: nftables}
  - {id: opensuse-leap-15.6, image: opensuse/15.6/cloud, os: {id: opensuse-leap, version_id: "15.6"}, firewall: firewalld}
  - {id: opensuse-leap-16.0, image: opensuse/16.0/cloud, os: {id: opensuse-leap, version_id: "16.0"}, firewall: firewalld}
  - {id: opensuse-tumbleweed, image: opensuse/tumbleweed/cloud, os: {id: opensuse-tumbleweed}, firewall: firewalld}
  - {id: archlinux, image: archlinux/cloud, os: {id: arch}, firewall: nftables}
