# Managed by pokus-infra (mkdocs.yml).
# Component documentation, built in strict mode by `make docs`. The combined
# Pokus site (docs-site/) assembles these pages from an exact commit.
site_name: Pokus infra
site_description: Infrastructure-as-code for the Pokus research lab.
docs_dir: docs
site_dir: site
strict: true
copyright: Documentation licensed under CC-BY-4.0; code under Apache-2.0.

# Verbatim specifications and working notes are not site pages.
exclude_docs: |
  BUILD_PROMPT.md
  DOCS_SPEC.md
  IMPLEMENTATION_NOTES.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Switch to light mode}

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - How-to guides:
      - Check whether a machine can host the lab: how-to/check-a-host.md
      - Add a preflight fixture: how-to/add-preflight-fixture.md
      - Troubleshoot a bootstrap run: how-to/troubleshoot.md
      - Update pinned versions: how-to/update-versions.md
  - Reference:
      - Support matrix: support-matrix.md
      - "CLI: bootstrap.sh": reference/cli/bootstrap.md
      - "CLI: pokus-preflight": reference/cli/pokus-preflight.md
      - Exit codes: reference/exit-codes.md
      - Host profile schema: reference/host-profile.md
      - Pinned versions: reference/versions.md
      - Integration contract: contracts.md
  - Explanation:
      - How the preflight gate decides: explanation/preflight-gate.md
      - How bootstrap works: explanation/bootstrap.md
      - "ADR-0001: Standard-library-only preflight": adr/0001-stdlib-only-preflight.md
      - "ADR-0002: Bootstrap exit codes and error handling": adr/0002-bootstrap-exit-codes.md
