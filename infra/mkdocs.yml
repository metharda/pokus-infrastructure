# Managed by pokus-infra (mkdocs.yml).
# Component documentation, built in strict mode by `make docs`. The combined
# Pokus site (docs-site/) assembles these pages from an exact commit.
site_name: Pokus infra
site_description: Infrastructure-as-code for the Pokus research lab.
docs_dir: docs
site_dir: site
strict: true
copyright: Documentation licensed under CC-BY-4.0; code under Apache-2.0.

# Verbatim specifications and working notes are not site pages.
exclude_docs: |
  BUILD_PROMPT.md
  DOCS_SPEC.md
  IMPLEMENTATION_NOTES.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Switch to light mode}

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - How-to guides:
      - Check whether a machine can host the lab: how-to/check-a-host.md
      - Start, stop and drain the lab: how-to/start-stop-drain.md
      - Update the host operating system: how-to/update-host.md
      - Add, remove or lock a researcher: how-to/manage-researchers.md
      - Add a model and activate a deployment: how-to/add-a-model.md
      - Deploy the platform and the scenario catalog: how-to/deploy-platform.md
      - Run inference on a separate GPU node: how-to/pair-inference-node.md
      - Reach Grafana and the lab database: how-to/reach-grafana.md
      - Build, test and export golden images: how-to/build-golden-images.md
      - Back up, restore and run a restore drill: how-to/backup-and-restore.md
