# Managed by pokus-infra (preflight/ruff.toml).
# Preflight must stay source-compatible with Python 3.9 (BUILD_PROMPT §2.1):
# ruff checks syntax and suggestions against 3.9; mypy cannot target 3.9 any
# more, so `make test` also runs the test suite on CPython 3.9.
extend = "../pyproject.toml"
target-version = "py39"

[lint]
# os.path is used deliberately: it reads naturally next to the root-relative
# FileSystem API and behaves identically on Python 3.9.
extend-ignore = ["PTH"]

[lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR2004", "RUF012", "PLC0415", "E501"]
