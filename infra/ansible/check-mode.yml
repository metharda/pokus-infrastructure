# Managed by pokus-infra (ansible/check-mode.yml). Local changes will be overwritten.
#
# CI fast lane (BUILD_PROMPT §19.9): the provider-agnostic roles in check mode
# against a systemd container of one distribution family, with the host
# profile that preflight wrote inside the container. Run by `make check-mode`
# (tools/test-distros); it refuses to run without --check.
- name: Check mode of the provider-agnostic roles
  hosts: all
  gather_facts: true
  vars_files:
    - inventory/host_vars/example-machine.yml
  vars:
    pokus_infra_dir: "{{ playbook_dir | dirname }}"
  pre_tasks:
    - name: Refuse to run except in check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
          - host_profile is mapping
          - pokus_bootstrap is mapping
        fail_msg: This play only runs with --check, from make check-mode.
        quiet: true
      tags: [always]

  tasks:
    - name: Derive the platform facts
      ansible.builtin.import_role:
        name: platform_facts
      tags: [platform_facts, always]

    - name: Base system
      ansible.builtin.import_role:
        name: base
      tags: [base]

    - name: Groups and accounts
      ansible.builtin.import_role:
        name: users_groups
      tags: [users_groups]

    - name: SSH
      ansible.builtin.import_role:
        name: ssh
      tags: [ssh]

    - name: Research space layout
      ansible.builtin.import_role:
        name: layout
      tags: [layout]

    - name: Mandatory access control
      ansible.builtin.import_role:
        name: mac
      tags: [mac]

    - name: Firewall
      ansible.builtin.import_role:
        name: firewall
      tags: [firewall]
