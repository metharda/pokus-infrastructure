# Managed by pokus-infra (ansible/site.yml). Local changes will be overwritten.
#
# Provisioning play run by bootstrap.sh (BUILD_PROMPT §5.2 step 8) with
# `-e machine=<name>` and the variables host_profile and pokus_bootstrap.
# Every role is tagged with its name; platform_facts and preflight_gate always
# run, so `--tags <role>` still works on the validated facts.
- name: Provision the Pokus lab host
  hosts: localhost
  gather_facts: true
  vars_files:
    - "inventory/host_vars/{{ machine }}.yml"
  vars:
    pokus_infra_dir: "{{ playbook_dir | dirname }}"
  pre_tasks:
    - name: Check the variables passed by bootstrap
      ansible.builtin.assert:
        that:
          - machine is defined
          - host_profile is mapping
          - host_profile.schema_version == 1
          - pokus_bootstrap is mapping
        fail_msg: "Run this play through bootstrap/bootstrap.sh, which passes machine, host_profile and pokus_bootstrap."
        quiet: true
      tags: [always]

  tasks:
    - name: Derive the platform facts
      ansible.builtin.import_role:
        name: platform_facts
      tags: [platform_facts, always]

    - name: Re-validate the host profile
      ansible.builtin.import_role:
        name: preflight_gate
      tags: [preflight_gate, always]

    - name: Apply the provider
      ansible.builtin.include_role:
        name: "provider_{{ pokus_provider }}"
        apply:
          tags: ["provider_{{ pokus_provider }}", providers]
      tags: [provider_wsl2, provider_baremetal, provider_vm, providers]

    - name: Base system
      ansible.builtin.import_role:
        name: base
      tags: [base]

    - name: Groups and accounts
      ansible.builtin.import_role:
        name: users_groups
      tags: [users_groups]

    - name: SSH
      ansible.builtin.import_role:
        name: ssh
      tags: [ssh]

    - name: Research space layout
      ansible.builtin.import_role:
        name: layout
      tags: [layout]

    - name: Provider files that need the layout
      ansible.builtin.include_role:
        name: provider_wsl2
        tasks_from: post_layout
        apply:
          tags: [provider_wsl2, providers]
      when: pokus_provider == 'wsl2'
      tags: [provider_wsl2, providers]

    - name: Mandatory access control
      ansible.builtin.import_role:
        name: mac
      tags: [mac]

    - name: Firewall
      ansible.builtin.import_role:
        name: firewall
      tags: [firewall]

    - name: Tailscale
      ansible.builtin.import_role:
        name: tailscale
      tags: [tailscale]

    - name: Docker Engine
      ansible.builtin.import_role:
        name: docker
      tags: [docker]

    - name: NVIDIA Container Toolkit
      ansible.builtin.include_role:
        name: nvidia_container_toolkit
        apply:
          tags: [nvidia_container_toolkit]
      when: pokus_features.gpu_inference | default(false)
      tags: [nvidia_container_toolkit]

    - name: Incus
      ansible.builtin.import_role:
        name: incus
      tags: [incus]

    - name: PostgreSQL
      ansible.builtin.import_role:
        name: postgres
      tags: [postgres]

    - name: Open Policy Agent
      ansible.builtin.import_role:
        name: opa
      tags: [opa]

    - name: Observability
      ansible.builtin.import_role:
        name: observability
      tags: [observability]

    - name: Model weights
      ansible.builtin.include_role:
        name: models
        apply:
          tags: [models]
      when: &pokus_serves_inference
        - pokus_features.gpu_inference | default(false)
        - node_role in ['full', 'inference']
      tags: [models]

    - name: Inference server (vLLM)
      ansible.builtin.include_role:
        name: vllm
        apply:
          tags: [vllm]
      when: *pokus_serves_inference
      tags: [vllm]
