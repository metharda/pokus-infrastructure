# Managed by pokus-infra (ansible/site.yml). Local changes will be overwritten.
#
# Provisioning play run by bootstrap.sh (BUILD_PROMPT §5.2 step 8) with
# `-e machine=<name>` and the variables host_profile and pokus_bootstrap.
# Temporary stub of implementation step 3: the roles are added from step 5 on.
- name: Provision the Pokus lab host
  hosts: localhost
  gather_facts: false
  vars_files:
    - "inventory/host_vars/{{ machine }}.yml"
  tasks:
    - name: Check the variables passed by bootstrap
      ansible.builtin.assert:
        that:
          - machine is defined
          - host_profile is mapping
          - host_profile.schema_version == 1
          - pokus_bootstrap is mapping
        fail_msg: "Run this play through bootstrap/bootstrap.sh, which passes machine, host_profile and pokus_bootstrap."
        quiet: true

    - name: Report that no provisioning roles exist yet
      ansible.builtin.debug:
        msg: "No provisioning roles yet (implementation step 3 stub); host profile outcome: {{ host_profile.outcome }}."
