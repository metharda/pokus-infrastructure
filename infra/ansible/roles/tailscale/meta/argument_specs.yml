# Managed by pinka (ansible/roles/tailscale/meta/argument_specs.yml). Local changes will be overwritten.
argument_specs:
  main:
    short_description: Install Tailscale, join the tailnet with the lab's tag, check that Funnel is off.
    options:
      machine_name:
        type: str
        required: true
        description: Host name on the tailnet.
      lab_mode:
        type: str
        required: true
        choices: [production, staging]
        description: Selects the tag (tag:pinka-lab or tag:pinka-qa).
      grafana_tailscale_serve:
        type: bool
        required: true
        description: Publish Grafana on the tailnet with `tailscale serve` (never Funnel).
      tailscale_tag:
        type: str
        default: tag:pinka-lab
        description: Advertised tag; derived from lab_mode.
      tailscale_accept_dns:
        type: bool
        default: false
        description: Let MagicDNS change host name resolution.
      tailscale_up_argv:
        type: list
        elements: str
        default: []
        description: Arguments of `tailscale up` (without the auth key).
      tailscale_login_timeout:
        type: int
        default: 600
        description: Seconds to wait for an interactive login.
      tailscale_grafana_serve_port:
        type: int
        default: 443
        description: HTTPS port of the Grafana serve.
