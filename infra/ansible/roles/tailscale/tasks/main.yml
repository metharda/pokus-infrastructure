# Managed by pokus-infra (ansible/roles/tailscale/tasks/main.yml). Local changes will be overwritten.
#
# Tailscale (BUILD_PROMPT §7.4): pinned and held packages from the component
# source matrix, a tailnet join with the lab's tag, and a hard check that
# Funnel is off. Lab services are never published to the internet.
- name: Look up the Tailscale source
  ansible.builtin.set_fact:
    tailscale_source: "{{ pokus_component_sources | pokus_component_source('tailscale', pokus_source_group) }}"
    tailscale_versions: "{{ pokus_versions.packages | pokus_lock_packages('tailscale', pokus_release_key) }}"

- name: Refuse an unverified Tailscale source
  ansible.builtin.assert:
    that:
      - tailscale_source.verify is not defined
    fail_msg: >-
      ansible/component-sources.yml marks the Tailscale source for {{ pokus_source_group }}
      as unverified ({{ tailscale_source.verify | default('') }}); verify it first
      (docs/how-to/update-versions.md).
    quiet: true

- name: Add the Tailscale repository
  ansible.builtin.include_role:
    name: pkg
    tasks_from: repo
  vars:
    pkg_repo_name: "{{ tailscale_source.repo }}"
  when: tailscale_source.source == 'vendor_repo'

- name: Install Tailscale
  ansible.builtin.include_role:
    name: pkg
  vars:
    pkg_packages: "{{ tailscale_source.packages }}"
    pkg_versions: "{{ tailscale_versions }}"

- name: Hold the Tailscale packages
  ansible.builtin.include_role:
    name: pkg
    tasks_from: hold
  vars:
    pkg_hold_name: tailscale
    pkg_hold_packages: "{{ tailscale_source.packages }}"
    pkg_versions: "{{ tailscale_versions }}"

- name: Enable tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Join the tailnet
  ansible.builtin.include_tasks: join.yml
  when: not ansible_check_mode

- name: Check that Funnel is off
  ansible.builtin.include_tasks: funnel.yml
  when: not ansible_check_mode
