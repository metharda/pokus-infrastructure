# Managed by pinka (ansible/roles/tailscale/tasks/join.yml). Local changes will be overwritten.
#
# Skip when already logged in with the same host name and tags. Otherwise use
# the auth key from the vault, or show the login URL and wait for an
# interactive login; a non-interactive run without a key stops with signal 77.
- name: Read the Tailscale state
  ansible.builtin.command:
    argv: [tailscale, status, --json]
  register: tailscale_status_raw
  changed_when: false
  failed_when: tailscale_status_raw.rc not in [0, 1]

- name: Decide whether a login is needed
  ansible.builtin.set_fact:
    tailscale_status: "{{ tailscale_status_raw.stdout | from_json }}"
    tailscale_joined: >-
      {{ (tailscale_status_raw.stdout | from_json).BackendState | default('') == 'Running'
         and (tailscale_status_raw.stdout | from_json).Self.HostName | default('') == machine_name
         and tailscale_tag in ((tailscale_status_raw.stdout | from_json).Self.Tags | default([])) }}

- name: Join with the auth key from the vault
  ansible.builtin.command:
    argv: "{{ tailscale_up_argv + ['--auth-key=' ~ vault_tailscale_authkey] }}"
  no_log: true
  changed_when: true
  when:
    - not tailscale_joined
    - vault_tailscale_authkey | default('') | length > 0

- name: Stop when an interactive login is needed but not possible
  ansible.builtin.include_role:
    name: bootstrap_signal
  vars:
    bootstrap_signal_code: 77
    bootstrap_signal_message: >-
      Tailscale needs a login. Put an auth key into vault_tailscale_authkey, or re-run bootstrap
      interactively and open the login URL it prints.
  when:
    - not tailscale_joined
    - vault_tailscale_authkey | default('') | length == 0
    - not (pinka_bootstrap.interactive | default(false))

- name: Log in interactively
  when:
    - not tailscale_joined
    - vault_tailscale_authkey | default('') | length == 0
  block:
    - name: Start the login in the background
      ansible.builtin.command:
        argv: "{{ tailscale_up_argv + ['--timeout=' ~ tailscale_login_timeout ~ 's'] }}"
      async: "{{ tailscale_login_timeout + 60 }}"
      poll: 0
      register: tailscale_login_job
      changed_when: true

    - name: Wait for the login URL
      ansible.builtin.command:
        argv: [tailscale, status, --json]
      register: tailscale_login_status
      until: (tailscale_login_status.stdout | from_json).AuthURL | default('') | length > 0
        or (tailscale_login_status.stdout | from_json).BackendState | default('') == 'Running'
      retries: 30
      delay: 2
      changed_when: false
      failed_when: false

    - name: Show the login URL
      ansible.builtin.debug:
        msg: "Open this URL to add {{ machine_name }} to the tailnet: {{ (tailscale_login_status.stdout | from_json).AuthURL }}"
      when: (tailscale_login_status.stdout | from_json).AuthURL | default('') | length > 0

    - name: Wait for the login to complete
      ansible.builtin.async_status:
        jid: "{{ tailscale_login_job.ansible_job_id }}"
      register: tailscale_login_result
      until: tailscale_login_result.finished
      retries: "{{ (tailscale_login_timeout / 5) | int }}"
      delay: 5
