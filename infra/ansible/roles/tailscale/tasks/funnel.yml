# Managed by pinka (ansible/roles/tailscale/tasks/funnel.yml). Local changes will be overwritten.
#
# Funnel publishes a port to the internet and is never allowed (BUILD_PROMPT
# §13.3). TODO(verify): the JSON layout of `tailscale serve status --json`
# (AllowFunnel) in the pinned Tailscale version.
- name: Read the serve and Funnel configuration
  ansible.builtin.command:
    argv: [tailscale, serve, status, --json]
  register: tailscale_serve_status
  changed_when: false

- name: Fail if any Funnel configuration exists
  ansible.builtin.assert:
    that:
      - (tailscale_serve_status.stdout | default('{}', true) | from_json).AllowFunnel | default({}) | length == 0
    fail_msg: >-
      Tailscale Funnel is configured on this host; pinka never publishes lab services to the
      internet. Remove it with `tailscale funnel reset` and re-run bootstrap.
    quiet: true

- name: Publish Grafana on the tailnet only
  ansible.builtin.command:
    argv: [tailscale, serve, --bg, "--https={{ tailscale_grafana_serve_port }}", "http://127.0.0.1:{{ pinka_ports.grafana }}"]
  when:
    - grafana_tailscale_serve | bool
    - (tailscale_serve_status.stdout | default('{}', true) | from_json).TCP | default({}) is not search(tailscale_grafana_serve_port | string)
  changed_when: true

- name: Publish the documentation on the tailnet only
  ansible.builtin.command:
    argv: [tailscale, serve, --bg, "--https={{ tailscale_docs_serve_port }}", "http://127.0.0.1:{{ pinka_ports.docs_serve }}"]
  when:
    - docs_tailscale_serve | bool
    - docs_release is not none
    - (tailscale_serve_status.stdout | default('{}', true) | from_json).TCP | default({}) is not search(tailscale_docs_serve_port | string)
  changed_when: true
