# Managed by pokus-infra (ansible/roles/catalog/tasks/main.yml). Local changes will be overwritten.
#
# The scenario catalog (BUILD_PROMPT §7.14, contracts.md, resolution B2):
# `git archive` of catalog/ at catalog_ref from the root-only mirror into
# /srv/pokus/catalog/<ref>/ (root:pokus-gt, directories 0750, files 0640)
# and an atomic `current` symlink. Catalog content never lands anywhere else.
# Nothing happens while catalog_enabled is false; existing deployments are kept.

- name: Deploy the catalog
  when: catalog_enabled | bool
  block:
    - name: Check the catalog settings
      ansible.builtin.assert:
        that:
          - catalog_ref | length > 0
          - node_role in ['full', 'lab']
        fail_msg: "catalog_enabled needs catalog_ref and a full or lab node."
        quiet: true

    - name: Fetch the source repository
      ansible.builtin.include_role:
        name: deploy_source

    - name: Extract the catalog
      ansible.builtin.include_role:
        name: deploy_source
        tasks_from: deploy
      vars:
        deploy_source_component: catalog
        deploy_source_ref: "{{ catalog_ref }}"
        deploy_source_root: "{{ catalog_root }}"
        deploy_source_group: pokus-gt
        deploy_source_dir_mode: "0750"
        deploy_source_file_mode: "0640"

    - name: Make the catalog current
      ansible.builtin.include_role:
        name: deploy_source
        tasks_from: activate
      vars:
        deploy_source_component: catalog
        deploy_source_root: "{{ catalog_root }}"
        deploy_source_name: "{{ deploy_source_result.name }}"
      when: not ansible_check_mode
