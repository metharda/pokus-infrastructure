# Managed by pokus-infra (ansible/roles/catalog/meta/argument_specs.yml). Local changes will be overwritten.
argument_specs:
  main:
    short_description: Deploy the scenario catalog at catalog_ref into /srv/pokus/catalog (only if enabled).
    options:
      catalog_enabled:
        type: bool
        default: false
        description: Deploy the catalog.
      catalog_ref:
        type: str
        default: ""
        description: A catalog-v tag (recommended), another tag, a branch or a full commit.
      node_role:
        type: str
        required: true
        description: The catalog is deployed on full and lab nodes only.
      pokus_root:
        type: path
        required: true
        description: Research space root.
