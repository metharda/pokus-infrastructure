# Managed by pokus-infra (ansible/roles/docker/meta/argument_specs.yml). Local changes will be overwritten.
argument_specs:
  main:
    short_description: Docker Engine with Compose and buildx, pinned and held, and its daemon configuration.
    options:
      researchers:
        type: list
        elements: dict
        required: true
        description: Researchers; break-glass Docker access is only allowed for admins.
      break_glass_docker:
        type: list
        elements: str
        required: true
        description: Admins added to the docker group (root-equivalent), logged and recorded in the fingerprint.
      docker_data_root:
        type: path
        default: /var/lib/docker
        description: Root of Docker's images, containers and volumes.
      docker_address_pools:
        type: list
        elements: dict
        default: [{base: 172.30.0.0/16, size: 24}]
        description: >-
          Address pools for Docker networks; must not overlap Incus bridges,
          Tailscale's 100.64.0.0/10 or 192.168.0.0/16.
      docker_cgroup_parent:
        type: str
        default: "{{ pokus_services_slice }}"
        description: >-
          Systemd slice of every container (daemon.json cgroup-parent), the lab
          services' slice that AllowedCPUs pins to cpuset_services.
      docker_log_max_size:
        type: str
        default: 20m
        description: Maximum size of one log file of the local log driver.
      docker_log_max_file:
        type: int
        default: 5
        description: Number of log files kept per container by the local log driver.
      docker_cdi_min_major:
        type: int
        default: 25
        description: First Docker Engine major version with CDI device support; older engines get the NVIDIA runtime.
