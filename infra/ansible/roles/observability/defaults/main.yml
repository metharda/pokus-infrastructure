# Managed by pokus-infra (ansible/roles/observability/defaults/main.yml). Local changes will be overwritten.

# Memory limit of the gateway collector (memory_limiter); the journald
# collector gets half.
observability_collector_memory_mib: 512
# Prometheus retention (BUILD_PROMPT §7.9).
observability_prometheus_retention: 90d
# Loki retention of logs.
observability_loki_retention: 2160h
# Tempo retention of traces.
observability_tempo_retention: 720h
# GPU exporter with gpu_inference: nvidia_smi (nvidia_gpu_exporter, works on
# WSL2) or dcgm (refused while the DCGM exporter image is unverified in
# versions.lock.yml).
observability_gpu_exporter: nvidia_smi
# Grafana's password for the Postgres reader datasource (pokus_grafana).
observability_grafana_db_password: "{{ vault_postgres_passwords.pokus_grafana }}"
# Grafana's admin password (vault).
observability_grafana_admin_password: "{{ vault_grafana_admin_password }}"
# Researchers' Grafana passwords by name (vault).
observability_grafana_user_passwords: "{{ vault_grafana_user_passwords | default({}) }}"
# Grafana organization role of the researchers' accounts.
observability_grafana_user_role: Viewer
# Rendered configuration of the observability project.
observability_config_dir: "{{ pokus_root }}/services/observability/config"
