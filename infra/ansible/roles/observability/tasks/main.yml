# Managed by pokus-infra (ansible/roles/observability/tasks/main.yml). Local changes will be overwritten.
#
# Observability stack (BUILD_PROMPT §7.9, contracts.md#telemetry): the
# collector gateway and the journald collector, Prometheus, Loki, Tempo,
# Grafana, node_exporter, cAdvisor and, with gpu_inference, the GPU exporter.
# Every container uses the host network and binds 127.0.0.1; the VM listener
# address (C4) exists only with vm_targets.
- name: Check the secrets and the GPU exporter choice
  ansible.builtin.assert:
    that:
      - vault_grafana_admin_password is defined
      - vault_grafana_admin_password | length >= 8
      - vault_postgres_passwords.pokus_grafana is defined
      - "'$' not in vault_postgres_passwords.pokus_grafana"
      - researchers | map(attribute='name') | difference(observability_grafana_user_passwords.keys() | list) | length == 0
      - observability_gpu_exporter in ['nvidia_smi', 'dcgm']
      - observability_gpu_exporter != 'dcgm' or pokus_versions.containers.images.dcgm_exporter.digest is match('sha256:')
    fail_msg: >-
      group_vars/all/vault.yml needs vault_grafana_admin_password (8 or more
      characters), vault_postgres_passwords.pokus_grafana (without "$", which
      Grafana's provisioning expands) and vault_grafana_user_passwords for
      every researcher; observability_gpu_exporter is nvidia_smi or dcgm, and
      dcgm only once its image is verified in versions.lock.yml.
    quiet: true

- name: Set up the VM telemetry listener
  ansible.builtin.include_tasks: vm_listener.yml

- name: Create the data directories
  ansible.builtin.file:
    path: "{{ pokus_root }}/state/{{ item.name }}"
    state: directory
    owner: "{{ item.uid }}"
    group: "{{ item.gid }}"
    mode: "0700"
  loop: "{{ observability_state_dirs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ observability_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the secrets
  ansible.builtin.include_tasks: secrets.yml

- name: Create the configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - {path: "{{ observability_config_dir | dirname }}", group: pokus-admin, mode: "0750"}
    - {path: "{{ observability_config_dir }}"}
    - {path: "{{ observability_config_dir }}/otel"}
    - {path: "{{ observability_config_dir }}/prometheus"}
    - {path: "{{ observability_config_dir }}/loki"}
    - {path: "{{ observability_config_dir }}/tempo"}
    - {path: "{{ observability_config_dir }}/grafana"}
    - {path: "{{ observability_config_dir }}/grafana/provisioning"}
    - {path: "{{ observability_config_dir }}/grafana/provisioning/datasources"}
    - {path: "{{ observability_config_dir }}/grafana/provisioning/dashboards"}
    - {path: "{{ observability_config_dir }}/grafana/dashboards"}
  loop_control:
    label: "{{ item.path }}"

- name: Render the configuration
  ansible.builtin.template:
    src: "{{ pokus_infra_dir }}/config/{{ item }}.j2"
    dest: "{{ observability_config_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - otel/gateway.yaml
    - otel/journald.yaml
    - prometheus/prometheus.yml
    - loki/loki.yaml
    - tempo/tempo.yaml
    - grafana/provisioning/datasources/pokus.yaml
    - grafana/provisioning/dashboards/pokus.yaml

- name: Install the dashboards
  ansible.builtin.copy:
    src: "{{ pokus_infra_dir }}/config/grafana/dashboards/"
    dest: "{{ observability_config_dir }}/grafana/dashboards/"
    owner: root
    group: root
    mode: "0644"

- name: Start the observability services
  ansible.builtin.include_role:
    name: compose
  vars:
    compose_project: observability
    compose_description: telemetry, metrics, logs, traces and dashboards
    compose_gpu: "{{ observability_gpu }}"
    compose_extra_env:
      PROMETHEUS_RETENTION: "{{ observability_prometheus_retention }}"
      GRAFANA_AUTO_ASSIGN_ORG_ROLE: "{{ observability_grafana_user_role }}"

- name: Wait until the services answer
  ansible.builtin.uri:
    url: "{{ item }}"
    status_code: 200
  register: observability_ready
  retries: 30
  delay: 5
  until: observability_ready.status == 200
  loop:
    - "http://127.0.0.1:{{ pokus_internal_ports.collector_health }}/"
    - "http://127.0.0.1:{{ pokus_internal_ports.journald_health }}/"
    - "http://127.0.0.1:{{ pokus_ports.prometheus }}/-/ready"
    - "http://127.0.0.1:{{ pokus_ports.loki }}/ready"
    - "http://127.0.0.1:{{ pokus_ports.tempo }}/ready"
    - "{{ observability_grafana_url }}/api/health"
  when: not ansible_check_mode

- name: Provision the Grafana accounts
  ansible.builtin.include_tasks: grafana_users.yml
  when: not ansible_check_mode
