# Managed by pinka (ansible/roles/observability/vars/main.yml). Local changes will be overwritten.

# Prometheus, Loki, Tempo and Grafana run on full and lab nodes; an inference
# node runs the collectors and exporters only and forwards everything to its
# paired lab node (BUILD_PROMPT §19.10).
observability_stores: "{{ node_role in ['full', 'lab'] }}"
# Inference node: the paired lab node that receives its telemetry (empty until paired).
observability_forward_node: "{{ inference_lab_node if node_role == 'inference' else '' }}"
# Lab node: the paired inference node whose telemetry arrives over mutual TLS.
observability_inference_node: "{{ inference_remote_node if node_role == 'lab' else '' }}"
# The collector gateway's copy of the pairing material (/etc/pinka/inference),
# readable by its container user only.
observability_pairing_dir: "{{ observability_secrets_dir }}/otel-pairing"
observability_pairing_files: [self.crt, self.key, peer.crt]
# Researchers with grafana: false get no Grafana account; the accounts to keep
# (everyone else) and to disable (those and the removed researchers).
observability_grafana_opted_out: >-
  {{ researchers | selectattr('grafana', 'defined') | rejectattr('grafana') | map(attribute='name') | list }}
observability_grafana_researchers: >-
  {{ researchers | map(attribute='name') | reject('in', observability_grafana_opted_out) | list }}
observability_grafana_disabled: "{{ observability_grafana_opted_out + researchers_removed }}"
# Container user of the collector gateway (compose/observability/compose.yml).
observability_gateway_uid: 10001
# The dedicated OTLP listener for VM targets exists only with vm_targets (C4),
# on nodes that run Incus.
observability_vm_listener: "{{ (pinka_features.vm_targets | default(false) | bool) and observability_stores }}"
# OTLP receivers of the gateway's pipelines.
observability_otlp_receivers: "{{ ['otlp'] + (['otlp/vm'] if observability_vm_listener else []) }}"
# An inference node's gateway scrapes the local exporters itself (receiver prometheus).
observability_metrics_receivers: "{{ observability_otlp_receivers + ([] if observability_stores else ['prometheus']) }}"
# Exporters by signal: the local stores, the paired lab node, or nowhere
# (nop) on an inference node that is not paired yet.
observability_exporters: >-
  {{ {'logs': 'otlp_http/loki', 'metrics': 'prometheus', 'traces': 'otlp_grpc/tempo'} if observability_stores
     else ({'logs': 'otlp_grpc/lab', 'metrics': 'otlp_grpc/lab', 'traces': 'otlp_grpc/lab'}
           if observability_forward_node | length > 0
           else {'logs': 'nop', 'metrics': 'nop', 'traces': 'nop'}) }}
# GPU metrics only with gpu_inference.
observability_gpu: "{{ pinka_features.gpu_inference | default(false) | bool }}"
# vLLM serves on this host (node_role full or inference) with gpu_inference.
observability_vllm: "{{ observability_gpu and node_role in ['full', 'inference'] }}"
# Data directories under pinka_root/state with the UID and GID of the image's user.
observability_state_dirs:
  - {name: prometheus, uid: 65534, gid: 65534}
  - {name: loki, uid: 10001, gid: 10001}
  - {name: tempo, uid: 10001, gid: 10001}
  - {name: grafana, uid: 472, gid: 0}
  - {name: otelcol-journald, uid: 0, gid: 0}
# Secrets mounted into containers (directory 0700 root; files 0400 owned by the reader's UID).
observability_secrets_dir: /etc/pinka/secrets/containers
# The Incus metrics certificate (incus role) and its copy for Prometheus.
observability_incus_cert_dir: /etc/pinka/incus/metrics
observability_incus_server_cert: /var/lib/incus/server.crt
# Grafana's HTTP API on the host.
observability_grafana_url: "http://127.0.0.1:{{ pinka_ports.grafana }}"
# Directory of the node exporter's textfile collector (backup and other host metrics).
observability_textfile_dir: /var/lib/pinka/node-exporter
