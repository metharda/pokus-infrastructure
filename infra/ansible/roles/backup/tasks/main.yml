# Managed by pokus-infra (ansible/roles/backup/tasks/main.yml). Local changes will be overwritten.
#
# Backups (BUILD_PROMPT §7.15): the pinned restic, local PostgreSQL dumps and
# restic backups of pokus_root and /etc/pokus on timers, retention, and
# metrics for the node exporter's textfile collector.

- name: Refuse to back up secrets without the acknowledgement
  ansible.builtin.assert:
    that: not backup_include_secrets or backup_secrets_acknowledged
    fail_msg: >-
      backup_include_secrets puts the files of backup_secret_paths into the restic repository,
      protected only by its encryption; set backup_secrets_acknowledged: true to confirm.
    quiet: true

- name: Require a repository password
  ansible.builtin.assert:
    that: not backup_configured or backup_password | length > 0
    fail_msg: A backup repository is configured but vault_restic_password is empty.
    quiet: true

- name: Require the backup server's host keys for an SFTP repository
  ansible.builtin.assert:
    that: not (backup_configured and backup_sftp) or backup_sftp_known_hosts | length > 0
    fail_msg: >-
      The repository is reached over SFTP; set backup_sftp_known_hosts to the server's
      known_hosts lines (docs/how-to/backup-and-restore.md).
    quiet: true

- name: Create the directories of restic, the helper and the backup state
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ backup_restic_dir }}", mode: "0755"}
    - {path: "{{ backup_helper | dirname }}", mode: "0755"}
    - {path: "{{ backup_config_dir }}", mode: "0755"}
    - {path: "{{ backup_secrets_dir }}", mode: "0700"}
    - {path: "{{ backup_cache_dir }}", mode: "0700"}
    - {path: "{{ backup_state_dir }}", mode: "0700"}
    - {path: "{{ backup_pgdump_dir }}", mode: "0700"}
    - {path: "{{ backup_textfile_dir }}", mode: "0755"}
  loop_control:
    label: "{{ item.path }}"
  register: backup_dirs

# In check mode, the tasks that need these directories wait until they exist.
- name: Download the pinned restic
  ansible.builtin.get_url:
    url: "{{ backup_restic_asset.url }}"
    checksum: "sha256:{{ backup_restic_asset.sha256 }}"
    dest: "{{ backup_restic_dir }}/restic.bz2"
    owner: root
    group: root
    mode: "0644"
  when: not (ansible_check_mode and backup_dirs is changed)

- name: Decompress restic
  ansible.builtin.command:
    argv: [bunzip2, --keep, "{{ backup_restic_dir }}/restic.bz2"]
    creates: "{{ backup_restic_dir }}/restic"

- name: Make restic executable
  ansible.builtin.file:
    path: "{{ backup_restic_dir }}/restic"
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode

- name: Put restic on the PATH
  ansible.builtin.file:
    src: "{{ backup_restic_dir }}/restic"
    dest: "{{ backup_restic }}"
    state: link
    force: true
  when: not ansible_check_mode

- name: Install the backup helper
  ansible.builtin.copy:
    src: pokus_backup.py
    dest: "{{ backup_helper }}"
    owner: root
    group: root
    mode: "0755"

- name: Write the repository location
  ansible.builtin.copy:
    content: "{{ backup_repository }}\n"
    dest: "{{ backup_secrets_dir }}/repository"
    owner: root
    group: root
    mode: "0600"
  when: backup_configured
  no_log: true

- name: Forget the repository location (backups not configured)
  ansible.builtin.file:
    path: "{{ backup_secrets_dir }}/repository"
    state: absent
  when: not backup_configured

# The password of an existing repository changes only through rotate.yml,
# which adds the new key before it replaces the file (a plain rewrite would
# lock the lab out of its own backups).
- name: Write the repository password once
  ansible.builtin.copy:
    content: "{{ backup_password }}"
    dest: "{{ backup_secrets_dir }}/password"
    owner: root
    group: root
    mode: "0600"
    force: false
  when: backup_configured
  no_log: true

- name: Read the repository password in use
  ansible.builtin.slurp:
    src: "{{ backup_secrets_dir }}/password"
  register: backup_password_file
  when: backup_configured and not ansible_check_mode
  no_log: true

- name: Warn when the vault holds a different repository password
  ansible.builtin.debug:
    msg: >-
      vault_restic_password differs from the password of the repository in use; backups keep
      the old one until you run rotate.yml with the tag restic (docs/how-to/rotate-secrets.md).
  when:
    - backup_configured
    - not ansible_check_mode
    - (backup_password_file.content | b64decode) != backup_password

- name: Create the SSH key for the SFTP repository
  community.crypto.openssh_keypair:
    path: "{{ backup_secrets_dir }}/ssh_key"
    type: ed25519
    comment: "pokus-backup@{{ machine_name }}"
    owner: root
    group: root
    mode: "0600"
  register: backup_ssh_key
  when:
    - backup_configured and backup_sftp
    - not (ansible_check_mode and backup_dirs is changed)

- name: Show the public key to authorize on the backup server
  ansible.builtin.debug:
    msg: >-
      The repository's SFTP account must authorize this key:
      {{ backup_ssh_key.public_key | default('(created on the first run that is not a check)') }}
  when: backup_configured and backup_sftp

- name: Pin the backup server's host keys
  ansible.builtin.copy:
    content: "{{ backup_sftp_known_hosts | join('\n') }}\n"
    dest: "{{ backup_known_hosts }}"
    owner: root
    group: root
    mode: "0644"
  when: backup_configured and backup_sftp

- name: Write the helper's configuration
  ansible.builtin.copy:
    dest: "{{ backup_config_dir }}/backup.json"
    content: >-
      {{ {'schema_version': 1, 'restic': backup_restic, 'host': machine_name, 'tag': 'pokus',
          'secrets_dir': backup_secrets_dir, 'known_hosts': backup_known_hosts,
          'cache_dir': backup_cache_dir, 'state': backup_state_dir ~ '/state.json',
          'textfile_dir': backup_textfile_dir,
          'paths': backup_paths, 'excludes': backup_excludes, 'retention': backup_retention,
          'pgdump': {'container': 'pokus-postgres', 'database': 'pokus', 'dir': backup_pgdump_dir,
                     'keep': backup_pgdump_keep | int}} | to_nice_json }}
    owner: root
    group: root
    mode: "0644"

- name: Report whether backups are configured
  ansible.builtin.copy:
    dest: "{{ backup_textfile_dir }}/pokus_backup_configured.prom"
    content: |
      # HELP pokus_backup_configured 1 if a backup repository is configured.
      # TYPE pokus_backup_configured gauge
      pokus_backup_configured {{ 1 if backup_configured else 0 }}
    owner: root
    group: root
    mode: "0644"

- name: Install the backup services and timers
  ansible.builtin.template:
    src: "backup-job.{{ item.1 }}.j2"
    dest: "/etc/systemd/system/{{ item.0.name }}.{{ item.1 }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ backup_jobs | product(['service', 'timer']) | list }}"
  loop_control:
    label: "{{ item.0.name }}.{{ item.1 }}"
  vars:
    backup_job: "{{ item.0 }}"
  register: backup_units

- name: Enable the timers of the configured jobs and disable the others
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.timer"
    enabled: "{{ item.enabled | bool }}"
    state: "{{ 'started' if item.enabled | bool else 'stopped' }}"
    daemon_reload: "{{ backup_units is changed }}"
  loop: "{{ backup_jobs }}"
  loop_control:
    label: "{{ item.name }}.timer"
  when: not ansible_check_mode
