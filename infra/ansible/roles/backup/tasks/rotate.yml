# Managed by pokus-infra (ansible/roles/backup/tasks/rotate.yml). Local changes will be overwritten.
#
# Entry point of rotate.yml: give the repository the password that is now in
# the vault. restic adds a key for the new password and removes the old key
# (restic key passwd); only then is the password file replaced.

- name: Require a configured repository
  ansible.builtin.assert:
    that: backup_configured
    fail_msg: No backup repository is configured (vault_restic_repository).
    quiet: true

- name: Read the repository password in use
  ansible.builtin.slurp:
    src: "{{ backup_secrets_dir }}/password"
  register: backup_password_file
  no_log: true

- name: Change the repository password
  when: (backup_password_file.content | b64decode) != backup_password
  block:
    - name: Stage the new password
      ansible.builtin.copy:
        content: "{{ backup_password }}"
        dest: "{{ backup_secrets_dir }}/password.new"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Replace the repository key
      ansible.builtin.command:
        argv: ["{{ backup_helper }}", passwd, --new-password-file, "{{ backup_secrets_dir }}/password.new"]
      changed_when: true

    - name: Replace the password file
      ansible.builtin.command:
        argv: [mv, --force, "{{ backup_secrets_dir }}/password.new", "{{ backup_secrets_dir }}/password"]
      changed_when: true

  rescue:
    - name: Remove the staged password
      ansible.builtin.file:
        path: "{{ backup_secrets_dir }}/password.new"
        state: absent

    - name: Report the failed change
      ansible.builtin.fail:
        msg: >-
          Changing the repository password failed in "{{ ansible_failed_task.name }}"; the
          repository and the password file still use the old password.
