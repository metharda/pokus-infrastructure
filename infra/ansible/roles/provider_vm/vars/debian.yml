# Managed by pokus-infra (ansible/roles/provider_vm/vars/debian.yml). Local changes will be overwritten.
#
# Guest agents by hypervisor. Package names verified in the Ubuntu 22.04 and
# 24.04 archives; Debian's Hyper-V package differs (hyperv-daemons).
provider_vm_guest_agents:
  kvm: {packages: [qemu-guest-agent], service: qemu-guest-agent}
  qemu: {packages: [qemu-guest-agent], service: qemu-guest-agent}
  vmware: {packages: [open-vm-tools], service: open-vm-tools}
  microsoft:
    packages: "{{ ['linux-cloud-tools-virtual'] if pokus_source_group == 'ubuntu' else ['hyperv-daemons'] }}"
    service: hv-kvp-daemon  # TODO(verify): service name on Debian (hyperv-daemons)
