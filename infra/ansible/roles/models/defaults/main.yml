# Managed by pokus-infra (ansible/roles/models/defaults/main.yml). Local changes will be overwritten.

# Root of the model weights and adapters (contracts.md#paths).
models_root: "{{ pokus_root }}/models"
# Isolated environment of the pinned huggingface_hub CLI.
models_venv: /opt/pokus/models-venv
# Pinned uv installed by bootstrap.
models_uv: /opt/pokus/bin/uv
# Hugging Face token for gated entries (vault; empty for public models).
models_hf_token: "{{ vault_hf_token | default('') }}"
