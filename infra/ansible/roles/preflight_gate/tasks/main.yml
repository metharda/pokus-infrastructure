# Managed by pokus-infra (ansible/roles/preflight_gate/tasks/main.yml). Local changes will be overwritten.
#
# BUILD_PROMPT §2.6, §7.1: re-run preflight (read-only) and stop if the
# outcome, provider or feature flags differ from the host profile bootstrap
# validated for this run, unless --refresh-profile was given. A changed host
# is an operator decision, so the play stops with bootstrap signal 77.
- name: Create a temporary file for the fresh host profile
  ansible.builtin.tempfile:
    suffix: .host-profile.json
  register: preflight_gate_tmp
  check_mode: false
  changed_when: false

- name: Re-run preflight
  block:
    - name: Run preflight without storing anything
      ansible.builtin.command:
        argv: >-
          {{ [preflight_gate_command, '--no-write', '--quiet', '--output', preflight_gate_tmp.path,
              '--srv-path', pokus_root]
             + (['--adopt-incus'] if pokus_bootstrap.adopt_incus | default(false) else [])
             + (['--offline'] if pokus_bootstrap.offline | default(false) else []) }}
      register: preflight_gate_run
      failed_when: preflight_gate_run.rc not in [0, 10, 20, 30]
      check_mode: false
      changed_when: false

    - name: Compare outcome, provider and features with the validated profile
      ansible.builtin.command:
        argv:
          - "{{ pokus_python }}"
          - -m
          - pokus_preflight.profile_tool
          - diff
          - "{{ preflight_gate_profile_path }}"
          - "{{ preflight_gate_tmp.path }}"
      environment:
        PYTHONPATH: "{{ pokus_infra_dir }}/preflight"
      register: preflight_gate_diff
      failed_when: preflight_gate_diff.rc not in [0, 1]
      check_mode: false
      changed_when: false

    - name: Read the fresh host profile
      ansible.builtin.slurp:
        src: "{{ preflight_gate_tmp.path }}"
      register: preflight_gate_fresh
  always:
    - name: Remove the temporary profile
      ansible.builtin.file:
        path: "{{ preflight_gate_tmp.path }}"
        state: absent
      check_mode: false
      changed_when: false

- name: Stop because the host changed
  ansible.builtin.include_role:
    name: bootstrap_signal
  vars:
    bootstrap_signal_code: 77
    bootstrap_signal_message: >-
      The host changed since bootstrap validated it ({{ preflight_gate_diff.stdout_lines | join('; ') }}).
      Check the changes, then re-run bootstrap with --refresh-profile to accept them.
  when:
    - preflight_gate_diff.rc == 1
    - not (pokus_bootstrap.refresh_profile | default(false))

- name: Expose the host profile and the feature flags
  ansible.builtin.set_fact:  # noqa: var-naming[no-role-prefix] - lab-wide facts read by every role
    pokus_host_profile: "{{ preflight_gate_fresh.content | b64decode | from_json }}"
    pokus_features: "{{ (preflight_gate_fresh.content | b64decode | from_json).features }}"

- name: Check the preflight outcome against the recorded consent
  ansible.builtin.assert:
    that:
      - pokus_host_profile.outcome != 'needs_action'
      - pokus_host_profile.outcome != 'unsupported' or host_profile.overrides.force_unsupported
      - pokus_host_profile.outcome != 'degraded' or host_profile.overrides.accept_degraded
      - pokus_host_profile.tier != 'experimental' or host_profile.overrides.accept_experimental
    fail_msg: >-
      Preflight outcome {{ pokus_host_profile.outcome }} (tier {{ pokus_host_profile.tier }}) is not
      covered by the recorded consent. Run bootstrap/bootstrap.sh, which asks for it.
    quiet: true
