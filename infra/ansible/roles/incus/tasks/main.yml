# Managed by pokus-infra (ansible/roles/incus/tasks/main.yml). Local changes will be overwritten.
#
# Incus for benchmark targets and personal sandboxes (BUILD_PROMPT §7.7):
# the LTS line from the component source matrix, one storage pool, the build
# bridge, the run network ACL, the projects build, bench and one per
# researcher, the target profiles, restricted client certificates for the
# platform services, the HTTPS API on 127.0.0.1, and a journal feed of Incus
# events. A new installation is initialized once from incus/preseed.yaml.j2;
# every run then converges the same objects with pokus_incus_object, which
# never deletes anything.
- name: Load the Incus names of this family
  ansible.builtin.include_vars:
    file: "{{ pokus_family }}.yml"

- name: Install Incus
  ansible.builtin.include_tasks: install.yml

- name: Work out the desired configuration
  ansible.builtin.include_tasks: desired.yml

- name: Initialize a new installation
  ansible.builtin.include_tasks: initialize.yml

- name: Converge the Incus objects
  ansible.builtin.include_tasks: objects.yml

- name: Issue the client certificates
  ansible.builtin.include_tasks: certificates.yml

- name: Give researchers their personal projects
  ansible.builtin.include_tasks: access.yml

- name: Feed Incus events to the journal
  ansible.builtin.include_tasks: events.yml

- name: Mark Incus as managed by Pokus
  ansible.builtin.copy:
    dest: /etc/pokus/managed-incus
    content: "Managed by pokus-infra (incus role). Remove only together with the Incus configuration.\n"
    owner: root
    group: root
    mode: "0644"
