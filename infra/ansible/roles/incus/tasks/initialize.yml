# Managed by pinka (ansible/roles/incus/tasks/initialize.yml). Local changes will be overwritten.
#
# A new installation is initialized once from the preseed. An Incus that
# someone else configured is only touched with --adopt-incus (preflight
# reports it as a blocking conflict otherwise).
- name: Read the storage pools
  ansible.builtin.command:
    argv: ["{{ incus_cli }}", query, "/1.0/storage-pools?recursion=1"]
  register: incus_pools_raw
  changed_when: false
  check_mode: false

- name: Read whether pinka manages this Incus
  ansible.builtin.stat:
    path: /etc/pinka/managed-incus
  register: incus_marker

- name: Note the existing storage pools
  ansible.builtin.set_fact:
    incus_existing_pools: "{{ incus_pools_raw.stdout | from_json | map(attribute='name') | list }}"

- name: Stop when another configuration owns Incus
  ansible.builtin.include_role:
    name: bootstrap_signal
  vars:
    bootstrap_signal_code: 77
    bootstrap_signal_message: >-
      Incus already has a configuration that pinka did not create (storage pools:
      {{ incus_existing_pools | join(', ') }}). Re-run bootstrap with --adopt-incus to add the
      pinka objects next to it, or remove that configuration first.
  when:
    - not incus_marker.stat.exists
    - incus_existing_pools | length > 0
    - not (pinka_bootstrap.adopt_incus | default(false))

- name: Check the pool device before it is formatted
  ansible.builtin.include_tasks: pool_device.yml
  when:
    - incus_pool_name not in incus_existing_pools
    - incus_pool_source == 'device'

- name: Create the Incus configuration directory
  ansible.builtin.file:
    path: "{{ incus_cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the preseed
  ansible.builtin.template:
    src: "{{ pinka_dir }}/incus/preseed.yaml.j2"
    dest: "{{ incus_cert_dir }}/preseed.yaml"
    owner: root
    group: root
    mode: "0600"

- name: Initialize Incus from the preseed (new installation only)
  ansible.builtin.command:
    argv: ["{{ incus_cli }}", admin, init, --preseed]
    stdin: "{{ lookup('ansible.builtin.file', incus_cert_dir ~ '/preseed.yaml') }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - incus_pool_name not in incus_existing_pools
