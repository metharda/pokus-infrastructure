# Managed by pokus-infra (ansible/roles/incus/tasks/events.yml). Local changes will be overwritten.
#
# Lifecycle and logging events of every project as JSON lines in the journal
# (identifier pokus-incus-events), read by the collector's journald receiver;
# the platform's integrity check uses them (BUILD_PROMPT §7.7).
- name: Install pokus-incus-events.service
  ansible.builtin.template:
    src: pokus-incus-events.service.j2
    dest: /etc/systemd/system/pokus-incus-events.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart pokus-incus-events

- name: Enable pokus-incus-events.service
  ansible.builtin.systemd_service:
    name: pokus-incus-events.service
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode or 'pokus-incus-events.service' in pokus_present.units
