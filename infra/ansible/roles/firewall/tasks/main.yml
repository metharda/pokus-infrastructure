# Managed by pokus-infra (ansible/roles/firewall/tasks/main.yml). Local changes will be overwritten.
#
# One effective policy with three backends (BUILD_PROMPT §7.5, §19.6): SSH (and
# the Grafana serve port, if enabled) only on tailscale0 plus
# ssh_extra_allowed_interfaces; DHCP/DNS from Incus bridges to the host;
# nothing forwarded out of run networks. Pokus only ever changes its own
# table, zone or rules and never flushes those of Docker, Incus, firewalld or ufw.
- name: Apply the policy with the backend {{ pokus_firewall_backend }}
  ansible.builtin.include_tasks: "{{ pokus_firewall_backend }}.yml"

- name: Install the Docker-Incus compatibility script
  ansible.builtin.template:
    src: docker-incus-compat.sh.j2
    dest: /usr/local/libexec/pokus/docker-incus-compat
    owner: root
    group: root
    mode: "0755"
  notify: Restart the Docker-Incus compatibility unit

- name: Install the Docker-Incus compatibility unit
  ansible.builtin.template:
    src: pokus-docker-incus-compat.service.j2
    dest: /etc/systemd/system/pokus-docker-incus-compat.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart the Docker-Incus compatibility unit

- name: Enable the Docker-Incus compatibility unit
  ansible.builtin.systemd_service:
    name: pokus-docker-incus-compat.service
    enabled: true
    daemon_reload: true
