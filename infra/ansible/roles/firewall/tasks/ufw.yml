# Managed by pokus-infra (ansible/roles/firewall/tasks/ufw.yml). Local changes will be overwritten.
#
# ufw rules only; ufw's default policies and other rules are left alone.
# Incus bridges follow Incus 6.0.6 doc/howto/network_bridge_firewalld.md: run
# networks may only reach DHCP and DNS on the host (the restrictive example
# there, without the outbound route rules); bridges with an uplink get the
# documented allow and route rules. ufw accepts "+" in interface names (ufw
# 0.36.2) and passes it to iptables as the interface wildcard, which matches
# run networks created at run time.
- name: Allow SSH and the serve port on tailscale0
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ firewall_tailnet_interface }}"
    port: "{{ item | string }}"
    proto: tcp
    comment: pokus-infra
  loop: "{{ firewall_tailnet_tcp_ports }}"

- name: Allow SSH on the extra interfaces
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ item }}"
    port: "22"
    proto: tcp
    comment: pokus-infra
  loop: "{{ ssh_extra_allowed_interfaces }}"

- name: Allow DHCP and DNS from the run networks to Incus's dnsmasq
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ firewall_run_bridge_pattern | replace('*', '+') }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: pokus-infra
  loop:
    - {port: "67", proto: udp}
    - {port: "547", proto: udp}
    - {port: "53", proto: udp}
    - {port: "53", proto: tcp}

- name: Allow OTLP from the run networks to the VM listener
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ firewall_run_bridge_pattern | replace('*', '+') }}"
    to_ip: "{{ pokus_vm_otlp.address }}"
    to_port: "{{ item | string }}"
    proto: tcp
    comment: pokus-infra
    delete: "{{ firewall_vm_otlp_ports | length == 0 }}"
  loop: "{{ [pokus_ports.otlp_grpc, pokus_ports.otlp_http] }}"

- name: Allow traffic from the bridges with an uplink to the host
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ item | replace('*', '+') }}"
    comment: pokus-infra
  loop: "{{ firewall_uplink_bridge_patterns }}"

- name: Allow forwarding for the bridges with an uplink
  community.general.ufw:
    rule: allow
    route: true
    direction: "{{ item.1 }}"
    interface: "{{ item.0 | replace('*', '+') }}"
    comment: pokus-infra
  loop: "{{ firewall_uplink_bridge_patterns | product(['in', 'out']) | list }}"
