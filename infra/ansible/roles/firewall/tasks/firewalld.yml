# Managed by pokus-infra (ansible/roles/firewall/tasks/firewalld.yml). Local changes will be overwritten.
#
# A dedicated zone pokus-tailnet for tailscale0 with the ssh service; Docker's
# own zone stays intact. Incus bridges (Incus 6.0.6
# doc/howto/network_bridge_firewalld.md): bridges with an uplink go into the
# trusted zone as Incus documents; run networks get their own zone pokus-run
# that only accepts DHCP and DNS. Run networks are created at run time, so they
# are matched with the interface wildcard "r-+" (firewalld 0.7.0 and later).
- name: Create the Pokus zones
  ansible.posix.firewalld:
    zone: "{{ item }}"
    state: present
    permanent: true
  loop: [pokus-tailnet, pokus-run]
  notify: Reload firewalld

- name: Reload firewalld so the new zone exists
  ansible.builtin.meta: flush_handlers

- name: Put tailscale0 in the pokus-tailnet zone
  ansible.posix.firewalld:
    zone: pokus-tailnet
    interface: "{{ firewall_tailnet_interface }}"
    state: enabled
    permanent: true
    immediate: true

- name: Allow SSH and the serve port in the pokus-tailnet zone
  ansible.posix.firewalld:
    zone: pokus-tailnet
    port: "{{ item }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_tailnet_tcp_ports }}"

- name: Find the zones of the extra SSH interfaces
  ansible.builtin.command:
    argv: [firewall-cmd, "--get-zone-of-interface={{ item }}"]
  loop: "{{ ssh_extra_allowed_interfaces }}"
  register: firewall_extra_zones
  changed_when: false
  check_mode: false

- name: Allow SSH on the extra interfaces
  ansible.posix.firewalld:
    zone: "{{ item.stdout | trim }}"
    service: ssh
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_extra_zones.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Put the run networks in the pokus-run zone
  ansible.posix.firewalld:
    zone: pokus-run
    interface: "{{ firewall_run_bridge_pattern | replace('*', '+') }}"
    state: enabled
    permanent: true
    immediate: true

- name: Allow DHCP and DNS from the run networks to Incus's dnsmasq
  ansible.posix.firewalld:
    zone: pokus-run
    service: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop: [dhcp, dhcpv6, dns]

- name: Trust the bridges with an uplink (image builds, personal projects)
  ansible.posix.firewalld:
    zone: trusted
    interface: "{{ item | replace('*', '+') }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_uplink_bridge_patterns }}"
