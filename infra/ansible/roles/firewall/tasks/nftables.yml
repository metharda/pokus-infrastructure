# Managed by pinka (ansible/roles/firewall/tasks/nftables.yml). Local changes will be overwritten.
#
# Own table inet pinka_filter, loaded by pinka-nftables.service from
# /etc/pinka/nftables/pinka.nft; the distribution's nftables configuration is
# not touched.
- name: Create the nftables directory
  ansible.builtin.file:
    path: /etc/pinka/nftables
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the pinka nftables table
  ansible.builtin.template:
    src: pinka.nft.j2
    dest: /etc/pinka/nftables/pinka.nft
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload the pinka nftables table

- name: Install pinka-nftables.service
  ansible.builtin.template:
    src: pinka-nftables.service.j2
    dest: /etc/systemd/system/pinka-nftables.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload the pinka nftables table

- name: Enable pinka-nftables.service
  ansible.builtin.systemd_service:
    name: pinka-nftables.service
    enabled: true
    state: started
    daemon_reload: true
  # In check mode the unit above is not written (pinka_present: platform_facts).
  when: not ansible_check_mode or 'pinka-nftables.service' in pinka_present.units
