# Managed by pokus-infra (ansible/roles/firewall/tasks/nftables.yml). Local changes will be overwritten.
#
# Own table inet pokus_filter, loaded by pokus-nftables.service from
# /etc/pokus/nftables/pokus.nft; the distribution's nftables configuration is
# not touched.
- name: Create the nftables directory
  ansible.builtin.file:
    path: /etc/pokus/nftables
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the Pokus nftables table
  ansible.builtin.template:
    src: pokus.nft.j2
    dest: /etc/pokus/nftables/pokus.nft
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload the Pokus nftables table

- name: Install pokus-nftables.service
  ansible.builtin.template:
    src: pokus-nftables.service.j2
    dest: /etc/systemd/system/pokus-nftables.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload the Pokus nftables table

- name: Enable pokus-nftables.service
  ansible.builtin.systemd_service:
    name: pokus-nftables.service
    enabled: true
    state: started
    daemon_reload: true
  # In check mode the unit above is not written (pokus_present: platform_facts).
  when: not ansible_check_mode or 'pokus-nftables.service' in pokus_present.units
