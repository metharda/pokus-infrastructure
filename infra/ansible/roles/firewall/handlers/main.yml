# Managed by pokus-infra (ansible/roles/firewall/handlers/main.yml). Local changes will be overwritten.
- name: Reload the Pokus nftables table
  ansible.builtin.systemd_service:
    name: pokus-nftables.service
    state: reloaded
    daemon_reload: true
  # In check mode the unit is not written (pokus_present: platform_facts).
  when: not ansible_check_mode or 'pokus-nftables.service' in pokus_present.units

- name: Reload firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: reloaded

- name: Restart the Docker-Incus compatibility unit
  ansible.builtin.systemd_service:
    name: pokus-docker-incus-compat.service
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode or 'pokus-docker-incus-compat.service' in pokus_present.units
