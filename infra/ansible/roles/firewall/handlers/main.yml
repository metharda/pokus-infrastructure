# Managed by pokus-infra (ansible/roles/firewall/handlers/main.yml). Local changes will be overwritten.
- name: Reload the Pokus nftables table
  ansible.builtin.systemd_service:
    name: pokus-nftables.service
    state: reloaded
    daemon_reload: true

- name: Reload firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: reloaded

- name: Restart the Docker-Incus compatibility unit
  ansible.builtin.systemd_service:
    name: pokus-docker-incus-compat.service
    state: restarted
    daemon_reload: true
