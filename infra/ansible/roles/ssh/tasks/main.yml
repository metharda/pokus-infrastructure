# Managed by pokus-infra (ansible/roles/ssh/tasks/main.yml). Local changes will be overwritten.
#
# sshd hardening (BUILD_PROMPT §7.3) through a drop-in that sorts before the
# distributions' own drop-ins (first value wins in sshd). Exposure is limited
# by the firewall role: tailscale0 plus ssh_extra_allowed_interfaces only.
- name: Install the OpenSSH server
  ansible.builtin.include_role:
    name: pkg
  vars:
    pkg_packages: ["{{ ssh_server_package[pokus_family] }}"]

- name: Make the drop-in directory the first directive of sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    regexp: '^\s*Include\s+/etc/ssh/sshd_config\.d/\*\.conf\s*$'
    insertbefore: BOF
    firstmatch: true
    owner: root
    group: root
    mode: "0644"
  notify: sshd configuration changed

- name: Install the Pokus sshd drop-in
  ansible.builtin.template:
    src: 10-pokus.conf.j2
    dest: /etc/ssh/sshd_config.d/10-pokus.conf
    owner: root
    group: root
    mode: "0644"
  notify: sshd configuration changed

- name: Enable sshd
  ansible.builtin.systemd_service:
    name: "{{ pokus_service_names.ssh }}"
    enabled: true
    state: started
