# Managed by pokus-infra (ansible/roles/ssh/defaults/main.yml). Local changes will be overwritten.

# Groups allowed to log in over SSH.
ssh_allow_groups: [pokus]
ssh_client_alive_interval: 60
# OpenSSH server package per family.
ssh_server_package:
  debian: openssh-server
  redhat: openssh-server
  suse: openssh-server
  archlinux: openssh
