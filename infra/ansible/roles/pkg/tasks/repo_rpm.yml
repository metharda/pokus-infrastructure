# Managed by pokus-infra (ansible/roles/pkg/tasks/repo_rpm.yml). Local changes will be overwritten.
- name: Install the verified key of {{ pkg_repo_name }}
  ansible.builtin.copy:
    src: "{{ pkg_key_tmp.path }}/key"
    remote_src: true
    dest: "/etc/pki/rpm-gpg/pokus-{{ pkg_repo_name }}.asc"
    owner: root
    group: root
    mode: "0644"

- name: Import into rpm the key of {{ pkg_repo_name }}
  ansible.builtin.rpm_key:
    key: "/etc/pki/rpm-gpg/pokus-{{ pkg_repo_name }}.asc"
    fingerprint: "{{ pkg_repo_lock_key.fingerprint }}"
    state: present

- name: Add dnf repository {{ pkg_repo_name }}
  ansible.builtin.yum_repository:
    name: "pokus-{{ pkg_repo_name }}"
    description: "{{ pkg_repo_name }} (managed by pokus-infra)"
    baseurl: "{{ pkg_repo.baseurl | pokus_repo_url(pokus_release_identity, pkg_repo_values) }}"
    gpgcheck: true
    repo_gpgcheck: "{{ pkg_repo.repo_gpgcheck | default(false) }}"
    gpgkey: "file:///etc/pki/rpm-gpg/pokus-{{ pkg_repo_name }}.asc"
    enabled: true
  when: pokus_pkg_manager == 'dnf'

- name: Add zypper repository {{ pkg_repo_name }}
  community.general.zypper_repository:
    name: "pokus-{{ pkg_repo_name }}"
    repo: "{{ pkg_repo.baseurl | pokus_repo_url(pokus_release_identity, pkg_repo_values) }}"
    auto_import_keys: false
    disable_gpg_check: false
    state: present
  when: pokus_pkg_manager == 'zypper'
