# Managed by pokus-infra (ansible/roles/pkg/tasks/hold_zypper_lock.yml). Local changes will be overwritten.
- name: Read the current zypper locks
  ansible.builtin.command:
    argv: [zypper, --non-interactive, locks]
  register: pkg_zypper_locks
  check_mode: false
  changed_when: false

- name: Lock the packages of {{ pkg_hold_name }}
  ansible.builtin.command:
    argv: [zypper, --non-interactive, addlock, "{{ item }}"]
  loop: "{{ pkg_hold_packages }}"
  when: (' ' ~ item ~ ' ') not in pkg_zypper_locks.stdout
  changed_when: true
