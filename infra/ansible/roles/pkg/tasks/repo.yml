# Managed by pokus-infra (ansible/roles/pkg/tasks/repo.yml). Local changes will be overwritten.
#
# Add a vendor repository from ansible/component-sources.yml. Its key is
# downloaded, its primary key fingerprint is compared with versions.lock.yml,
# and only then is it installed the family's way (BUILD_PROMPT §7.2, §19.4):
# signed-by keyrings for apt, rpm --import plus gpgcheck=1 for dnf and zypper.
# Never apt-key, never --gpg-auto-import-keys, never gpgcheck=0.
- name: Look up repository {{ pkg_repo_name }}
  ansible.builtin.set_fact:
    pkg_repo: "{{ pokus_repositories[pkg_repo_name] }}"
    pkg_repo_lock_key: "{{ pokus_versions.repository_keys['keys'][pokus_repositories[pkg_repo_name].key] }}"
    pkg_repo_values:
      deb_arch: "{{ pkg_deb_arches[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"

- name: Refuse a repository that is not verified
  ansible.builtin.assert:
    that:
      - pkg_repo.verify is not defined
      - pkg_repo_lock_key.fingerprint is match('^([0-9A-F]{40}|[0-9A-F]{64})$')
      - pkg_repo_lock_key.urls[0] is match('^https://')
    fail_msg: >-
      Repository {{ pkg_repo_name }} is not verified: ansible/component-sources.yml
      ({{ pkg_repo.verify | default('verified') }}) or its key {{ pkg_repo.key }} in
      versions.lock.yml; verify it first (docs/how-to/update-versions.md).
    quiet: true

- name: Create a temporary directory for the key of {{ pkg_repo_name }}
  ansible.builtin.tempfile:
    state: directory
    suffix: .pokus-key
  register: pkg_key_tmp
  check_mode: false
  changed_when: false

- name: Download and verify the key of {{ pkg_repo_name }}
  block:
    - name: Download the key of {{ pkg_repo_name }}
      ansible.builtin.get_url:
        url: "{{ pkg_repo_lock_key.urls[0] }}"
        dest: "{{ pkg_key_tmp.path }}/key"
        mode: "0644"
      check_mode: false
      changed_when: false

    - name: Read the fingerprint of the downloaded key
      ansible.builtin.command:
        argv: [gpg, --batch, --show-keys, --with-colons, --with-fingerprint, "{{ pkg_key_tmp.path }}/key"]
      environment:
        GNUPGHOME: "{{ pkg_key_tmp.path }}"
      register: pkg_key_colons
      check_mode: false
      changed_when: false

    - name: Compare the fingerprint with versions.lock.yml
      ansible.builtin.assert:
        that:
          - (pkg_key_colons.stdout | pokus_fingerprints) == [pkg_repo_lock_key.fingerprint]
        fail_msg: >-
          The key at {{ pkg_repo_lock_key.urls[0] }} has the fingerprint(s)
          {{ pkg_key_colons.stdout | pokus_fingerprints | join(', ') }}, but versions.lock.yml pins
          {{ pkg_repo_lock_key.fingerprint }}. Nothing was installed.
        quiet: true

    - name: Add the repository the family's way
      ansible.builtin.include_tasks: "repo_{{ pkg_repo.type }}.yml"
  always:
    - name: Remove the temporary key directory
      ansible.builtin.file:
        path: "{{ pkg_key_tmp.path }}"
        state: absent
      check_mode: false
      changed_when: false
