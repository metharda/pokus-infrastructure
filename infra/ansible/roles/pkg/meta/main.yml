# Managed by pokus-infra (ansible/roles/pkg/meta/main.yml). Local changes will be overwritten.
galaxy_info:
  role_name: pkg
  namespace: pokus
  author: Pokus project
  description: Package manager abstraction - pinned installs, verified vendor repositories and version holds per family
  license: Apache-2.0
  min_ansible_version: "2.21"
  platforms:
    - name: Ubuntu
      versions: [jammy, noble]
    - name: Debian
      versions: [trixie]
    - name: Fedora
      versions: ["43", "44"]
    - name: EL
      versions: ["9", "10"]
    - name: opensuse
      versions: [all]
    - name: ArchLinux
      versions: [all]
  galaxy_tags: [pokus]
dependencies: []
