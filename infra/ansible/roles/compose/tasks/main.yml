# Managed by pokus-infra (ansible/roles/compose/tasks/main.yml). Local changes will be overwritten.
#
# One Compose project of the lab services (BUILD_PROMPT §7.6): the project
# file from compose/<project>/compose.yml, an .env file with the pinned image
# digests, ports and paths, and pokus-<project>.service (oneshot,
# RemainAfterExit) that runs `docker compose up -d --wait` and `down`. The
# roles render their configuration under <project>/config/<name>/ first; the
# .env file carries one hash per directory (<NAME>_CONFIG_HASH), which the
# services use as a label, so a changed file recreates exactly its service.
- name: Check the project name
  ansible.builtin.assert:
    that:
      - compose_project in ['core', 'observability', 'inference']
    fail_msg: "compose_project must be core, observability or inference."
    quiet: true

- name: Create the project directory of {{ compose_project }}
  ansible.builtin.file:
    path: "{{ compose_root }}/{{ compose_project }}"
    state: directory
    owner: root
    group: pokus-admin
    mode: "0750"

- name: Install the Compose file of {{ compose_project }}
  ansible.builtin.copy:
    src: "{{ pokus_infra_dir }}/compose/{{ compose_project }}/compose.yml"
    dest: "{{ compose_root }}/{{ compose_project }}/compose.yml"
    owner: root
    group: pokus-admin
    mode: "0640"
  register: compose_file

- name: Read the Docker daemon configuration
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: compose_daemon_json
  failed_when: false

- name: Read the groups (pokus and pokus-svc open the socket directories)
  ansible.builtin.getent:
    database: group

# The docker role decided how containers get the GPU: CDI devices
# (features.cdi) or the NVIDIA runtime; GPU services exist in one Compose
# profile per method.
- name: Derive the Docker settings the project needs
  ansible.builtin.set_fact:
    compose_docker: "{{ compose_daemon_json.content | default('e30=') | b64decode | from_json }}"
    compose_pokus_gid: "{{ (ansible_facts.getent_group['pokus'] | default(none) or ['', ''])[1] }}"
    compose_pokus_svc_gid: "{{ (ansible_facts.getent_group['pokus-svc'] | default(none) or ['', ''])[1] }}"

- name: Derive the GPU method
  ansible.builtin.set_fact:
    compose_gpu_method: >-
      {{ 'cdi' if (compose_docker.features | default({})).cdi | default(false)
         else ('runtime' if 'nvidia' in (compose_docker.runtimes | default({})) else 'none') }}

- name: Check that the GPU method is known
  ansible.builtin.assert:
    that:
      - not compose_gpu or compose_gpu_method != 'none'
    fail_msg: >-
      {{ compose_project }} needs the GPU, but /etc/docker/daemon.json enables
      neither CDI nor the NVIDIA runtime (docker and nvidia_container_toolkit roles).
    quiet: true
  when: not ansible_check_mode

- name: Find the configuration files of {{ compose_project }}
  ansible.builtin.find:
    paths: "{{ compose_root }}/{{ compose_project }}/config"
    recurse: true
    file_type: file
    get_checksum: true
    checksum_algorithm: sha256
  register: compose_config_files

- name: Write the environment of {{ compose_project }}
  ansible.builtin.template:
    src: env.j2
    dest: "{{ compose_root }}/{{ compose_project }}/.env"
    owner: root
    group: pokus-admin
    mode: "0640"
  vars:
    compose_config_hashes: >-
      {{ compose_config_files.files | pokus_config_hashes(compose_root ~ '/' ~ compose_project ~ '/config') }}

- name: Check the project with docker compose config
  ansible.builtin.command:
    argv: [docker, compose, --project-directory, "{{ compose_root }}/{{ compose_project }}", config, --quiet]
  changed_when: false
  when: not ansible_check_mode

- name: Install the systemd unit of {{ compose_project }}
  ansible.builtin.template:
    src: pokus-compose.service.j2
    dest: "/etc/systemd/system/pokus-{{ compose_project }}.service"
    owner: root
    group: root
    mode: "0644"

- name: Enable the systemd unit of {{ compose_project }}
  ansible.builtin.systemd_service:
    name: "pokus-{{ compose_project }}.service"
    enabled: "{{ compose_start }}"
    daemon_reload: true

# `up` creates missing containers and recreates those whose definition changed,
# including the config-hash label of a changed configuration directory.
# Compose 5.6 prints one plain progress line per event: "<resource> <name>
# <status>"; Created, Recreated and Started are changes.
- name: Start the services of {{ compose_project }}
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'compose', '--progress', 'plain', '--project-directory', compose_root ~ '/' ~ compose_project,
          'up', '--detach', '--wait', '--wait-timeout', compose_wait_timeout | string, '--remove-orphans']
         + compose_services }}
  register: compose_up
  changed_when: compose_up.stderr is search('(Created|Recreated|Started)\s*$', multiline=True)
  when:
    - not ansible_check_mode
    - compose_start

- name: Mark the systemd unit as active for {{ compose_project }}
  ansible.builtin.systemd_service:
    name: "pokus-{{ compose_project }}.service"
    state: started
  when:
    - not ansible_check_mode
    - compose_start
