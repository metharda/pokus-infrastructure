# Managed by pokus-infra (ansible/roles/postgres/tasks/secrets.yml). Local changes will be overwritten.
#
# Secrets of the database (BUILD_PROMPT §8.2, contracts.md#paths). The
# superuser and the exporter passwords are generated on the host once; the
# platform, reader and Grafana passwords come from the vault.
- name: Create the directory of the container secrets
  ansible.builtin.file:
    path: "{{ postgres_container_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate the superuser and exporter passwords once
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=40, chars=['ascii_letters', 'digits']) }}"
    dest: "{{ postgres_container_secrets_dir }}/{{ item.name }}"
    owner: "{{ item.owner }}"
    group: root
    mode: "0400"
    force: false
  loop: &postgres_generated
    - {name: postgres-superuser, owner: "{{ postgres_container_uid }}"}
    - {name: pokus-monitor, owner: "{{ postgres_exporter_uid }}"}
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Keep the owners of the generated passwords
  ansible.builtin.file:
    path: "{{ postgres_container_secrets_dir }}/{{ item.name }}"
    state: file
    owner: "{{ item.owner }}"
    group: root
    mode: "0400"
  loop: *postgres_generated
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Create the directory of the platform's database passwords
  ansible.builtin.file:
    path: "{{ postgres_password_dir }}"
    state: directory
    owner: root
    group: pokus-svc
    mode: "0750"

- name: Write the platform's database passwords
  ansible.builtin.copy:
    content: "{{ vault_postgres_passwords[item.role] }}"
    dest: "{{ postgres_password_dir }}/{{ item.role }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ postgres_service_roles }}"
  loop_control:
    label: "{{ item.role }}"
  no_log: true

- name: Create the directory of the reader credential
  ansible.builtin.file:
    path: "{{ postgres_reader_credential | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# libpq ignores a password file that its group may read, so researchers copy
# this file to ~/.pgpass (0600) or let a client read the password from it.
- name: Write the reader credential
  ansible.builtin.template:
    src: pgpass.j2
    dest: "{{ postgres_reader_credential }}"
    owner: root
    group: pokus
    mode: "0640"
  no_log: true
