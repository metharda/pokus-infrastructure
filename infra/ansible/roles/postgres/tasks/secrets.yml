# Managed by pinka (ansible/roles/postgres/tasks/secrets.yml). Local changes will be overwritten.
#
# Secrets of the database (BUILD_PROMPT §8.2): the superuser and the exporter
# passwords, generated on the host once. The active platform's passwords come
# from the vault (tasks/platform.yml).
- name: Create the directory of the container secrets
  ansible.builtin.file:
    path: "{{ postgres_container_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate the superuser and exporter passwords once
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=40, chars=['ascii_letters', 'digits']) }}"
    dest: "{{ postgres_container_secrets_dir }}/{{ item.name }}"
    owner: "{{ item.owner }}"
    group: root
    mode: "0400"
    force: false
  loop: &postgres_generated
    - {name: postgres-superuser, owner: "{{ postgres_container_uid }}"}
    - {name: pinka-monitor, owner: "{{ postgres_exporter_uid }}"}
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Keep the owners of the generated passwords
  ansible.builtin.file:
    path: "{{ postgres_container_secrets_dir }}/{{ item.name }}"
    state: file
    owner: "{{ item.owner }}"
    group: root
    mode: "0400"
  loop: *postgres_generated
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode
