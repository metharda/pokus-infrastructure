# Managed by pokus-infra (ansible/roles/postgres/tasks/main.yml). Local changes will be overwritten.
#
# PostgreSQL in the core Compose project (BUILD_PROMPT §7.8,
# contracts.md#postgresql): Unix socket directories for the service roles and
# the researchers' reader role, TCP only on internal Docker networks (Grafana,
# exporter), data checksums, fixed durability settings, and the idempotent
# bootstrap of roles, schemas and revokes. Table grants are the platform's
# migrations.
- name: Check the database passwords in the vault
  ansible.builtin.assert:
    that:
      - vault_postgres_passwords is defined
      - vault_postgres_passwords is mapping
      - postgres_vault_roles | difference(vault_postgres_passwords.keys() | list) | length == 0
      - vault_postgres_passwords.values() | map('string') | reject('match', '^[ -~]+$') | list | length == 0
    fail_msg: >-
      group_vars/all/vault.yml must define vault_postgres_passwords for
      {{ postgres_vault_roles | join(', ') }} (see vault.yml.example), each
      non-empty printable ASCII (PostgreSQL normalizes other characters).
    quiet: true

- name: Create the data directory
  ansible.builtin.file:
    path: "{{ postgres_state_dir }}"
    state: directory
    owner: "{{ postgres_container_uid }}"
    group: "{{ postgres_container_gid }}"
    mode: "0700"

- name: Recreate the socket directories at boot
  ansible.builtin.template:
    src: pokus-postgres.tmpfiles.conf.j2
    dest: /etc/tmpfiles.d/pokus-postgres.conf
    owner: root
    group: root
    mode: "0644"

- name: Create the runtime directory
  ansible.builtin.file:
    path: /run/pokus
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the socket directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ postgres_container_uid }}"
    group: "{{ item.group }}"
    mode: "0750"
  loop: "{{ postgres_socket_dirs }}"
  loop_control:
    label: "{{ item.path }}"

- name: Write the secrets
  ansible.builtin.include_tasks: secrets.yml

- name: Create the configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ postgres_config_dir | dirname | dirname }}", group: pokus-admin, mode: "0750"}
    - {path: "{{ postgres_config_dir | dirname }}", group: root, mode: "0755"}
    - {path: "{{ postgres_config_dir }}", group: root, mode: "0755"}
  loop_control:
    label: "{{ item.path }}"

- name: Render the PostgreSQL configuration
  ansible.builtin.template:
    src: "{{ pokus_infra_dir }}/config/postgres/{{ item }}.j2"
    dest: "{{ postgres_config_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [postgresql.conf, pg_hba.conf, bootstrap.sql]

- name: Start PostgreSQL and its exporter
  ansible.builtin.include_role:
    name: compose
  vars:
    compose_project: core
    compose_description: PostgreSQL and OPA
    compose_services: [postgres, postgres_exporter]

- name: Bootstrap the database
  ansible.builtin.include_tasks: bootstrap.yml
  when: not ansible_check_mode
