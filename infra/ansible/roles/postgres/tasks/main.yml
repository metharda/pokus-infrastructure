# Managed by pinka (ansible/roles/postgres/tasks/main.yml). Local changes will be overwritten.
#
# PostgreSQL in the core Compose project (BUILD_PROMPT §7.8, §12.5): Unix
# socket directories only (the container has no network), data checksums,
# fixed durability settings and infra's own role for the exporter. The active
# platform's database, roles, schemas, password files and the restricted
# check come from its rendering (tasks/platform.yml, run by the platform
# role); this file renders pg_hba.conf and the socket directories for the
# same platform, so both agree.
- name: Read the active platform
  ansible.builtin.include_role:
    name: active_platform

- name: Create the data directory
  ansible.builtin.file:
    path: "{{ postgres_state_dir }}"
    state: directory
    owner: "{{ postgres_container_uid }}"
    group: "{{ postgres_container_gid }}"
    mode: "0700"

- name: Create the socket directories
  ansible.builtin.include_tasks: sockets.yml

- name: Write the secrets
  ansible.builtin.include_tasks: secrets.yml

- name: Render the configuration and start the containers
  ansible.builtin.include_tasks: config.yml

- name: Bootstrap the database
  ansible.builtin.include_tasks: bootstrap.yml
  when: not ansible_check_mode
