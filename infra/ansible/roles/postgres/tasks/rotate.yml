# Managed by pokus-infra (ansible/roles/postgres/tasks/rotate.yml). Local changes will be overwritten.
#
# Entry point of rotate.yml: new superuser and exporter passwords (the two the
# host generates; vault passwords change in the vault and converge on the next
# bootstrap). The superuser's new password is staged next to the current one
# and set while the current one still authenticates, so an interruption never
# leaves the lab without a working superuser password.

- name: Start PostgreSQL
  ansible.builtin.systemd_service:
    name: pokus-core.service
    state: started

- name: Wait until PostgreSQL accepts the superuser
  ansible.builtin.command:
    argv: "{{ postgres_psql + ['--tuples-only', '--no-align', '--command', 'SELECT 1'] }}"
  register: postgres_ready
  retries: 20
  delay: 3
  until: postgres_ready.rc == 0
  changed_when: false

- name: Generate the new passwords
  ansible.builtin.set_fact:
    postgres_new_passwords:
      postgres-superuser: "{{ lookup('ansible.builtin.password', '/dev/null', length=40, chars=['ascii_letters', 'digits']) }}"
      pokus-monitor: "{{ lookup('ansible.builtin.password', '/dev/null', length=40, chars=['ascii_letters', 'digits']) }}"
  no_log: true

- name: Change the superuser password
  block:
    - name: Stage the new superuser password
      ansible.builtin.copy:
        content: "{{ postgres_new_passwords['postgres-superuser'] }}"
        dest: "{{ postgres_container_secrets_dir }}/postgres-superuser.new"
        owner: "{{ postgres_container_uid }}"
        group: root
        mode: "0400"
      no_log: true

    - name: Set the new superuser password with the current one
      ansible.builtin.command:
        argv: "{{ postgres_psql + ['--quiet'] }}"
        stdin: >-
          ALTER ROLE postgres PASSWORD '{{ postgres_new_passwords['postgres-superuser'] | pokus_scram_verifier }}';
      changed_when: true
      no_log: true

    - name: Replace the superuser password file
      ansible.builtin.command:
        argv:
          - mv
          - --force
          - "{{ postgres_container_secrets_dir }}/postgres-superuser.new"
          - "{{ postgres_container_secrets_dir }}/postgres-superuser"
      changed_when: true

  rescue:
    - name: Explain how to recover
      ansible.builtin.fail:
        msg: >-
          Changing the superuser password failed in "{{ ansible_failed_task.name }}". If the
          ALTER ROLE ran, the new password is in {{ postgres_container_secrets_dir }}/postgres-superuser.new:
          move it over postgres-superuser and restart pokus-core.service; otherwise delete the
          .new file. Nothing else was changed.

- name: Write the new exporter password
  ansible.builtin.copy:
    content: "{{ postgres_new_passwords['pokus-monitor'] }}"
    dest: "{{ postgres_container_secrets_dir }}/pokus-monitor"
    owner: "{{ postgres_exporter_uid }}"
    group: root
    mode: "0400"
  no_log: true

# The containers bind-mount the secret files, so they see a replaced file only
# when they are created again (the unit runs compose down and up).
- name: Recreate the containers with the new secret files
  ansible.builtin.systemd_service:
    name: pokus-core.service
    state: restarted

- name: Set the exporter's new password
  ansible.builtin.include_tasks: bootstrap.yml
