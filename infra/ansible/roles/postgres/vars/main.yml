# Managed by pokus-infra (ansible/roles/postgres/vars/main.yml). Local changes will be overwritten.

# Contract paths (contracts.md#paths, #sockets); compose/core/compose.yml
# mounts the same paths.
# Socket directory of the service roles (group pokus-svc may connect).
postgres_service_socket_dir: /run/pokus/postgres
# Socket directory of the researchers' reader role (group pokus may connect).
postgres_reader_socket_dir: /run/pokus/postgres-reader
# Password files of the platform roles.
postgres_password_dir: /etc/pokus/secrets/postgres
# Researchers' reader credential in pgpass format (owner answer E13).
postgres_reader_credential: /etc/pokus/postgres-reader/pgpass
# Secrets mounted into containers: directory 0700 root, each file 0400 owned
# by the UID of the container that reads it.
postgres_container_secrets_dir: /etc/pokus/secrets/containers
# Socket directories with the group that may connect.
postgres_socket_dirs:
  - {path: "{{ postgres_service_socket_dir }}", group: pokus-svc}
  - {path: "{{ postgres_reader_socket_dir }}", group: pokus}

# Roles allowed on the Unix sockets (pg_hba.conf local lines).
postgres_socket_roles: "{{ postgres_service_roles | map(attribute='role') | list + [postgres_reader_role] }}"
# Every login role the bootstrap SQL creates.
postgres_all_roles: "{{ postgres_socket_roles + [postgres_grafana_role, postgres_monitor_role] }}"
# Roles whose passwords come from the vault (vault_postgres_passwords).
postgres_vault_roles: "{{ postgres_socket_roles + [postgres_grafana_role] }}"
# Stored SCRAM secrets of the login roles, as one JSON object.
postgres_secrets_query: >-
  SELECT coalesce(json_object_agg(rolname, rolpassword), '{}') FROM pg_authid
  WHERE rolname = ANY (string_to_array('{{ postgres_all_roles | join(',') }}', ','))
# Durability settings that must all be on (BUILD_PROMPT §7.8).
postgres_durability_query: >-
  SELECT json_object_agg(name, setting) FROM pg_settings
  WHERE name IN ('fsync', 'synchronous_commit', 'full_page_writes', 'data_checksums')
# psql as the superuser inside the container. The password is read from the
# mounted secret inside the container, so it never appears in a command line.
postgres_psql:
  - docker
  - exec
  - --interactive
  - --user
  - postgres
  - "{{ postgres_container }}"
  - sh
  - -c
  - >-
    PGPASSWORD="$(cat /run/secrets/postgres-superuser)"
    exec psql --no-psqlrc --set=ON_ERROR_STOP=1 --host=/var/run/postgresql
    --username=postgres --dbname=pokus "$@"
  - psql
