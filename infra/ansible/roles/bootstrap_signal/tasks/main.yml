# Managed by pokus-infra (ansible/roles/bootstrap_signal/tasks/main.yml). Local changes will be overwritten.
#
# Stop the play with a condition that bootstrap.sh maps to its exit code
# (BUILD_PROMPT §5.2 step 9): 75 WSL restart, 76 reboot or MOK enrollment,
# 77 operator action. The signal file is written even in check mode, because
# bootstrap reads it to report the condition.
- name: Write the bootstrap signal file
  ansible.builtin.copy:
    dest: "{{ bootstrap_signal_file }}"
    content: "{{ {'code': bootstrap_signal_code | int, 'message': bootstrap_signal_message} | to_json }}\n"
    owner: root
    group: root
    mode: "0644"
  check_mode: false

- name: Stop the play with the bootstrap signal
  ansible.builtin.fail:
    msg: "POKUS-BOOTSTRAP-SIGNAL {{ bootstrap_signal_code }}: {{ bootstrap_signal_message }}"
