# Managed by pinka (ansible/roles/deploy_source/defaults/main.yml). Local changes will be overwritten.

# Set by the including role for tasks_from: deploy.
# Component to deploy: platform or catalog (its subdirectory of the repository).
deploy_source_component: ""
# Ref to deploy: a component tag (platform-v0.1.0), another tag, a branch or a full commit.
deploy_source_ref: ""
# Deployment root: /srv/pinka/deploy/platform or /srv/pinka/catalog.
deploy_source_root: ""
# Owner, group and modes of the deployed tree (executables keep their x bits).
deploy_source_owner: root
deploy_source_group: root
deploy_source_dir_mode: "0755"
deploy_source_file_mode: "0644"
# Set by the including role for tasks_from: activate: the prepared deployment's name.
deploy_source_name: ""
