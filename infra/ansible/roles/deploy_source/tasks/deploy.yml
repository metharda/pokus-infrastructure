# Managed by pokus-infra (ansible/roles/deploy_source/tasks/deploy.yml). Local changes will be overwritten.
#
# Extract one component at a ref into <root>/<name>/ with DEPLOYED_FROM.json
# (contracts.md). Sets deploy_source_result: changed, name, path, provenance.
# Activating it (the current symlink) is a separate step: tasks_from: activate.

- name: Prepare the deployment of {{ deploy_source_component }}
  ansible.builtin.command:
    argv: >-
      {{ [deploy_source_helper, 'prepare', '--mirror', deploy_source_mirror,
          '--component', deploy_source_component, '--ref', deploy_source_ref,
          '--root', deploy_source_root, '--repo', pokus_source_repo,
          '--owner', deploy_source_owner, '--group', deploy_source_group,
          '--dir-mode', deploy_source_dir_mode, '--file-mode', deploy_source_file_mode,
          '--allowed-signers', deploy_source_allowed_signers]
         + (['--require-signed'] if require_signed_tags else []) }}
  register: deploy_source_prepare
  changed_when: (deploy_source_prepare.stdout | from_json).changed
  failed_when: deploy_source_prepare.rc != 0
  when: not ansible_check_mode

- name: Remember the prepared {{ deploy_source_component }}
  ansible.builtin.set_fact:
    deploy_source_result: "{{ deploy_source_prepare.stdout | from_json }}"
  when: not ansible_check_mode
