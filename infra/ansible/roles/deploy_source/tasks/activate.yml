# Managed by pokus-infra (ansible/roles/deploy_source/tasks/activate.yml). Local changes will be overwritten.
#
# Point <root>/current at a prepared deployment, atomically.

- name: Activate {{ deploy_source_name }}
  ansible.builtin.command:
    argv:
      - "{{ deploy_source_helper }}"
      - activate
      - --root
      - "{{ deploy_source_root }}"
      - --name
      - "{{ deploy_source_name }}"
  register: deploy_source_activate
  changed_when: (deploy_source_activate.stdout | from_json).changed
  when: not ansible_check_mode
