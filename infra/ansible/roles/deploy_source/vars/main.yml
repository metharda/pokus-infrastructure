# Managed by pinka (ansible/roles/deploy_source/vars/main.yml). Local changes will be overwritten.

# Root-only mirror and its credentials (contracts.md, "Deployment of platform and catalog").
deploy_source_dir: /var/lib/pinka/git
deploy_source_mirror: /var/lib/pinka/git/potka.git
deploy_source_key: /var/lib/pinka/git/deploy_key
deploy_source_known_hosts: /var/lib/pinka/git/known_hosts
deploy_source_allowed_signers: /var/lib/pinka/git/allowed_signers
deploy_source_helper: /usr/local/libexec/pinka/deploy-source
# How the repository is reached: ssh (git@host:path or ssh://), https, or invalid.
deploy_source_transport: >-
  {{ 'https' if pinka_source_repo is match('^https://[^@/]+/')
     else 'ssh' if pinka_source_repo is match('^(ssh://[^/]+/|[A-Za-z0-9._-]+@[A-Za-z0-9.-]+:[^/])')
     else 'invalid' }}
# Host of an SSH source ("[host]:port" with a port, as in known_hosts).
deploy_source_ssh_host: >-
  {{ (pinka_source_repo | regex_replace('^ssh://([^@/]+@)?([^:/]+)(:([0-9]+))?/.*$', '[\2]:\4')
      | regex_replace('^\[([^]]+)\]:$', '\1'))
     if pinka_source_repo is match('^ssh://')
     else pinka_source_repo | regex_replace('^[^@]+@([^:]+):.*$', '\1') }}
# GitHub's published host keys (owner answer E3) whose values are verified.
deploy_source_github_keys: >-
  {{ pinka_versions.github_ssh_host_keys['keys'] | dict2items
     | rejectattr('value.public_key', 'search', 'TODO')
     | map(attribute='key') | zip(pinka_versions.github_ssh_host_keys['keys'] | dict2items
       | rejectattr('value.public_key', 'search', 'TODO') | map(attribute='value.public_key'))
     | map('join', ' ') | map('regex_replace', '^', 'github.com ') | list }}
deploy_source_known_host_lines: >-
  {{ (deploy_source_github_keys if deploy_source_ssh_host == 'github.com' else [])
     + pinka_source_known_hosts }}
