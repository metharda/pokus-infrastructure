# Managed by pinka (ansible/roles/deploy_source/meta/argument_specs.yml). Local changes will be overwritten.
argument_specs:
  main:
    short_description: Install the deployment helper and fetch the pokus-platform repository into the root-only bare mirror.
    options:
      pinka_source_repo:
        type: str
        required: true
        description: SSH or anonymous HTTPS URL of the deployer's copy of the pokus-platform repository (owner answer E3).
      pinka_source_known_hosts:
        type: list
        elements: str
        default: []
        description: Extra known_hosts lines for an SSH source.
      require_signed_tags:
        type: bool
        default: false
        description: Deploy only validly SSH-signed component tags (owner answer E16).
      pinka_allowed_signers:
        type: list
        elements: str
        default: []
        description: ssh-keygen allowed_signers lines for signed tags.
      machine_name:
        type: str
        required: true
        description: Machine name, the comment of the deploy key.
      pinka_versions:
        type: dict
        required: true
        description: The pinned versions (GitHub's SSH host keys).
  deploy:
    short_description: Extract one component at a ref into its deployment directory with DEPLOYED_FROM.json.
    options:
      deploy_source_component:
        type: str
        required: true
        choices: [platform, catalog]
        description: Component to deploy (its subdirectory of the repository).
      deploy_source_ref:
        type: str
        required: true
        description: A component tag, another tag, a branch or a full commit.
      deploy_source_root:
        type: path
        required: true
        description: Deployment root (/srv/pinka/deploy/platform or /srv/pinka/catalog).
      deploy_source_owner:
        type: str
        default: root
        description: Owner of the deployed tree.
      deploy_source_group:
        type: str
        default: root
        description: Group of the deployed tree.
      deploy_source_dir_mode:
        type: str
        default: "0755"
        description: Mode of directories and executable files.
      deploy_source_file_mode:
        type: str
        default: "0644"
        description: Mode of other files.
      pinka_source_repo:
        type: str
        required: true
        description: Source URL, recorded in DEPLOYED_FROM.json.
      require_signed_tags:
        type: bool
        default: false
        description: Refuse anything but a validly signed component tag.
  activate:
    short_description: Point the deployment root's current link at a prepared deployment, atomically.
    options:
      deploy_source_root:
        type: path
        required: true
        description: Deployment root.
      deploy_source_name:
        type: str
        required: true
        description: Name of the prepared deployment directory.
      deploy_source_component:
        type: str
        default: ""
        description: Component, for the task names.
      deploy_source_ref:
        type: str
        default: ""
        description: Requested ref, for the task names.
