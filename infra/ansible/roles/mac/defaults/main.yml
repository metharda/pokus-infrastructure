# Managed by pokus-infra (ansible/roles/mac/defaults/main.yml). Local changes will be overwritten.

# Persistent SELinux file context rules (semanage fcontext). State and models
# are mounted into containers; the rest keeps the default context.
mac_selinux_fcontexts:
  - {target: "{{ pokus_root }}/state(/.*)?", setype: container_file_t}
  - {target: "{{ pokus_root }}/models(/.*)?", setype: container_ro_file_t}
  - {target: "{{ pokus_root }}/services(/.*)?", setype: container_ro_file_t}
# Run restorecon on every play, not only when a rule changed.
mac_restorecon_always: false
