# Managed by pokus-infra (ansible/roles/base/vars/archlinux.yml). Local changes will be overwritten.
#
# TODO(verify): package names (Arch mirrors are not reachable from the build
# environment).
base_package_names:
  ca_certificates: ca-certificates
  curl: curl
  gpg: gnupg
  jq: jq
  git: git
  acl: acl
  btrfs_tools: btrfs-progs
  lvm2: lvm2
  thin_provisioning_tools: thin-provisioning-tools
  nftables: nftables
  rsync: rsync
  tmux: tmux
  htop: htop
  iotop: iotop
  sysstat: sysstat
  sudo: sudo
  xz: xz
  zstd: zstd
  bzip2: bzip2
  tar: tar
  python_debian: ""  # Debian family only
base_package_overrides: {}
base_timesync_default_package: systemd
base_timesync_default_service: systemd-timesyncd
