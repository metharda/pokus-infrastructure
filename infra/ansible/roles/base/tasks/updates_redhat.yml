# Managed by pokus-infra (ansible/roles/base/tasks/updates_redhat.yml). Local changes will be overwritten.
#
# TODO(verify): dnf-automatic on Fedora's dnf5 (package and configuration path).
- name: Install dnf-automatic
  ansible.builtin.include_role:
    name: pkg
  vars:
    pkg_packages: [dnf-automatic]

- name: Configure dnf-automatic (security only, no reboot, held packages excluded)
  ansible.builtin.template:
    src: dnf-automatic.conf.j2
    dest: /etc/dnf/automatic.conf
    owner: root
    group: root
    mode: "0644"

- name: Enable or disable the dnf-automatic timer
  ansible.builtin.systemd_service:
    name: dnf-automatic.timer
    enabled: "{{ base_auto_updates_effective }}"
    state: "{{ 'started' if base_auto_updates_effective else 'stopped' }}"
  # In check mode the package above is not installed (pokus_present: platform_facts).
  when: not ansible_check_mode or 'dnf-automatic.timer' in pokus_present.units
