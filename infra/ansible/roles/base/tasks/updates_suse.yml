# Managed by pokus-infra (ansible/roles/base/tasks/updates_suse.yml). Local changes will be overwritten.
#
# TODO(verify): `zypper patch --category security` as the security-only update
# on Leap and SLES; locked packages (pkg role) are left alone by zypper.
- name: Install the security patch service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [pokus-security-patch.service, pokus-security-patch.timer]
  notify: Reload systemd

- name: Enable or disable the security patch timer
  ansible.builtin.systemd_service:
    name: pokus-security-patch.timer
    enabled: "{{ base_auto_updates_effective }}"
    state: "{{ 'started' if base_auto_updates_effective else 'stopped' }}"
    daemon_reload: true
