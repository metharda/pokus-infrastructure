# Managed by pinka (ansible/roles/base/tasks/updates_debian.yml). Local changes will be overwritten.
- name: Install unattended-upgrades
  ansible.builtin.include_role:
    name: pkg
  vars:
    pkg_packages: [unattended-upgrades]

- name: Configure unattended-upgrades (security only, no reboot, held packages excluded)
  ansible.builtin.template:
    src: 52pinka-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52pinka-unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Enable or disable the periodic run
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by pinka (ansible/roles/base). Local changes will be overwritten.
      APT::Periodic::Update-Package-Lists "{{ 1 if base_auto_updates_effective else 0 }}";
      APT::Periodic::Unattended-Upgrade "{{ 1 if base_auto_updates_effective else 0 }}";
    owner: root
    group: root
    mode: "0644"
