# Managed by pokus-infra (ansible/roles/lab_session/vars/main.yml). Local changes will be overwritten.

# Helpers (contracts.md: health gate, session records).
lab_session_libexec: /usr/local/libexec/pokus
lab_session_gate_config: /etc/pokus/health-gate.json
lab_session_gate_status: /run/pokus/health-gate.json
lab_session_sessions_dir: /var/lib/pokus/sessions
# The lab's PostgreSQL container and the collector gateway's health endpoint.
lab_session_postgres_container: pokus-postgres
lab_session_collector_health: "http://127.0.0.1:{{ pokus_internal_ports.collector_health }}/"
# Units of the lab session.
lab_session_units: [pokus-lab.target, pokus-health-gate.service, pokus-session-start.service]
# GPU check: when the lab serves inference, a container from the pinned CUDA
# image (pulled by the nvidia_container_toolkit role) must see the GPU.
lab_session_gpu: "{{ (pokus_features.gpu_inference | default(false)) and node_role in ['full', 'inference'] }}"
lab_session_gpu_image: >-
  {{ pokus_versions.containers.images.cuda_base_test.image }}@{{ pokus_versions.containers.images.cuda_base_test.digest }}
