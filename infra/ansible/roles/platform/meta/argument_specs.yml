# Managed by pokus-infra (ansible/roles/platform/meta/argument_specs.yml). Local changes will be overwritten.
argument_specs:
  main:
    short_description: Deploy the platform services at platform_ref with hardened units (only if enabled).
    options:
      platform_enabled:
        type: bool
        default: false
        description: Deploy the platform; when false, installed platform units are stopped and disabled.
      platform_ref:
        type: str
        default: ""
        description: A platform-v tag (recommended), another tag, a branch or a full commit.
      platform_settings:
        type: dict
        default: {}
        description: Non-secret settings per service short name, rendered into /etc/pokus/platform/<svc>.toml and checked against the platform's schemas (C9b).
      platform_inference_mode:
        type: str
        default: auto
        choices: [auto, local, remote, scripted]
        description: Inference backend of endpoints.toml; auto is local where this node serves inference, otherwise remote.
      platform_scripted_api_url:
        type: str
        default: ""
        description: OpenAI-compatible endpoint of the scripted backend (staging only, D3).
      inference_remote_node:
        type: str
        default: ""
        description: Tailnet name of the paired inference node (remote mode).
      qa_trusted_keys:
        type: list
        elements: dict
        default: []
        description: QA public keys trusted for attestations, {name, pem}.
      node_role:
        type: str
        required: true
        description: The platform runs on full and lab nodes only.
      lab_mode:
        type: str
        required: true
        description: production or staging; scripted inference needs staging.
      machine_name:
        type: str
        required: true
        description: Machine name (endpoints.toml, published signing keys).
      pokus_features:
        type: dict
        required: true
        description: Feature flags (gpu_inference decides local inference).
      pokus_versions:
        type: dict
        required: true
        description: The pinned versions (Quarto).
  rotate_signing:
    short_description: Replace the run-manifest signing key; old public keys stay published.
    options:
      platform_enabled:
        type: bool
        default: false
        description: Restart the orchestrator with the new key when the platform is enabled.
      machine_name:
        type: str
        required: true
        description: Machine name of the published key file.
