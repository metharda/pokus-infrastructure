# Managed by pinka (ansible/roles/platform/meta/argument_specs.yml). Local changes will be overwritten.
argument_specs:
  main:
    short_description: Deploy the platform release and its content packages (contract v2), if a platform source is set.
    options:
      platform:
        type: dict
        default: {}
        description: "The platform source: {repo, ref, path, tag_prefix}; empty: no platform."
      content:
        type: dict
        default: {}
        description: "Sources of the manifest's content packages: {<package>: {repo, ref, path, tag_prefix}}."
      pinka_source_known_hosts:
        type: list
        elements: str
        default: []
        description: known_hosts lines for SSH sources other than GitHub.
      require_signed_tags:
        type: bool
        default: false
        description: Deploy only release tags with a valid SSH signature of an allowed signer.
      pinka_allowed_signers:
        type: list
        elements: str
        default: []
        description: ssh-keygen allowed_signers lines for signed tags.
      platform_replace:
        type: str
        default: ""
        description: The active platform a release with another name may replace (--replace-platform).
      platform_inspect:
        type: bool
        default: false
        description: Fetch, stage and validate only, print the summary (--inspect-platform).
      platform_settings:
        type: dict
        default: {}
        description: Non-secret settings per service short name, rendered into /etc/pinka/platform/<svc>.toml and checked against the platform's schemas (C9b).
      platform_inference_mode:
        type: str
        default: auto
        choices: [auto, local, remote, scripted]
        description: Inference backend of endpoints.toml; auto is local where this node serves inference, otherwise remote.
      platform_scripted_api_url:
        type: str
        default: ""
        description: OpenAI-compatible endpoint of the scripted backend (staging only, D3).
      inference_remote_node:
        type: str
        default: ""
        description: Tailnet name of the paired inference node (remote mode).
      qa_trusted_keys:
        type: list
        elements: dict
        default: []
        description: QA public keys trusted for attestations, {name, pem}.
      node_role:
        type: str
        required: true
        description: The platform runs on full and lab nodes only.
      lab_mode:
        type: str
        required: true
        description: production or staging; scripted inference needs staging.
      machine_name:
        type: str
        required: true
        description: Machine name (endpoints.toml, published signing keys).
      pinka_features:
        type: dict
        required: true
        description: Feature flags (gpu_inference decides local inference).
      pinka_versions:
        type: dict
        required: true
        description: The pinned versions (Quarto).
  rotate_signing:
    short_description: Replace the run-manifest signing key; old public keys stay published.
    options:
      platform:
        type: dict
        default: {}
        description: The platform source; the orchestrator restarts with the new key when it is set.
      machine_name:
        type: str
        required: true
        description: Machine name of the published key file.
