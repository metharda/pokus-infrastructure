# Managed by pokus-infra (ansible/roles/platform/tasks/rotate_signing.yml). Local changes will be overwritten.
#
# rotate.yml --tags signing: replace the signing key. Manifests signed with the
# old key stay verifiable through its published public key, which is kept.

- name: Remove the current signing key
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ platform_signing_key }}"
    - "{{ platform_signing_pub }}"

- name: Generate and publish the new signing key
  ansible.builtin.include_tasks: signing.yml

- name: Restart the orchestrator with the new key
  ansible.builtin.systemd_service:
    name: pokus-orchestrator.service
    state: restarted
  when:
    - platform_enabled | bool
    - not ansible_check_mode
