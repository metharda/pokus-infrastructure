# Managed by pokus-infra (ansible/roles/platform/vars/main.yml). Local changes will be overwritten.

# Paths (contracts.md#paths).
platform_root: "{{ pokus_root }}/deploy/platform"
platform_current: "{{ pokus_root }}/deploy/platform/current"
platform_config_dir: /etc/pokus/platform
platform_secrets_dir: /etc/pokus/secrets
platform_state_dir: /var/lib/pokus/platform
platform_signing_dir: /etc/pokus/signing
platform_signing_key: /etc/pokus/signing/manifest-signing.key
platform_signing_pub: /etc/pokus/signing/manifest-signing.pub
platform_signing_published: "{{ pokus_root }}/shared/signing-keys"
platform_qa_dir: /etc/pokus/qa
platform_inference_dir: /etc/pokus/inference
platform_cli_link: /usr/local/bin/pokus
platform_libexec: /usr/local/libexec/pokus
platform_uv: /opt/pokus/bin/uv
platform_uv_cache: /var/cache/pokus/uv

# Quarto CLI for the evaluator's reports (pinned in versions.lock.yml).
platform_quarto_version: "{{ pokus_versions.binaries.quarto.version }}"
platform_quarto_asset: "{{ pokus_versions.binaries.quarto.assets[ansible_facts['architecture']] }}"
platform_quarto_dir: "/opt/pokus/quarto/{{ pokus_versions.binaries.quarto.version }}"
platform_quarto_link: /usr/local/bin/quarto

# The inference backend this node uses (C5, D3).
platform_inference: >-
  {{ platform_inference_mode if platform_inference_mode != 'auto'
     else ('local' if (pokus_features.gpu_inference | default(false)) and node_role == 'full'
           else 'remote') }}

# Paths every platform unit is denied (BUILD_PROMPT §7.14); the agent runner's
# own list (contracts.md, C2) comes on top.
platform_denied_paths:
  - /var/lib/pokus/git
  - /var/lib/incus
  - /run/docker.sock
  - /etc/pokus/secrets/containers
  - /etc/pokus/secrets/backup
platform_agent_denied_paths:
  - "{{ pokus_root }}/catalog"
  - "{{ pokus_root }}/artifacts"
  - "{{ pokus_root }}/services"
  - /etc/pokus/secrets
  - /etc/pokus/incus
  - /run/pokus/postgres
  - /run/pokus/postgres-reader
  - /run/pokus/inject
  - /run/pokus/verify
  - /run/pokus/vllm-deploy.sock
  - /run/pokus/orch/api.sock
  - /run/pokus/gw/svc.sock
  - /etc/pokus/signing
  - /etc/pokus/inference

# The platform units (contracts.md, "Accounts, groups and services").
# sockets: the Unix sockets the service creates in its RuntimeDirectory;
# infra sets their owner, group, mode and ACL (C8) once they exist.
platform_units:
  - unit: pokus-reconcile.service
    svc: orch
    script: pokus-reconcile
    account: pokus-orch
    groups: [pokus-svc, pokus-gt, pokus-exec-clients]
    description: Pokus reconcile (cleans up after a crash or power loss)
    type: oneshot
    before: [pokus-orchestrator.service]
    runtime_dir: false
    read_write: ["{{ pokus_root }}/artifacts"]
    sockets: []
  - unit: pokus-orchestrator.service
    svc: orch
    script: pokus-orchestrator
    account: pokus-orch
    groups: [pokus-svc, pokus-gt, pokus-exec-clients]
    description: Pokus orchestrator
    requires: [pokus-reconcile.service]
    read_write: ["{{ pokus_root }}/artifacts"]
    sockets:
      - {path: /run/pokus/orch/api.sock, owner: pokus-orch, group: pokus, mode: "0660",
         acl: ["group:pokus-svc:rw-"], fallback: {group: pokus, mode: "0660"}}
      - {path: /run/pokus/orch/svc.sock, owner: pokus-orch, group: pokus-svc, mode: "0660", acl: []}
  - unit: pokus-llm-gateway.service
    svc: gw
    script: pokus-llm-gateway
    account: pokus-gw
    groups: [pokus-svc]
    description: Pokus LLM gateway
    read_write: []
    sockets:
      - {path: /run/pokus/gw/agent.sock, owner: pokus-gw, group: pokus-gw-clients, mode: "0660", acl: []}
      - {path: /run/pokus/gw/svc.sock, owner: pokus-gw, group: pokus-gw, mode: "0600",
         acl: ["user:pokus-orch:rw-"], fallback: {group: pokus-svc, mode: "0660"}}
  - unit: pokus-executor.service
    svc: exec
    script: pokus-executor
    account: pokus-exec
    groups: [pokus-svc]
    description: Pokus tool executor
    read_write: []
    sockets:
      - {path: /run/pokus/exec/api.sock, owner: pokus-exec, group: pokus-exec-clients, mode: "0660", acl: []}
  - unit: pokus-injector.service
    svc: inject
    script: pokus-injector
    account: pokus-inject
    groups: [pokus-svc, pokus-gt]
    description: Pokus fault injector
    read_write: []
    sockets:
      - {path: /run/pokus/inject/api.sock, owner: pokus-inject, group: pokus-inject, mode: "0600",
         acl: ["user:pokus-orch:rw-"], fallback: {group: pokus-gt, mode: "0660"}}
  - unit: pokus-verifier.service
    svc: verify
    script: pokus-verifier
    account: pokus-verify
    groups: [pokus-svc, pokus-gt]
    description: Pokus verifier
    read_write: []
    sockets:
      - {path: /run/pokus/verify/api.sock, owner: pokus-verify, group: pokus-verify, mode: "0600",
         acl: ["user:pokus-orch:rw-"], fallback: {group: pokus-gt, mode: "0660"}}
  - unit: pokus-evaluator.service
    svc: eval
    script: pokus-evaluator
    account: pokus-eval
    groups: [pokus-svc, pokus-gt]
    description: Pokus evaluator (evaluation job worker)
    read_write: ["{{ pokus_root }}/reports"]
    # Quarto's Deno and Typst generate code at run time.
    memory_deny_write_execute: false
    sockets: []
  - unit: pokus-agent-runner.service
    svc: agent
    script: pokus-agent-runner
    account: pokus-agent
    groups: [pokus-svc, pokus-exec-clients, pokus-gw-clients]
    description: Pokus agent runner
    # Started after the services whose sockets it must not reach, so that their
    # paths exist when InaccessiblePaths is applied, and restarted with them.
    after: [pokus-orchestrator.service, pokus-llm-gateway.service, pokus-executor.service,
            pokus-injector.service, pokus-verifier.service]
    part_of: [pokus-orchestrator.service, pokus-llm-gateway.service]
    read_write: []
    agent: true
    sockets: []

# /etc/pokus/platform/endpoints.toml (contracts.md, "Configuration"); only the
# table of the active inference mode is present.
platform_inference_tables:
  local:
    api_url: "http://127.0.0.1:{{ pokus_ports.vllm }}"
    deploy_helper_socket: /run/pokus/vllm-deploy.sock
  remote:
    api_url: "https://{{ inference_remote_node }}:{{ pokus_ports.vllm }}"
    control_url: "https://{{ inference_remote_node }}:{{ pokus_ports.inference_control }}"
    tls_dir: "{{ platform_inference_dir }}"
  scripted:
    api_url: "{{ platform_scripted_api_url }}"
platform_endpoints:
  lab:
    machine_name: "{{ machine_name }}"
    lab_mode: "{{ lab_mode }}"
    node_role: "{{ node_role }}"
  telemetry:
    otlp_grpc: "127.0.0.1:{{ pokus_ports.otlp_grpc }}"
    otlp_http: "127.0.0.1:{{ pokus_ports.otlp_http }}"
  query:
    prometheus_url: "http://127.0.0.1:{{ pokus_ports.prometheus }}"
    loki_url: "http://127.0.0.1:{{ pokus_ports.loki }}"
    tempo_url: "http://127.0.0.1:{{ pokus_ports.tempo }}"
  opa:
    url: "http://127.0.0.1:{{ pokus_ports.opa }}"
    decision_path: /v1/data/pokus/action/decision
  # cpuset_targets: the CPUs the platform pins targets to (limits.cpu ranges inside it).
  incus: >-
    {{ {'url': 'https://' ~ incus_https_address}
       | combine({'cpuset_targets': cpuset_targets} if cpuset_targets else {}) }}
  inference: "{{ {'mode': platform_inference, platform_inference: platform_inference_tables[platform_inference]} }}"
  gateway:
    adhoc_listen: "127.0.0.1:{{ pokus_ports.gateway_adhoc }}"

# First lines of every rendered TOML file.
platform_toml_header: "Managed by pokus-infra (ansible/roles/platform). Local changes will be overwritten.\n/etc/pokus/platform/"
# Effective socket permissions, recorded in /etc/pokus/platform/sockets.json for doctor.
platform_socket_expectations: >-
  {{ platform_units | map(attribute='sockets') | flatten | pokus_socket_specs(platform_socket_acls) }}
