# Managed by pokus-infra (ansible/roles/layout/meta/argument_specs.yml). Local changes will be overwritten.
argument_specs:
  main:
    short_description: Create the research space and the lab's host paths.
    options:
      pokus_root:
        type: path
        required: true
        description: Research space base path.
      pokus_layout:
        type: list
        elements: dict
        required: true
        description: Entries {path (relative to pokus_root), owner, group, mode, default_acl, notes}.
      pokus_system_layout:
        type: list
        elements: dict
        required: true
        description: Absolute host paths {path, owner, group, mode, notes}.
      pokus_layout_user_mode:
        type: str
        required: true
        description: Mode of users/<name>/ (owned by <name>:<name>).
      researchers:
        type: list
        elements: dict
        required: true
        description: Researchers; each gets users/<name>/.
