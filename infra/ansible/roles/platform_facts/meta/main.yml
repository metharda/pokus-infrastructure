# Managed by pokus-infra (ansible/roles/platform_facts/meta/main.yml). Local changes will be overwritten.
galaxy_info:
  role_name: platform_facts
  namespace: pokus
  author: Pokus project
  description: Derive the platform facts (family, release, sources, firewall backend, MAC) from the host profile
  license: Apache-2.0
  min_ansible_version: "2.21"
  platforms:
    - name: Ubuntu
      versions: [jammy, noble]
    - name: Debian
      versions: [trixie]
    - name: Fedora
      versions: ["43", "44"]
    - name: EL
      versions: ["9", "10"]
    - name: opensuse
      versions: [all]
    - name: ArchLinux
      versions: [all]
  galaxy_tags: [pokus]
dependencies: []
