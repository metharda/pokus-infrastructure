# Managed by pokus-infra (ansible/roles/platform_facts/meta/argument_specs.yml). Local changes will be overwritten.
argument_specs:
  main:
    short_description: Derive the platform facts from the host profile.
    description:
      - Sets pokus_family, pokus_distro, pokus_release, pokus_parent_release, pokus_release_key,
        pokus_release_identity, pokus_source_group, pokus_release_model, pokus_pkg_manager,
        pokus_service_names, pokus_initramfs_tool, pokus_version_hold_method, pokus_provider,
        pokus_mac, pokus_firewall_backend, pokus_repositories, pokus_component_sources and
        pokus_community_repos_allowed.
      - The only role that interprets the distribution (BUILD_PROMPT §19.1).
    options:
      host_profile:
        type: dict
        required: true
        description: Host profile written by preflight, passed by bootstrap.sh.
      lab_provider:
        type: str
        required: true
        choices: [auto, baremetal, wsl2, vm]
        description: Provider; auto takes it from the host profile, an explicit value must match it.
      firewall_backend:
        type: str
        required: true
        choices: [auto, nftables, firewalld, ufw]
        description: Firewall backend; auto selects firewalld if active, else ufw if active, else nftables.
      allow_community_repos:
        type: bool
        required: true
        description: Consent to community repositories (COPR, OBS, RPM Fusion); also set by --allow-community-repos.
