# Managed by pokus-infra (ansible/roles/platform_facts/tasks/main.yml). Local changes will be overwritten.
#
# The only place that interprets the distribution (BUILD_PROMPT §19.1). Every
# fact comes from the host profile that preflight wrote, so Ansible and
# preflight never disagree about the host.
- name: Check that the host profile is available
  ansible.builtin.assert:
    that:
      - host_profile is mapping
      - host_profile.family in ['debian', 'redhat', 'suse', 'archlinux']
    fail_msg: "The host profile is missing or its family is unsupported; run the play through bootstrap/bootstrap.sh."
    quiet: true

- name: Load the family variables
  ansible.builtin.include_vars:
    file: "{{ host_profile.family }}.yml"

- name: Load the component source matrix
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/component-sources.yml"
    name: platform_facts_sources

- name: Derive the release identity
  ansible.builtin.set_fact:
    platform_facts_identity: "{{ host_profile | pokus_release_identity(platform_facts_family.codenames) }}"

- name: Resolve the provider
  ansible.builtin.assert:
    that:
      - lab_provider in ['auto', host_profile.provider]
    fail_msg: >-
      lab_provider is '{{ lab_provider }}' but preflight detected '{{ host_profile.provider }}'.
      Set lab_provider to auto or to the detected provider.
    quiet: true

- name: Set the platform facts
  ansible.builtin.set_fact:  # noqa: var-naming[no-role-prefix] - fact names defined by BUILD_PROMPT §19.1
    pokus_family: "{{ host_profile.family }}"
    pokus_distro: "{{ platform_facts_identity.distro }}"
    pokus_release: "{{ platform_facts_identity.release }}"
    pokus_parent_release: "{{ host_profile.os.parent_release }}"
    pokus_release_key: "{{ platform_facts_identity.release_key }}"
    pokus_release_identity: "{{ platform_facts_identity }}"
    pokus_source_group: "{{ platform_facts_identity.source_group }}"
    pokus_release_model: "{{ host_profile.release_model }}"
    pokus_pkg_manager: "{{ host_profile.pkg_manager }}"
    pokus_service_names: "{{ platform_facts_family.service_names }}"
    pokus_initramfs_tool: "{{ platform_facts_family.initramfs_tool }}"
    pokus_version_hold_method: "{{ platform_facts_family.version_hold_method }}"
    pokus_provider: "{{ host_profile.provider }}"
    pokus_mac: "{{ host_profile.mac.system }}"
    pokus_firewall_backend: "{{ firewall_backend if firewall_backend != 'auto' else host_profile.firewall.backend }}"
    pokus_repositories: "{{ platform_facts_sources.repositories }}"
    pokus_component_sources: "{{ platform_facts_sources.components }}"
    pokus_community_repos_allowed: "{{ allow_community_repos | bool or (pokus_bootstrap.allow_community_repos | default(false)) | bool }}"

- name: Check the firewall backend
  ansible.builtin.assert:
    that:
      - pokus_firewall_backend in ['nftables', 'firewalld', 'ufw']
    fail_msg: "firewall_backend must be auto, nftables, firewalld or ufw."
    quiet: true

# Check mode changes nothing, so what exists when the play starts is what
# exists throughout it: tasks that need a unit or an account created earlier
# in the same run are skipped in check mode while it is missing.
- name: List the systemd units that exist before the run (check mode)
  ansible.builtin.command:
    argv: [systemctl, list-unit-files, --no-legend, --no-pager, --plain]
  register: platform_facts_unit_files
  changed_when: false
  check_mode: false
  when: ansible_check_mode

- name: Read the accounts that exist before the run (check mode)
  ansible.builtin.getent:
    database: passwd
  when: ansible_check_mode

# A package from a vendor repository cannot be resolved in check mode before
# the repository is really added, so the roles of these components end after
# their repository step in check mode while the command is missing.
- name: Look for the component commands that exist before the run (check mode)
  ansible.builtin.shell:
    cmd: |
      for command in {{ platform_facts_component_commands | join(' ') }}; do
        if command -v "$command" >/dev/null 2>&1; then echo "$command"; fi
      done
    executable: /bin/sh
  register: platform_facts_commands
  changed_when: false
  check_mode: false
  when: ansible_check_mode

- name: Record what exists before the run (check mode)
  ansible.builtin.set_fact:  # noqa: var-naming[no-role-prefix] - shared fact like the pokus_* facts above
    pokus_present:
      units: "{{ (platform_facts_unit_files.stdout_lines | default([])) | select | map('split') | map('first') | list }}"
      users: "{{ (ansible_facts.getent_passwd | default({}) if ansible_check_mode else {}) | list }}"
      commands: "{{ platform_facts_commands.stdout_lines | default([]) }}"

- name: Show the platform facts
  ansible.builtin.debug:
    msg: >-
      family={{ pokus_family }} distro={{ pokus_distro }} release={{ pokus_release }}
      release_key={{ pokus_release_key or '(rolling, not pinned)' }} provider={{ pokus_provider }}
      firewall={{ pokus_firewall_backend }} mac={{ pokus_mac }}
