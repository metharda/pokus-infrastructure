# Managed by pokus-infra (ansible/roles/users_groups/tasks/keys.yml). Local changes will be overwritten.
#
# authorized_keys comes exclusively from users/<name>.pub (BUILD_PROMPT §6.1):
# a key removed from the file is removed from the host. Key files are never
# committed to the public project; a missing file is reported (doctor and the
# TUI flag it) and leaves the account without keys.
- name: Install the SSH keys of each researcher (exclusive)
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ lookup('ansible.builtin.file', pokus_infra_dir ~ '/' ~ item.keys_file) }}"
    exclusive: true
    manage_dir: true
    state: present
  loop: "{{ researchers }}"
  when:
    - (pokus_infra_dir ~ '/' ~ item.keys_file) is file
    # In check mode new accounts are not created (pokus_present: platform_facts).
    - not ansible_check_mode or item.name in pokus_present.users

- name: Report researchers without a key file
  ansible.builtin.debug:
    msg: "No SSH key file {{ item.keys_file }} for {{ item.name }}: the account has no SSH access."
  loop: "{{ researchers }}"
  when: (pokus_infra_dir ~ '/' ~ item.keys_file) is not file
