# Managed by pokus-infra (ansible/roles/users_groups/tasks/main.yml). Local changes will be overwritten.
#
# Groups and accounts (BUILD_PROMPT §6.1, contracts.md). Researchers are
# members of pokus (and of Incus's per-user group, added by the incus role);
# admins also of pokus-admin with sudo. Nobody is added to docker or
# incus-admin implicitly. Service accounts are system users without login.
- name: Create the Pokus groups
  ansible.builtin.group:
    name: "{{ item.name }}"
    system: "{{ item.system }}"
    state: present
  loop: "{{ pokus_groups }}"

# Each service account has a primary group of its own name: the contract's
# sockets and password files are owned by it (contracts.md#sockets, #paths),
# and useradd only creates one where USERGROUPS_ENAB is set.
- name: Create the groups of the service accounts
  ansible.builtin.group:
    name: "{{ item.name }}"
    system: true
    state: present
  loop: "{{ service_accounts }}"

- name: Create the service accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    group: "{{ item.name }}"
    system: true
    shell: "{{ users_groups_nologin_shell }}"
    home: "{{ pokus_service_home }}/{{ item.name }}"
    create_home: true
    password: "!"
    groups: "{{ item.groups }}"
    append: false
    state: present
  loop: "{{ service_accounts }}"

- name: Create the researchers
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    groups: "{{ ['pokus'] + (['pokus-admin'] if item.admin | default(false) else []) }}"
    append: true
    create_home: true
    state: present
  loop: "{{ researchers }}"

- name: Read the members of pokus-admin
  ansible.builtin.getent:
    database: group
    key: pokus-admin

- name: Remove non-admins and removed researchers from pokus-admin
  ansible.builtin.command:
    argv: [gpasswd, -d, "{{ item }}", pokus-admin]
  loop: "{{ (researchers | rejectattr('admin', 'true') | map(attribute='name') | list) + researchers_removed }}"
  when: item in (ansible_facts.getent_group['pokus-admin'][2] | default('')).split(',')
  changed_when: true

- name: Install the sudo rule for admins
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-pokus-admin
    content: |
      # Managed by pokus-infra (ansible/roles/users_groups). Local changes will be overwritten.
      %pokus-admin ALL=(ALL:ALL) ALL
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Manage the SSH keys of the researchers
  ansible.builtin.include_tasks: keys.yml

- name: Keep researchers out of privileged groups
  ansible.builtin.include_tasks: privileged_groups.yml

- name: Lock removed researchers (data is kept)
  ansible.builtin.user:
    name: "{{ item }}"
    password_lock: true
    shell: "{{ users_groups_nologin_shell }}"
    expires: 1
  loop: "{{ researchers_removed }}"

- name: Warn about break-glass Docker access
  ansible.builtin.debug:
    msg: >-
      BREAK-GLASS: {{ break_glass_docker | join(', ') }} will be added to the docker group (root-equivalent)
      by the docker role. This is recorded in the fingerprint.
  when: break_glass_docker | length > 0
