# Managed by pokus-infra (ansible/roles/provider_baremetal/tasks/reboot_redhat.yml). Local changes will be overwritten.
#
# TODO(verify): `dnf needs-restarting -r` exit codes on dnf5 (Fedora); dnf 4
# returns 1 when a reboot is needed.
- name: Ask dnf whether a reboot is needed
  ansible.builtin.command:
    argv: [dnf, needs-restarting, -r]
  register: provider_baremetal_needs_restarting
  failed_when: provider_baremetal_needs_restarting.rc not in [0, 1]
  changed_when: false
  check_mode: false

- name: Record the reboot state
  ansible.builtin.set_fact:
    provider_baremetal_reboot_required: "{{ provider_baremetal_needs_restarting.rc == 1 }}"
    provider_baremetal_reboot_reason: dnf needs-restarting -r
