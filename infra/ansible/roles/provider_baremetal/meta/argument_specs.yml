# Managed by pokus-infra (ansible/roles/provider_baremetal/meta/argument_specs.yml). Local changes will be overwritten.
argument_specs:
  main:
    short_description: Bare-metal provider.
    options:
      host_profile:
        type: dict
        required: true
        description: Host profile (gpu, capabilities.secure_boot).
      install_nvidia_driver:
        type: str
        required: true
        choices: [auto, manual, skip]
        description: auto installs the driver per family, manual expects it installed, skip ignores the GPU.
      power_policy:
        type: str
        required: true
        choices: [never_sleep, lab_session_inhibit, os_default]
        description: Sleep behavior of the host.
      provider_baremetal_sleep_targets:
        type: list
        elements: str
        default: [sleep.target, suspend.target, hibernate.target, hybrid-sleep.target]
        description: Targets masked by never_sleep.
      provider_baremetal_initramfs_commands:
        type: dict
        default: {}
        description: Command that rebuilds the initramfs, per pokus_initramfs_tool.
