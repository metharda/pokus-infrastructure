# Managed by pokus-infra (ansible/roles/provider_baremetal/defaults/main.yml). Local changes will be overwritten.

# Targets masked by power_policy: never_sleep.
provider_baremetal_sleep_targets:
  - sleep.target
  - suspend.target
  - hibernate.target
  - hybrid-sleep.target
# Command that rebuilds the initramfs, per tool from platform_facts.
provider_baremetal_initramfs_commands:
  update-initramfs: [update-initramfs, -u, -k, all]
  dracut: [dracut, --force, --regenerate-all]
  mkinitcpio: [mkinitcpio, -P]
