# Managed by pokus-infra (ansible/roles/images/tasks/restore_one.yml). Local changes will be overwritten.
#
# One export (images_record_path, its build.json) during a restore.

- name: Read the export record
  ansible.builtin.slurp:
    src: "{{ images_record_path }}"
  register: images_record_raw

- name: Describe the export
  ansible.builtin.set_fact:
    images_record: "{{ images_record_raw.content | b64decode | from_json }}"
    images_export_dir: "{{ images_record_path | dirname }}"

- name: Name the export's alias
  ansible.builtin.set_fact:
    images_alias: "{{ images_record.alias }}"

- name: List the images of the image store
  ansible.builtin.command:
    argv: [incus, image, list, --format, json]
  register: images_list
  changed_when: false
  check_mode: false

- name: Find the image the alias points to
  ansible.builtin.set_fact:
    images_image: "{{ images_list.stdout | from_json | pokus_image_by_alias(images_alias) }}"

- name: Refuse an alias that points to a different image
  ansible.builtin.assert:
    that: images_image == {} or images_image.fingerprint == images_record.fingerprint
    fail_msg: >-
      {{ images_alias }} points to {{ images_image.fingerprint | default('') }}, but its export in
      {{ images_export_dir }} recorded {{ images_record.fingerprint }}. Delete the alias
      (incus image alias delete {{ images_alias }}) to restore the exported image, or move the
      export away to keep the current one.
    quiet: true

- name: Import the exported image
  ansible.builtin.include_tasks: import.yml
  when:
    - images_image == {}
    - not ansible_check_mode
