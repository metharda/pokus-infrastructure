# Managed by pokus-infra (ansible/inventory/hosts.yml). Local changes will be overwritten.
#
# Pokus provisions the host it runs on. The machine's settings come from
# host_vars/<machine>.yml, selected by bootstrap's --machine (site.yml loads it).
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: /opt/pokus/ansible-venv/bin/python
