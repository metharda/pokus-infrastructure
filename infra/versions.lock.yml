# Managed by pokus-infra (versions.lock.yml).
#
# Single source of truth for every external artifact (BUILD_PROMPT §10.1,
# §19.4). Every value is verified at build time and its section records
# `verified_on` and `source`. A value that could not be verified is the
# marker `TODO(verify)`; `make lock-check` fails while any marker remains and
# re-checks every digest, checksum and key fingerprint over the network.
# Structure: tools/lockcheck/schema/versions-lock.schema.json (`make lint`).
# Updating: docs/how-to/update-versions.md (`make lock-update` prints the
# procedure; nothing is bumped automatically).
#
# Generated from this file by `make generate` (never edit them by hand):
# bootstrap/lib/pins.sh, bootstrap/requirements.in, ansible/requirements.yml,
# ansible/group_vars/all/versions.yml and docs/reference/versions.md.
# bootstrap/requirements.lock is compiled from requirements.in with
# `make bootstrap-lock`.
schema_version: 1
verified_on: 2026-10-05

fedora_supported_releases:
  # "current and previous" Fedora releases (BUILD_PROMPT §19.2). Fedora 42
  # reached its end of life on 2026-05-13. Fedora 45 is not in the osinfo-db
  # snapshot used (2026-07-10); re-verify when Fedora 45 is released.
  releases: ["43", "44"]
  verified_on: 2026-10-05
  source: >-
    osinfo-db 0.20251212+git20260710.7306ae26 (archive.ubuntu.com, package sha256
    cb48ca157c25aacbec867581ea1f33a8494d7f7bface3cb6691dc68f141f48e2): fedora-43
    released 2025-10-28, end of life 2026-12-09; fedora-44 released 2026-04-26,
    end of life 2027-06-02

