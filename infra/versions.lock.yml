python:
  # CPython installed by the pinned uv into /opt/pokus/python; uv checks the
  # download against the sha256 in its own release metadata.
  python_version: "3.12.15"
  python_build: >-
    python-build-standalone 20261003
    (cpython-3.12.15+20261003-<arch>-unknown-linux-gnu-install_only_stripped)
  # Packages of /opt/pokus/ansible-venv (hash-locked in bootstrap/requirements.lock).
  packages:
    ansible-core: "2.21.5"
    jmespath: "1.1.0"      # json_query filter
    cryptography: "50.0.2"  # community.crypto modules (owner answer E12)
  verified_on: 2026-10-05
  source: >-
    PyPI JSON API (pypi.org/pypi/<name>/<version>/json) for the packages;
    `uv python list 3.12.15 --only-downloads` of uv 0.12.23 for the CPython build

