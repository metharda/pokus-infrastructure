# Managed by pinka (preflight/support-matrix.yml).
#
# Source of truth for the preflight decision. `make generate`
# compiles it to support-matrix.json (the evaluator reads only the JSON, so
# preflight needs no YAML parser) and renders docs/support-matrix.md; CI fails
# if either is out of date. References of the form "@versions.lock:<dotted.key>"
# are resolved from ../versions.lock.yml at generation time.
#
# Lifecycle data: `lifecycle` records the vendor's end of regular support and
# where that date was verified. Policy: only releases that
# have not reached the end of regular support appear in a supporting tier.
schema_version: 1

families:
  debian: {pkg: apt}
  redhat: {pkg: dnf}
  suse: {pkg: zypper}
  archlinux: {pkg: pacman}

# Best first. A host's tier is the worst of its OS, architecture and
# environment tiers.
tiers: [supported, tested, experimental, unsupported]

tier_notes:
  tested: "Tested tier: full provisioning is tested in VMs; GPU paths are not hardware-tested on this distribution."
  experimental: "Experimental tier: continue only with --accept-experimental or interactive confirmation."

release_model_notes:
  fast: "Fast-moving release: only the current and the previous release are in the matrix."
  rolling: >-
    Rolling release: installed versions drift over time. Results are comparable only within the
    same environment fingerprint; update the host only with 'pinka update-host'.

# The note for a release marked pending_verification (below) while the latest
# make test-distros run of one of its targets has not passed every stage.
pending_verification_note: >-
  Pending verification: no make test-distros run of this release has passed yet, or the latest
  run of one of its targets did not pass every stage. It is in its tier by the support matrix's
  rules; the test VMs have not proven an install on it.

lifecycle_sources:
  distro-info-data: >-
    Debian/Ubuntu distro-info-data 2026.08.20-1 (archive.ubuntu.com, package sha256
    77686dfe60970428c59ee0de9543c5d496e2e75216bc1f1516492d054ad799fd), verified 2026-10-05
  osinfo-db: >-
    osinfo-db 0.20251212+git20260710.7306ae26 (archive.ubuntu.com, package sha256
    cb48ca157c25aacbec867581ea1f33a8494d7f7bface3cb6691dc68f141f48e2), verified 2026-10-05

# source_group: the group of ansible/component-sources.yml whose sources the play
# uses on the release (platform_facts' release identity; a test keeps the two
# equal). make generate adds bootstrap_installs_nvidia_driver to each rule from
# the group's nvidia_driver entry.
os:  # first match wins
  # supported: full provisioning tested in VMs on every release AND on the reference GPU hardware
  - match: {id: ubuntu, version_id: "24.04"}
    family: debian
    source_group: ubuntu
    tier: supported
    release_model: fixed
    lifecycle: {released: "2024-04-25", end_of_support: "2029-05-31", source: distro-info-data}
  # Pending verification unless the latest make test-distros run of each of its
  # targets passed every stage (make generate reads tests/distros/results.yml,
  # never a hand edit).
  - match: {id: ubuntu, version_id: "26.04"}
    family: debian
    source_group: ubuntu
    tier: supported
    release_model: fixed
    pending_verification: true
    lifecycle: {released: "2026-04-23", end_of_support: "2031-05-29", source: distro-info-data}
  - match: {id: debian, version_id: "13"}
    family: debian
    source_group: debian
    tier: supported
    release_model: fixed
    lifecycle: {released: "2025-08-09", end_of_support: "2028-08-09", source: distro-info-data}
  # tested: full provisioning + doctor --smoke tested in VMs; GPU paths not hardware-tested
  - match: {id: ubuntu, version_id: "22.04"}
    family: debian
    source_group: ubuntu
    tier: tested
    release_model: fixed
    lifecycle: {released: "2022-04-21", end_of_support: "2027-06-01", source: distro-info-data}
  - match: {id: fedora, version_id_in: "@versions.lock:fedora_supported_releases.releases"}
    family: redhat
    source_group: fedora
    tier: tested
    release_model: fast
    lifecycle: {source: osinfo-db}
  - match: {id_in: [rhel, almalinux, rocky, centos], version_major_in: ["9", "10"]}
    family: redhat
    source_group: rhel_like
    tier: tested
    release_model: fixed
  # TODO(verify): openSUSE Leap 15.6 end of support; drop the row if it has ended.
  - match: {id: opensuse-leap, version_id_in: ["15.6", "16.0"]}
    family: suse
    source_group: opensuse
    tier: tested
    release_model: fixed
  - match: {id: opensuse-tumbleweed}
    family: suse
    source_group: opensuse
    tier: tested
    release_model: rolling
  - match: {id: sles, version_major_in: ["15", "16"]}
    family: suse
    source_group: opensuse
    tier: experimental
    release_model: fixed
  - match: {id: arch}
    family: archlinux
    source_group: arch
    tier: tested
    release_model: rolling
  # Releases past their end of regular support and RHEL-compatible
  # major 8 are explicitly unsupported, before the ID_LIKE rows.
  - match: {id: debian, version_id: "12"}
    tier: unsupported
    lifecycle: {released: "2023-06-10", end_of_support: "2026-07-11", source: distro-info-data}
    reason: >-
      Debian 12 reached the end of regular security support on 2026-07-11 (Debian LTS continues
      until 2028-06-30). Upgrade to Debian 13.
  - match: {id_or_like_in: [rhel, centos, almalinux, rocky, ol], version_major_in: ["8"]}
    tier: unsupported
    reason: >-
      RHEL-compatible release 8: it predates the unified cgroup v2 default and is not a supported
      release. The cgroup v2 hierarchy can be enabled with the kernel argument
      'systemd.unified_cgroup_hierarchy=1', but install a supported release (9 or 10) instead.
  # A release of an implemented distribution that no row
  # above lists is explicitly unsupported, so it never falls through to the
  # ID_LIKE rows below (Ubuntu's ID_LIKE is debian, Rocky's names rhel).
  - match: {id_in: [ubuntu, debian, fedora, rhel, almalinux, rocky, centos, opensuse-leap, sles]}
    tier: unsupported
    reason: >-
      Release not in the support matrix: only the releases docs/support-matrix.md lists are
      supported or tested for this distribution. Install a listed release.
  # experimental: derivatives mapped to their parent through ID_LIKE (Mint, Pop!_OS, Zorin,
  # elementary, Kali, Oracle Linux, Manjaro, EndeavourOS, ...). Third-party repositories use the
  # PARENT release identity, never the derivative's own codename.
  - match: {id_like_contains: ubuntu}
    family: debian
    source_group: ubuntu
    tier: experimental
    release_model: fixed
    parent_from: UBUNTU_CODENAME
  - match: {id_like_contains: debian}
    family: debian
    source_group: debian
    tier: experimental
    release_model: fixed
    parent_from: DEBIAN_CODENAME
  - match: {id_like_contains_any: [rhel, fedora, centos]}
    family: redhat
    source_group: rhel_like
    tier: experimental
    release_model: fixed
    parent_from: VERSION_ID
  - match: {id_like_contains: suse}
    family: suse
    source_group: opensuse
    tier: experimental
    release_model: fixed
  - match: {id_like_contains: arch}
    family: archlinux
    source_group: arch
    tier: experimental
    release_model: rolling
  - match: {any: true}
    tier: unsupported
    reason: >-
      Distribution family not implemented. Run a supported distribution in a VM on this host
      (vm provider), or add a family (docs/distros/adding-a-family.md).

arch:
  - match: {machine: x86_64}
    tier: supported
  - match: {machine: aarch64}
    tier: experimental
    note: "aarch64 is experimental: core lab only; gpu_inference requires verified arm64 vLLM images; golden images are built per architecture."
  - match: {any: true}
    tier: unsupported
    reason: "Unsupported CPU architecture."

environment:
  baremetal: {tier: supported, provider: baremetal}
  wsl2: {tier: supported, provider: wsl2}
  vm:
    tier: supported
    provider: vm
    note: "Latency and resource measurements include virtualization overhead; the hypervisor is recorded in the fingerprint."
  wsl1: {tier: unsupported, reason: "WSL1 has no real Linux kernel; convert with 'wsl --set-version <distro> 2'"}
  container: {tier: unsupported, reason: "The lab needs its own kernel features, systemd as PID 1, and nested container/VM capabilities"}
  unknown: {tier: unsupported, reason: "Could not determine the environment reliably"}

# Nominal values. MemTotal is compared with tolerance × each memory threshold:
# the firmware and the kernel keep part of the installed memory.
# The floor is the core stack with no
# target running: below it the host is unsupported. Above it, the required
# and recommended memory and the free disk per mount point are computed from
# the operator's choices (preflight/requirements.yml).
minimums:
  memory_gib: {floor: 8, tolerance: 0.94}
  cpu_threads: {required: 8, recommended: 16}

core_requirements:  # failing any of these → unsupported (or needs_action when a provider rule resolves it)
  - id: systemd_pid1
    remediation: "PID 1 must be systemd."
  - id: cgroup2_unified
    remediation: "Boot with the unified cgroup v2 hierarchy (systemd.unified_cgroup_hierarchy=1) or use a release that defaults to it."
  - id: cgroup2_controllers
    values: [cpu, cpuset, memory, io, pids]
    remediation: "The cgroup v2 controllers cpu, cpuset, memory, io and pids must be available."
  - id: dev_net_tun
    remediation: "/dev/net/tun must exist (tun module or built-in); Tailscale needs it."
  - id: kernel_features
    values: [overlay, br_netfilter, nf_tables, veth]
    remediation: "The kernel must provide overlay, br_netfilter, nf_tables and veth (built in or loadable)."
  - id: no_blocking_conflicts
    remediation: "Resolve every blocking conflict listed above."

storage:  # first available backend wins (no `dir` backend)
  backends:
    - {feature: btrfs_pool, backend: btrfs}
    - {feature: lvm_thin_pool, backend: lvm}
  none_reason: >-
    No quota-capable storage: neither btrfs nor LVM thin provisioning (dm_thin_pool) is available.
    A `dir` storage backend cannot enforce disk quotas, so disk-exhaustion scenarios would fill the
    host disk.

features:  # optional; each becomes a boolean feature flag
  gpu_inference:
    # driver_cuda_min: the CUDA version the pinned vLLM image is built on;
    # its major.minor is compared with the CUDA version
    # the loaded driver supports (`nvidia-smi --version`, on WSL2 the Windows
    # driver's).
    requires:
      - nvidia_gpu_usable
      # The memory nvidia-smi reports (memory.total, MiB), compared unrounded.
      # An 8 GB card reports a little less than 8192 MiB (8188 MiB for an
      # RTX 4060 Ti 8 GB), a 6 GB card 6144 MiB: 8000 MiB admits the first by
      # the rule itself, with room below 8188 for a card that reserves a little
      # more, and refuses the second.
      - {gpu_vram_mib_min: 8000}
      # V7: the pinned vLLM image
      # has kernels from compute capability 7.5 on (its TORCH_CUDA_ARCH_LIST);
      # no override enables gpu_inference below it.
      - {gpu_compute_capability_min: "7.5"}
      - {driver_cuda_min: "@versions.lock:containers.images.vllm.cuda"}
    on_missing: degrade
    impact: "No usable GPU: vLLM will not be installed; inference campaigns cannot run on this host."
    remediation:
      gpu_compute_capability_min:
        default: >-
          The GPU's compute capability is {actual}, below {required}, the oldest the pinned vLLM
          image has kernels for: GPU inference is refused on this GPU; use a GPU with compute
          capability {required} or newer.
        unknown: >-
          nvidia-smi did not report the GPU's compute capability; GPU inference needs compute
          capability {required} or newer.
      driver_cuda_min:
        default: >-
          The NVIDIA driver supports CUDA {actual}, the pinned vLLM image needs {required}:
          install a driver branch that supports CUDA {required}.
        wsl2: >-
          The NVIDIA driver supports CUDA {actual}, the pinned vLLM image needs {required}:
          update the NVIDIA driver on Windows (never install a Linux NVIDIA driver inside WSL).
        unknown: >-
          nvidia-smi did not report the CUDA version the NVIDIA driver supports; the pinned vLLM
          image needs {required}: update the NVIDIA driver (on WSL2, on Windows).
    # inference: on, and an inference node, refuse a host without a usable GPU
    # (unless bootstrap installs the driver in this run): the first rule that
    # holds says what makes the GPU usable.
    without_usable_gpu:
      # On WSL2 a GPU is seen only through the Windows driver's nvidia-smi.
      - when: {environment: wsl2, nvidia_gpu_present: false}
        text: >-
          WSL reaches no NVIDIA GPU: it sees one only through the NVIDIA driver on Windows.
          Install or update that driver on Windows (on a machine with an NVIDIA GPU that meets
          them), then run bootstrap again.
      - when: {nvidia_gpu_present: false}
        text: Use an NVIDIA GPU that meets them.
      - when: {environment: wsl2}
        text: >-
          In WSL the GPU is reached through the NVIDIA driver on Windows: install or update it
          there and remove any Linux NVIDIA driver installed inside WSL, then run bootstrap again.
      - when: {nvidia_driver_installed: true}
        text: >-
          An NVIDIA driver is installed but nvidia-smi does not reach the GPU: load or repair the
          driver (a reboot may be needed after its installation), then run bootstrap again.
      - when: {nvidia_driver_mode: manual}
        text: >-
          install_nvidia_driver is manual: install the NVIDIA driver following your distribution's
          documentation, then run bootstrap again. Until then bootstrap stops at the driver,
          whatever the inference setting; install_nvidia_driver: skip installs the lab without
          the GPU.
      - when: {nvidia_gpu_open_module_supported: false, nvidia_gpu_proprietary_only: true}
        text: >-
          No driver is installed for this GPU: the pinned NVIDIA driver supports it only with its
          proprietary kernel module (below compute capability 7.5, which the vLLM image needs).
          Use a GPU of compute capability 7.5 or newer (Turing or later).
      - when: {nvidia_gpu_open_module_supported: false}
        text: >-
          No driver is installed for this GPU: the pinned NVIDIA driver does not list it (an older
          GPU only a legacy branch supports, a GPU newer than the pinned driver, or a PCI device ID
          that could not be read). Install a driver that supports it yourself
          (install_nvidia_driver: manual), then run bootstrap again, or use a GPU the pinned driver
          supports.
      - when: {nvidia_driver_bootstrap_installs: false}
        text: >-
          pinka has no verified installation method for the NVIDIA driver on this distribution:
          install it following your distribution's documentation, then run bootstrap again. Until
          then bootstrap stops at the driver, whatever the inference setting;
          install_nvidia_driver: skip installs the lab without the GPU.
      - when: {nvidia_driver_mode: skip}
        text: >-
          install_nvidia_driver is skip: set it to auto so that bootstrap installs the driver (with
          Secure Boot on, also consent to the MOK enrollment), or install the driver yourself, then
          run bootstrap again.
      - when: {secure_boot: enabled, mok_enrollment_accepted: false}
        text: >-
          Secure Boot is on: consent to the MOK enrollment (--accept-mok-enrollment, or in the
          installer) so that bootstrap installs the NVIDIA driver, or install it yourself.
      - when: {nvidia_gpu_present: true}
        text: Make the GPU usable (an NVIDIA driver nvidia-smi reaches), then run bootstrap again.
  # The GPU arbiter's training jobs: a job's image
  # brings its own CUDA, so the driver's CUDA version is not compared. Without
  # it no job gets the GPU; training: cpu runs the jobs' CPU-only variant.
  gpu_training:
    requires:
      - nvidia_gpu_usable
      - {gpu_vram_mib_min: 8000}  # as gpu_inference's
      - {gpu_compute_capability_min: "7.0"}
    on_missing: degrade
    impact: "No usable GPU for training: no training job gets a GPU; with training: cpu the jobs' CPU-only variant runs."
  vm_targets:
    requires: [kvm_usable]
    on_missing: degrade
    impact: "No KVM: VM-class scenarios (kernel-level faults) cannot run on this host."
  btrfs_pool:
    requires: [btrfs_available]
    on_missing: fallback
    fallback: lvm_thin_pool
    impact: "No btrfs: the Incus pool falls back to LVM thin provisioning."
  lvm_thin_pool:
    requires: [dm_thin_pool_available]
    on_missing: degrade
    only_if_missing: btrfs_pool
    impact: "No LVM thin provisioning."
  dcgm_metrics:
    requires: [{environment_in: [baremetal, vm]}, nvidia_driver_loaded]
    on_missing: fallback
    impact: "No DCGM: GPU metrics come from the nvidia-smi exporter."

provider_rules:
  wsl2:
    needs_action:
      - id: wsl_enable_systemd
        when: {wsl_conf_systemd: false}
        resolves: [systemd_pid1]
        action: "Enable systemd in /etc/wsl.conf (the bootstrap can write it), then run 'wsl --terminate <distro>' from Windows and re-run bootstrap"
    warnings:
      - when: {wsl_interop_enabled: true}
        message: "Windows interop is enabled; the wsl2 provider will disable it"
      - when: {wsl_automount_enabled: true}
        message: "Windows drive automount is enabled; the wsl2 provider will disable it"
  baremetal:
    needs_action:
      # With install_nvidia_driver auto and the operator's
      # consent (--accept-mok-enrollment, the installer, or the answers file),
      # the rule becomes a planned action and bootstrap does the work. manual
      # stays needs_action; skip leaves the GPU unused (degraded), and so does
      # auto for a GPU the pinned driver's open kernel module does not support
      # (nvidia_driver_planned none).
      - id: secure_boot_mok
        when: {secure_boot: enabled, nvidia_driver_installed: false, nvidia_gpu_present: true, nvidia_driver_planned_in: [auto, manual]}
        action: >-
          Secure Boot is on: the NVIDIA DKMS module must be signed and a MOK enrolled at next boot.
          With install_nvidia_driver: auto, consent with --accept-mok-enrollment (or in the installer)
          and bootstrap installs the driver and imports the MOK; otherwise install the driver yourself.
          See docs/providers/baremetal.md
        planned_when: {nvidia_driver_mode: auto, mok_enrollment_accepted: true}
        planned: >-
          Secure Boot is on: bootstrap installs the NVIDIA driver, imports a Machine Owner Key with your
          one-time password and stops with 76; reboot, enroll the key at the blue MOK Manager screen,
          then re-run bootstrap
    warnings:
      - when:
          nvidia_gpu_present: true
          nvidia_driver_loaded: false
          nvidia_gpu_open_module_supported: false
          nvidia_gpu_proprietary_only: true
          nvidia_driver_mode: auto
        message: >-
          No usable GPU: the pinned NVIDIA driver supports this GPU only with its proprietary kernel
          module (Maxwell, Pascal and Volta, below compute capability 7.5), and a driver is installed
          automatically only for a GPU its open kernel module supports (Turing or later), so the lab
          installs without GPU features. See docs/providers/baremetal.md
      - when:
          nvidia_gpu_present: true
          nvidia_driver_loaded: false
          nvidia_gpu_open_module_supported: false
          nvidia_gpu_proprietary_only: false
          nvidia_driver_mode: auto
        message: >-
          No usable GPU: the pinned NVIDIA driver does not support this GPU (only an older legacy
          branch does, or NVIDIA's list does not name it), so no driver is installed for it
          automatically and the lab installs without GPU features. See docs/providers/baremetal.md
  vm:
    warnings:
      - when: {hypervisor_in: [microsoft, vmware, oracle], kvm_usable: false}
        message: "Nested virtualization unavailable in this hypervisor; VM-class targets disabled"
      - when:
          nvidia_gpu_present: true
          nvidia_driver_loaded: false
          nvidia_gpu_open_module_supported: false
          nvidia_gpu_proprietary_only: true
          nvidia_driver_mode: auto
        message: >-
          No usable GPU: the pinned NVIDIA driver supports this GPU only with its proprietary kernel
          module (Maxwell, Pascal and Volta, below compute capability 7.5), and a driver is installed
          automatically only for a GPU its open kernel module supports (Turing or later), so the lab
          installs without GPU features. See docs/providers/baremetal.md
      - when:
          nvidia_gpu_present: true
          nvidia_driver_loaded: false
          nvidia_gpu_open_module_supported: false
          nvidia_gpu_proprietary_only: false
          nvidia_driver_mode: auto
        message: >-
          No usable GPU: the pinned NVIDIA driver does not support this GPU (only an older legacy
          branch does, or NVIDIA's list does not name it), so no driver is installed for it
          automatically and the lab installs without GPU features. See docs/providers/baremetal.md
