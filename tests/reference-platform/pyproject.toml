# The reference platform: standard library only. The build
# backend is locked in the build group, so the offline build installs the
# console scripts without network.
[project]
name = "refplat"
version = "0.1.0"
description = "The reference platform of Pokus Infrastructure's tests."
requires-python = "==3.12.*"
dependencies = []

[project.scripts]
refplat = "refplat.cli:main"
refplat-ctl = "refplat.ctl:main"
refplat-admin = "refplat.admin:main"
refplat-broker = "refplat.broker:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[dependency-groups]
build = ["uv_build>=0.12.23,<0.13"]

[tool.uv.workspace]
members = ["packages/refplat-agent"]
